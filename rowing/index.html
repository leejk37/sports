<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로잉머신 기록</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e8c">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="로잉머신">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --blue:#1f4e8c; --blue-d:#173d6e; --yellow:#f5c518; --ink:#ffffff;
    --soft:rgba(255,255,255,.82); --good:#7ee8b5; --warn:#ffb199;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Pretendard,system-ui,sans-serif;background:var(--blue);color:var(--ink)}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:4px solid var(--yellow)}
  header h1{margin:0;font-size:24px;font-weight:800;flex:1;letter-spacing:-.5px}
  #who{font-size:17px;font-weight:700;color:var(--soft)}
  .hbtn{font:inherit;font-size:15px;font-weight:700;padding:8px 12px;border-radius:8px;
    border:1.5px solid rgba(255,255,255,.75);background:transparent;color:#fff;cursor:pointer}

  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:22px;min-height:0;overflow:auto}
  .screen{display:none;flex-direction:column;align-items:center;gap:20px;width:min(560px,100%)}
  .screen.on{display:flex}
  h2{margin:0;font-size:34px;font-weight:800;text-align:center;line-height:1.3;letter-spacing:-.5px}
  p.sub{margin:0;font-size:19px;font-weight:600;color:var(--soft);text-align:center;line-height:1.55}

  button.btn{font:inherit;width:100%;font-size:24px;font-weight:800;padding:20px;border-radius:16px;cursor:pointer;
    border:2px solid #fff;background:#fff;color:var(--blue);text-align:left}
  button.btn small{display:block;font-size:16px;font-weight:600;opacity:.75;margin-top:4px}
  button.btn.line{background:transparent;color:#fff;text-align:center;font-size:20px;padding:14px}
  button.btn.center{text-align:center}
  button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  #scanBox{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:16px;overflow:hidden;border:3px solid var(--yellow)}
  #scanBox video{width:100%;height:100%;object-fit:cover}

  .badge{font-size:18px;font-weight:800;padding:6px 16px;border-radius:999px;background:var(--yellow);color:var(--blue)}
  .big{font-size:min(16vmin,96px);line-height:1}

  .field{width:100%;display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}
  .field > span{width:120px;flex:none}
  .field input{min-width:0;font:inherit;font-size:40px;font-weight:900;padding:10px 14px;border-radius:12px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;text-align:right}
  .field input.wide{flex:1}
  .field input.mm, .field input.ss{width:110px}
  .field em{font-style:normal;color:var(--soft)}
  .field input::placeholder{font-size:20px;font-weight:600}
  .field.fixed input{border-style:dashed}
  .rows{width:100%;border-top:1px solid rgba(255,255,255,.25)}
  .row{display:flex;justify-content:space-between;font-size:21px;font-weight:700;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.25)}
  #saveState{width:100%;font-size:18px;font-weight:700;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.12);text-align:center}
  #saveState:empty{display:none}
  #saveState.ok{color:var(--good)}
  #saveState.fail{color:var(--warn)}
  #flash{position:fixed;left:50%;top:80px;transform:translateX(-50%);padding:10px 22px;border-radius:12px;
    background:#d9480f;font-size:22px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none}
  #flash.on{opacity:1}
</style>
<script src="../config.js"></script>
</head>
<body>
<div id="app">
  <header>
    <h1>로잉머신 기록</h1>
    <span id="who"></span>
    <button class="hbtn" id="cancel">처음으로</button>
  </header>

  <main>
    <!-- QR 스캔 (허브에서 오지 않았을 때만) -->
    <section class="screen" id="s-scan">
      <h2>QR 이름표를 보여 주세요</h2>
      <div id="scanBox"><video id="video" playsinline muted></video></div>
    </section>

    <!-- 방식 고르기 -->
    <section class="screen" id="s-mode">
      <h2>어떻게 탈까요?</h2>
      <button class="btn" id="modeTime">시간 정해서 타기<small>로잉머신에 시간을 맞추고, 끝나면 간 거리를 적어요</small></button>
      <button class="btn" id="modeDist">거리 정해서 타기<small>로잉머신에 거리를 맞추고, 끝나면 걸린 시간을 적어요</small></button>
      <button class="btn line" id="rescan">다른 학생</button>
    </section>

    <!-- 타는 중 -->
    <section class="screen" id="s-row">
      <span class="badge" id="modeBadge"></span>
      <h2>로잉머신에서<br><span id="rowGuide"></span></h2>
      <p class="sub">로잉머신이 멈추면 아래 버튼을 눌러요</p>
      <button class="btn center" id="doneBtn">다 탔어요 · 기록 적기</button>
      <button class="btn line" id="backMode">방식 다시 고르기</button>
    </section>

    <!-- 기록 입력 -->
    <section class="screen" id="s-input">
      <h2>로잉머신 화면의<br>기록을 적어요</h2>
      <label class="field" id="fTime"><span id="lTime">시간</span>
        <input class="mm" id="mm" type="number" inputmode="numeric" min="0" max="60" step="1" placeholder="0"><em>분</em>
        <input class="ss" id="ss" type="number" inputmode="numeric" min="0" max="59" step="1" placeholder="0"><em>초</em></label>
      <label class="field" id="fDist"><span id="lDist">거리</span>
        <input class="wide" id="km" type="number" inputmode="decimal" min="0" max="20" step="0.001" placeholder="0.000"><em>km</em></label>
      <label class="field"><span>평균 SPM</span>
        <input class="wide" id="spm" type="number" inputmode="numeric" min="0" max="60" step="1" placeholder="모르면 비워요"><em>회/분</em></label>
      <p class="sub">SPM은 1분 동안 노를 당긴 횟수예요</p>
      <button class="btn center" id="saveBtn">저장하기</button>
    </section>

    <!-- 결과 -->
    <section class="screen" id="s-result">
      <h2>기록 완료!</h2>
      <div class="rows" id="resRows"></div>
      <div id="saveState"></div>
      <button class="btn line" id="retrySave" hidden>다시 저장</button>
      <button class="btn center" id="again">한 번 더</button>
      <button class="btn line" id="next">다음 학생</button>
    </section>
  </main>
</div>
<div id="flash"></div>

<script>
/* ===== 설정: 다른 운동 앱과 같은 GAS_URL, TOKEN ===== */
const CONFIG = {
  GAS_URL: SITE.GAS_URL,
  TOKEN:   SITE.TOKEN,
  TYPE:    'rowing',
  DOMAIN:  SITE.DOMAIN,
  MAX_SEC: 3600,         // 60분
  MAX_KM:  20,
  SAVE_TIMEOUT_MS: 30000
};

const $ = id => document.getElementById(id);
let email = '', clientId = '', mode = '', rec = {};
let stream, scanTimer;
const mmss = s => Math.floor(s / 60) + '분 ' + String(s % 60).padStart(2, '0') + '초';

function show(m) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + m));
  if (m !== 'scan') stopCamera();
}
let audio;
function beep(freq = 880, ms = 120) {
  try {
    audio ??= new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.3, audio.currentTime);
    o.start(); o.stop(audio.currentTime + ms / 1000);
  } catch (e) {}
}
let flashT;
function flash(t) { $('flash').textContent = t; $('flash').classList.add('on'); clearTimeout(flashT); flashT = setTimeout(() => $('flash').classList.remove('on'), 1600); }

/* ===== QR 스캔 (허브를 거치지 않을 때) ===== */
async function startScan() {
  show('scan');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    $('video').srcObject = stream; await $('video').play();
    const c = document.createElement('canvas'), cx = c.getContext('2d', { willReadFrequently: true });
    scanTimer = setInterval(() => {
      const v = $('video'); if (!v.videoWidth) return;
      c.width = 640; c.height = Math.round(640 * v.videoHeight / v.videoWidth);
      cx.drawImage(v, 0, 0, c.width, c.height);
      const code = jsQR(cx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
      if (!code) return;
      const id = code.data.trim();
      if (!/^[\w.\-]+(@[\w.\-]+)?$/.test(id)) { flash('이름표 QR이 아니에요'); return; }
      email = (id.includes('@') ? id : id + CONFIG.DOMAIN).toLowerCase();
      $('who').textContent = email.split('@')[0];
      beep(1200, 80); show('mode');
    }, 250);
  } catch (e) { flash('카메라를 열 수 없어요'); }
}
function stopCamera() { clearInterval(scanTimer); stream?.getTracks().forEach(t => t.stop()); stream = null; }

/* ===== 방식 → 타기 → 입력 ===== */
function pick(m) {
  mode = m; beep(660, 60);
  clientId = crypto.randomUUID?.() || String(Date.now()) + Math.random();
  const t = m === 'time';
  $('modeBadge').textContent = t ? '시간 정해서 타기' : '거리 정해서 타기';
  $('rowGuide').textContent = t ? '시간을 맞추고 타요' : '거리를 맞추고 타요';
  show('row');
}
function toInput() {
  const t = mode === 'time';
  $('lTime').textContent = t ? '정한 시간' : '걸린 시간';
  $('lDist').textContent = t ? '간 거리' : '정한 거리';
  ['mm', 'ss', 'km', 'spm'].forEach(id => $(id).value = '');
  show('input');
  (t ? $('km') : $('mm')).focus();
}
function finish() {
  const mm = parseInt($('mm').value || '0', 10), ss = parseInt($('ss').value || '0', 10);
  const seconds = mm * 60 + ss;
  const km = Math.round(parseFloat($('km').value) * 1000) / 1000;
  const spmRaw = $('spm').value.trim(), spm = spmRaw === '' ? '' : parseInt(spmRaw, 10);

  if (!(mm >= 0 && ss >= 0 && ss <= 59) || seconds <= 0 || seconds > CONFIG.MAX_SEC) { flash('시간을 확인해 주세요 (초는 0~59)'); return; }
  if (!(km > 0 && km <= CONFIG.MAX_KM)) { flash('거리를 km로 적어 주세요 (예: 1.250)'); return; }
  if (spm !== '' && !(spm >= 0 && spm <= 60)) { flash('SPM은 0~60 사이로 적어요'); return; }

  rec = { mode, seconds, distanceKm: km, spm };
  const row = (k, v) => `<div class="row"><span>${k}</span><span>${v}</span></div>`;
  $('resRows').innerHTML =
    row('방식', mode === 'time' ? '시간 정해서 타기' : '거리 정해서 타기') +
    row('시간', mmss(seconds)) +
    row('거리', km.toFixed(3) + ' km') +
    row('평균 SPM', spm === '' ? '–' : spm + ' 회/분');
  show('result');
  save();
}

/* ===== 저장 ===== */
function setSave(text, cls) {
  const el = $('saveState'); el.textContent = text; el.className = cls || '';
  $('retrySave').hidden = cls !== 'fail';
}
async function save() {
  setSave('저장 중…');
  const body = { type: CONFIG.TYPE, token: CONFIG.TOKEN, email, ...rec, clientId };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.SAVE_TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.GAS_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body), redirect: 'follow', credentials: 'omit', signal: ctrl.signal
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { throw new Error('서버 응답을 읽지 못했어요: ' + text.slice(0, 60)); }
    if (data.ok !== true) throw new Error(data.error || '서버에서 저장을 거부했어요');
    setSave((data.name ? data.name + ' 학생 ' : '') + '저장 완료', 'ok');
  } catch (e) {
    console.error(e);
    const serverRefused = /인증 실패|명단에 없는|학교 계정|거부/.test(e.message);
    const unreadable = !serverRefused && (e.name === 'TypeError' || String(e.message).includes('<!DOCTYPE'));
    if (unreadable && navigator.onLine) {
      setSave('전송 완료 (결과 확인 불가 · 시트에서 확인)', 'ok');
      $('retrySave').hidden = false;   // 같은 clientId라 다시 보내도 중복 저장 안 됨
      return;
    }
    setSave('저장 실패: ' + (e.name === 'AbortError' ? '응답이 늦어요. 시트를 확인해 주세요.' : e.message), 'fail');
  } finally { clearTimeout(timer); }
}

/* ===== 허브 연결 ===== */
const PARAMS = new URLSearchParams(location.search);
const FROM_HUB = PARAMS.get('from') === 'hub';
function backOrScan() {
  if (FROM_HUB) { location.href = '../'; return; }
  email = ''; $('who').textContent = ''; startScan();
}
if (FROM_HUB) {
  $('next').textContent = '허브로 돌아가기';
  $('rescan').textContent = '허브로 돌아가기';
  $('cancel').textContent = '허브로';
}

/* ===== 버튼 ===== */
$('modeTime').onclick = () => pick('time');
$('modeDist').onclick = () => pick('distance');
$('doneBtn').onclick = toInput;
$('backMode').onclick = () => show('mode');
$('saveBtn').onclick = finish;
$('again').onclick = () => show('mode');
$('retrySave').onclick = save;
$('rescan').onclick = $('next').onclick = $('cancel').onclick = backOrScan;
$('ss').addEventListener('input', () => { if (+$('ss').value > 59) $('ss').value = 59; });

/* ===== 시작 ===== */
(() => {
  const em = (PARAMS.get('email') || '').trim().toLowerCase();
  if (/^[\w.\-]+@[\w.\-]+$/.test(em)) {
    email = em;
    $('who').textContent = (PARAMS.get('name') || em.split('@')[0]) + ' 학생';
    show('mode');
  } else startScan();
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
}
</script>
</body>
</html>
