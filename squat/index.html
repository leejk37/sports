<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스쿼트 측정</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root {
    --court: #1E4D8C;      /* 체육관 코트 파랑 */
    --court-deep: #14325C;
    --line: #FFD23F;       /* 코트 라인 노랑 */
    --chalk: #FFFFFF;
    --good: #2BB673;
    --bad: #E5484D;
    --ink: #14213D;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--court-deep);
    color: var(--chalk);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    border-bottom: 4px solid var(--line);
    background: var(--court);
  }
  header h1 { font-family: "Jua", sans-serif; font-weight: 400; font-size: 1.6rem; margin: 0; }
  #who { margin-left: auto; font-size: 1rem; opacity: .9; }
  .icon-btn {
    background: transparent; color: var(--chalk);
    border: 2px solid rgba(255,255,255,.5); border-radius: 8px;
    padding: 6px 10px; font-size: .9rem; cursor: pointer;
  }

  main { flex: 1; display: grid; grid-template-columns: 1fr minmax(280px, 34%); min-height: 0; }
  @media (orientation: portrait) {
    main { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
  }

  .stage { position: relative; background: #000; min-height: 0; overflow: hidden; }
  .stage video, .stage canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  }
  .mirror { transform: scaleX(-1); }
  #hint {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: rgba(20,33,61,.85); padding: 10px 18px; border-radius: 999px;
    font-size: 1.15rem; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
  }
  #hint.warn { background: var(--bad); }
  #hint:empty { display: none; }
  #countdown {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: "Jua", sans-serif; font-size: 40vmin; color: var(--line);
    text-shadow: 0 6px 0 var(--court-deep); pointer-events: none;
  }
  #countdown:empty { display: none; }
  #flash {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    font-family: "Jua", sans-serif; font-size: 2.4rem; padding: 6px 22px; border-radius: 14px;
    opacity: 0; transition: opacity .15s;
  }
  #flash.show { opacity: 1; }
  #flash.good { background: var(--good); }
  #flash.bad { background: var(--bad); }

  /* 깊이 게이지: 무릎 각도를 막대로 보여줌 */
  #gauge {
    position: absolute; right: 14px; top: 14px; bottom: 70px; width: 26px;
    border: 3px solid var(--chalk); border-radius: 14px; overflow: hidden;
    background: rgba(255,255,255,.12);
  }
  #gaugeFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: var(--line); transition: height .08s linear; }
  #gaugeTarget { position: absolute; left: -3px; right: -3px; height: 4px; background: var(--good); }

  .panel {
    background: var(--court); padding: 20px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 16px;
    border-left: 4px solid var(--line);
  }
  @media (orientation: portrait) { .panel { border-left: 0; border-top: 4px solid var(--line); } }
  section[hidden] { display: none !important; }
  section { display: flex; flex-direction: column; gap: 14px; }
  .lead { font-family: "Jua", sans-serif; font-size: 1.7rem; line-height: 1.3; margin: 0; }
  .sub { margin: 0; opacity: .85; line-height: 1.6; }

  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; padding: 12px; font-size: 1.1rem; border-radius: 10px; cursor: pointer;
    background: transparent; color: var(--chalk); border: 2px solid rgba(255,255,255,.5);
    font-family: inherit;
  }
  .seg button[aria-pressed="true"] { background: var(--chalk); color: var(--court); border-color: var(--chalk); font-weight: 700; }

  .primary {
    padding: 18px; font-size: 1.5rem; font-family: "Jua", sans-serif;
    background: var(--line); color: var(--ink); border: 0; border-radius: 14px; cursor: pointer;
    box-shadow: 0 5px 0 #C9A21F;
  }
  .primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #C9A21F; }
  .secondary {
    padding: 14px; font-size: 1.1rem; font-family: inherit;
    background: transparent; color: var(--chalk); border: 2px solid rgba(255,255,255,.6);
    border-radius: 12px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--line); outline-offset: 3px; }

  .big-count {
    font-family: "Jua", sans-serif; font-size: clamp(6rem, 22vmin, 14rem); line-height: .9;
    color: var(--line); text-align: center; margin: 0;
  }
  .count-label { text-align: center; font-size: 1.2rem; margin: 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--court-deep); border-radius: 12px; padding: 10px 12px; }
  .stat b { display: block; font-family: "Jua", sans-serif; font-size: 1.8rem; font-weight: 400; }
  .stat span { font-size: .9rem; opacity: .85; }
  #timer { font-family: "Jua", sans-serif; font-size: 2.2rem; text-align: center; margin: 0; }
  #saveStatus { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--court-deep); }
  #saveStatus.ok { background: var(--good); }
  #saveStatus.err { background: var(--bad); }

  @media (prefers-reduced-motion: reduce) { #flash, #gaugeFill { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>스쿼트 측정</h1>
  <span id="who"></span>
  <button class="icon-btn" id="switchCam" type="button">카메라 전환</button>
</header>

<main>
  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="gauge" aria-hidden="true"><div id="gaugeFill"></div><div id="gaugeTarget"></div></div>
    <div id="flash"></div>
    <div id="countdown"></div>
    <div id="hint">AI 모델을 불러오는 중이에요</div>
  </div>

  <aside class="panel">
    <!-- 1. QR 확인 -->
    <section id="scanPanel" hidden>
      <p class="lead">QR 이름표를<br>카메라에 보여 주세요</p>
      <p class="sub">이름표가 확인되면 측정 준비 화면으로 넘어가요.</p>
    </section>

    <!-- 2. 준비 -->
    <section id="readyPanel" hidden>
      <p class="lead">옆으로 서서<br>온몸이 보이게 해요</p>
      <p class="sub">무릎이 노란 막대의 초록 선 아래까지 내려가야 1회로 세요. 허리는 곧게!</p>
      <div class="seg" role="group" aria-label="측정 시간">
        <button type="button" data-sec="30" aria-pressed="true">30초</button>
        <button type="button" data-sec="60" aria-pressed="false">1분</button>
      </div>
      <button class="primary" id="startBtn" type="button">측정 시작</button>
      <button class="secondary" id="changeStudent" type="button">다른 학생으로 바꾸기</button>
    </section>

    <!-- 3. 측정 중 -->
    <section id="runPanel" hidden>
      <p id="timer">30</p>
      <p class="big-count" id="goodNow">0</p>
      <p class="count-label">정확한 스쿼트</p>
      <div class="stats">
        <div class="stat"><b id="depthNow">0</b><span>더 깊이 필요</span></div>
        <div class="stat"><b id="backNow">0</b><span>허리 숙임</span></div>
      </div>
      <button class="secondary" id="stopBtn" type="button">측정 그만하기</button>
    </section>

    <!-- 4. 결과 -->
    <section id="resultPanel" hidden>
      <p class="count-label">정확한 스쿼트</p>
      <p class="big-count" id="goodFinal">0</p>
      <div class="stats">
        <div class="stat"><b id="depthFinal">0</b><span>더 깊이 필요</span></div>
        <div class="stat"><b id="backFinal">0</b><span>허리 숙임</span></div>
      </div>
      <p id="saveStatus">기록을 저장하는 중이에요</p>
      <button class="secondary" id="retrySave" type="button" hidden>다시 저장하기</button>
      <button class="primary" id="nextStudent" type="button">다음 학생</button>
      <button class="secondary" id="again" type="button">한 번 더 측정</button>
    </section>
  </aside>
</main>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ========== 설정: 여기만 바꾸면 돼요 ========== */
const CONFIG = {
  GAS_URL: "https://script.google.com/macros/s/AKfycbzZIU-UeiWcXuN47lW4XSSwvD9EgP06NdJYrX5NKDf96oqEnfsqaI0B2B3YrvZ6Yw0eVw/exec",   // .../exec 로 끝나는 주소
  TOKEN: "26cp4s_squat",                    // GAS 코드의 TOKEN과 같게
  EMAIL_DOMAIN: "@cpe.es.kr",
  UP_ANGLE: 160,       // 이 각도 이상이면 '선 자세'
  DOWN_ANGLE: 100,     // 이 각도 이하까지 내려가야 정확한 스쿼트
  IGNORE_ANGLE: 135,   // 이보다 덜 굽히면 흔들림으로 보고 무시
  MAX_LEAN: 50,        // 상체가 수직에서 이 각도보다 더 숙여지면 '허리 숙임'
  MIN_VISIBILITY: 0.5  // 관절이 이만큼 확실히 보여야 측정
};
/* ============================================ */

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("overlay"), ctx = canvas.getContext("2d");
const scanCanvas = document.createElement("canvas");
const scanCtx = scanCanvas.getContext("2d", { willReadFrequently: true });

let landmarker, drawer, facing = "user";
let mode = "loading";            // loading | scan | ready | countdown | run | result
let student = null, studentName = "", duration = 30;
let good = 0, badDepth = 0, badBack = 0;
let rep = { down: false, minKnee: 180, maxLean: 0 };
let smoothKnee = null, endTime = 0, lastScan = 0, lastVideoTime = -1;
let lastPayload = null;

const LEFT  = { sh: 11, hip: 23, knee: 25, ank: 27 };
const RIGHT = { sh: 12, hip: 24, knee: 26, ank: 28 };

/* ---------- 허브 연결: 주소에 학생 정보가 있으면 QR 단계를 건너뜀 ---------- */
const PARAMS = new URLSearchParams(location.search);
const FROM_HUB = PARAMS.get("from") === "hub";
function startFromParams() {
  const em = (PARAMS.get("email") || "").trim().toLowerCase();
  if (!em.endsWith(CONFIG.EMAIL_DOMAIN)) return false;
  student = em;
  studentName = PARAMS.get("name") || "";
  goReady();
  return true;
}
function backOrScan() {
  if (FROM_HUB) { location.href = "../"; return; }   // 허브로 돌아가기
  goScan();
}
if (FROM_HUB) {
  $("nextStudent").textContent = "허브로 돌아가기";
  $("changeStudent").textContent = "허브로 돌아가기";
}

/* ---------- 화면 전환 ---------- */
function show(panel) {
  for (const id of ["scanPanel", "readyPanel", "runPanel", "resultPanel"]) $(id).hidden = id !== panel;
}
function setHint(text, warn = false) { $("hint").textContent = text; $("hint").classList.toggle("warn", warn); }
function goScan() {
  student = null; studentName = ""; $("who").textContent = ""; mode = "scan";
  show("scanPanel"); setHint("QR 이름표를 화면 가운데에 비춰 주세요");
}
function goReady() {
  mode = "ready"; show("readyPanel");
  $("who").textContent = studentName ? studentName + " 학생" : student.replace(CONFIG.EMAIL_DOMAIN, "");
  setHint("옆으로 서서 머리부터 발끝까지 보이게 해요");
}

/* ---------- 소리 ---------- */
let actx;
function beep(freq = 660, ms = 120) {
  try {
    actx = actx || new AudioContext();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; g.gain.value = 0.15;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + ms / 1000);
  } catch (e) { /* 소리 없이 계속 */ }
}
let flashTimer;
function flash(text, kind) {
  const f = $("flash");
  f.textContent = text; f.className = `${kind} show`;
  clearTimeout(flashTimer); flashTimer = setTimeout(() => f.classList.remove("show"), 700);
}

/* ---------- 카메라 ---------- */
async function startCamera() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  const mirror = facing === "user";
  video.classList.toggle("mirror", mirror);
  canvas.classList.toggle("mirror", mirror);
}

/* ---------- AI 모델 ---------- */
async function loadModel() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const make = delegate => PoseLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate
    },
    runningMode: "VIDEO", numPoses: 1
  });
  try { landmarker = await make("GPU"); } catch { landmarker = await make("CPU"); }
  drawer = new DrawingUtils(ctx);
}

/* ---------- QR 인식 ---------- */
function scanQR() {
  const w = 640, h = Math.round(video.videoHeight * w / video.videoWidth);
  scanCanvas.width = w; scanCanvas.height = h;
  scanCtx.drawImage(video, 0, 0, w, h);
  const code = jsQR(scanCtx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
  if (!code || !code.data) return;
  const raw = code.data.trim().toLowerCase();
  let email = "";
  if (raw.includes("@")) {
    email = raw;                                   // 이메일 전체가 들어 있는 경우
  } else if (/^[a-z0-9._-]+$/.test(raw)) {
    email = raw + CONFIG.EMAIL_DOMAIN;             // 아이디만 있으면 도메인 붙이기
  }
  if (email.endsWith(CONFIG.EMAIL_DOMAIN)) { student = email; studentName = ""; beep(880); goReady(); }
  else setHint("인식된 내용: " + raw.slice(0, 40), true);
}

/* ---------- 각도 계산 ---------- */
const px = p => ({ x: p.x * canvas.width, y: p.y * canvas.height });
function angleAt(a, b, c) {             // b 지점의 각도
  const v1x = a.x - b.x, v1y = a.y - b.y, v2x = c.x - b.x, v2y = c.y - b.y;
  const m = Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y);
  if (!m) return 180;
  return Math.acos(Math.max(-1, Math.min(1, (v1x * v2x + v1y * v2y) / m))) * 180 / Math.PI;
}
const sideVisibility = (lm, s) =>
  Math.min(lm[s.sh].visibility, lm[s.hip].visibility, lm[s.knee].visibility, lm[s.ank].visibility);

function updateGauge(knee) {
  // 180°(선 자세)=0%, 70°(깊이 앉음)=100%
  const pct = Math.max(0, Math.min(100, (180 - knee) / 110 * 100));
  $("gaugeFill").style.height = pct + "%";
}
$("gaugeTarget").style.bottom = ((180 - CONFIG.DOWN_ANGLE) / 110 * 100) + "%";

/* ---------- 스쿼트 판정 (상태 머신) ---------- */
function analyze(lm) {
  const side = sideVisibility(lm, LEFT) >= sideVisibility(lm, RIGHT) ? LEFT : RIGHT;
  if (sideVisibility(lm, side) < CONFIG.MIN_VISIBILITY) {
    setHint("옆으로 서서 발끝까지 보이게 해요", true); return;
  }
  setHint("");
  const sh = px(lm[side.sh]), hip = px(lm[side.hip]), knee = px(lm[side.knee]), ank = px(lm[side.ank]);
  const raw = angleAt(hip, knee, ank);
  smoothKnee = smoothKnee == null ? raw : smoothKnee * 0.6 + raw * 0.4;
  const k = smoothKnee;
  const lean = Math.atan2(Math.abs(sh.x - hip.x), Math.max(1, hip.y - sh.y)) * 180 / Math.PI;
  updateGauge(k);

  if (mode !== "run") return;

  if (!rep.down) {
    if (k < CONFIG.UP_ANGLE - 15) rep = { down: true, minKnee: k, maxLean: 0 };
    return;
  }
  rep.minKnee = Math.min(rep.minKnee, k);
  if (k <= CONFIG.DOWN_ANGLE + 20) rep.maxLean = Math.max(rep.maxLean, lean);   // 앉은 구간의 상체 기울기

  if (k >= CONFIG.UP_ANGLE) {           // 끝까지 일어섰을 때만 1회 판정
    rep.down = false;
    if (rep.minKnee > CONFIG.IGNORE_ANGLE) return;
    if (rep.minKnee > CONFIG.DOWN_ANGLE) {
      badDepth++; flash("더 깊이!", "bad"); beep(260);
    } else if (rep.maxLean > CONFIG.MAX_LEAN) {
      badBack++; flash("허리 펴기!", "bad"); beep(260);
    } else {
      good++; flash("좋아요!", "good"); beep(880);
    }
    $("goodNow").textContent = good; $("depthNow").textContent = badDepth; $("backNow").textContent = badBack;
  }
}

/* ---------- 메인 반복 ---------- */
function loop() {
  if (video.readyState >= 2 && landmarker) {
    if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
    const now = performance.now();

    if (mode === "scan") {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (now - lastScan > 250) { lastScan = now; scanQR(); }
    } else if (video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const res = landmarker.detectForVideo(video, now);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const lm = res.landmarks && res.landmarks[0];
      if (lm) {
        drawer.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color: "#FFFFFF", lineWidth: 4 });
        drawer.drawLandmarks(lm, { color: "#FFD23F", radius: 4 });
        analyze(lm);
      } else if (mode !== "result") {
        setHint("사람이 보이지 않아요. 카메라 앞에 서 주세요", true);
      }
    }

    if (mode === "run") {
      const left = Math.max(0, Math.ceil((endTime - now) / 1000));
      $("timer").textContent = left;
      if (left === 0) finish();
    }
  }
  requestAnimationFrame(loop);
}

/* ---------- 측정 흐름 ---------- */
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  duration = Number(b.dataset.sec);
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
}));

$("startBtn").addEventListener("click", async () => {
  if (actx && actx.state === "suspended") actx.resume();
  beep(1, 1); // 첫 터치로 소리 켜기
  good = badDepth = badBack = 0; rep = { down: false, minKnee: 180, maxLean: 0 };
  $("goodNow").textContent = 0; $("depthNow").textContent = 0; $("backNow").textContent = 0;
  $("timer").textContent = duration;
  show("runPanel"); mode = "countdown";
  for (const n of [3, 2, 1]) { $("countdown").textContent = n; beep(520); await new Promise(r => setTimeout(r, 1000)); }
  $("countdown").textContent = ""; beep(990, 250);
  endTime = performance.now() + duration * 1000; mode = "run";
});
$("stopBtn").addEventListener("click", () => { mode = "ready"; goReady(); });
$("changeStudent").addEventListener("click", backOrScan);
$("nextStudent").addEventListener("click", backOrScan);
$("again").addEventListener("click", goReady);
$("retrySave").addEventListener("click", () => send(lastPayload));
$("switchCam").addEventListener("click", async () => {
  facing = facing === "user" ? "environment" : "user";
  try { await startCamera(); } catch (e) { setHint("카메라를 바꿀 수 없어요", true); }
});

function finish() {
  mode = "result"; beep(990, 400);
  $("goodFinal").textContent = good; $("depthFinal").textContent = badDepth; $("backFinal").textContent = badBack;
  show("resultPanel"); setHint("");
  lastPayload = { type: "squat", token: CONFIG.TOKEN, email: student, duration, good, badDepth, badBack };
  send(lastPayload);
}

async function send(payload) {
  const status = $("saveStatus");
  status.className = ""; status.textContent = "기록을 저장하는 중이에요"; $("retrySave").hidden = true;
  let j = null;
  try {
    const r = await fetch(CONFIG.GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },   // CORS 사전요청을 피하려고 text/plain 사용
      body: JSON.stringify(payload),
      redirect: "follow",
      credentials: "omit"
    });
    const text = await r.text();
    try { j = JSON.parse(text); } catch { j = null; }   // 구글 안내 페이지(HTML)가 오면 읽지 못함
  } catch (e) {
    j = null;                                           // Failed to fetch: 전송은 됐지만 결과를 못 읽음
  }

  if (j && j.ok) {
    status.className = "ok";
    status.textContent = `저장했어요${j.name ? ` (${j.name})` : ""}`;
  } else if (j && !j.ok) {                              // 서버가 실제로 거부한 경우(인증 실패, 명단 없음 등)
    status.className = "err";
    status.textContent = `저장하지 못했어요: ${j.error || "저장 실패"}`;
    $("retrySave").hidden = false;
  } else if (navigator.onLine) {                        // 결과만 못 읽은 경우: 중복 저장을 막으려고 다시 저장 버튼은 숨김
    status.className = "ok";
    status.textContent = "전송했어요 (시트에서 확인해 주세요)";
  } else {
    status.className = "err";
    status.textContent = "인터넷 연결을 확인한 뒤 다시 저장해 주세요";
    $("retrySave").hidden = false;
  }
}

/* ---------- 시작 ---------- */
(async () => {
  try {
    await startCamera();
    await loadModel();
    if (!startFromParams()) goScan();
    requestAnimationFrame(loop);
  } catch (e) {
    setHint("카메라 또는 AI 모델을 열 수 없어요. 카메라 권한을 확인해 주세요", true);
    console.error(e);
  }
})();
</script>
