<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { font-family: 'Noto Sans KR', sans-serif; margin: 16px; }
  .bar { margin-bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bar button, .bar select, .bar input { font-size: 16px; padding: 6px 12px; }
  .bar input { width: 260px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .card { border: 1px dashed #999; padding: 12px; text-align: center; break-inside: avoid; }
  .card .q { display: flex; justify-content: center; margin-bottom: 8px; }
  .card b { font-size: 20px; display: block; }
  .card span { font-size: 13px; color: #555; }
  @page { size: A4; margin: 10mm; }
  @media print { .bar { display: none; } body { margin: 0; } }
</style>
</head>
<body>
<div class="bar">
  <button onclick="print()">인쇄하기</button>
  <select id="grp" onchange="$('q').value='';draw()"><option value="">반을 고르세요</option></select>
  <input id="q" type="search" placeholder="이름·아이디로 찾기 (잃어버린 학생)" oninput="$('grp').value='';draw()">
  <span id="info">오려서 코팅해 나눠주세요.</span>
</div>
<div class="grid" id="grid">명단 불러오는 중</div>
<script>
let all = [];
const $ = id => document.getElementById(id);

google.script.run
  .withSuccessHandler(list => {
    all = list;
    const sel = document.getElementById('grp');
    [...new Set(list.map(s => s.group))].forEach(g => sel.add(new Option(g, g)));
    sel.add(new Option('전체 (' + list.length + '명)', '*'));
    draw();
  })
  .withFailureHandler(err => {
    document.getElementById('grid').textContent = '불러오기 실패: ' + err.message;
  })
  .getQrStudents();

function draw() {
  const g = $('grp').value, q = $('q').value.trim().toLowerCase();
  const list = q ? all.filter(s => s.name.toLowerCase().includes(q) || s.id.includes(q))
             : g === '*' ? all : all.filter(s => s.group === g);
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  list.forEach(s => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="q"></div><b></b><span></span>';
    card.querySelector('b').textContent = s.name;
    card.querySelector('span').textContent = s.label;
    new QRCode(card.querySelector('.q'), {
      text: s.id, width: 110, height: 110, correctLevel: QRCode.CorrectLevel.M
    });
    grid.appendChild(card);
  });
  $('info').textContent = (g || q) ? `${list.length}명 · 오려서 코팅해 나눠주세요.` : '학년·반을 고르거나 이름으로 찾으세요.';
  if (!g && !q) grid.textContent = '';
  else if (!list.length) grid.textContent = '찾는 사람이 없어요.';
}
</script>
</body>
</html>
