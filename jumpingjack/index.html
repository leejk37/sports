<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>점핑잭 측정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --ink:#17212b; --sub:#5b6875; --line:#d9e0e6; --paper:#f4f7f9;
    --mat:#2457a6; --good:#0a7d5a; --warn:#c2410c; --stage:#0f1a24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Pretendard,system-ui,sans-serif;color:var(--ink);background:var(--paper)}
  #app{display:flex;height:100%}
  #stage{flex:1;position:relative;background:var(--stage);overflow:hidden}
  #view{width:100%;height:100%;object-fit:contain;display:block}
  #video{display:none}
  #banner{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:rgba(255,255,255,.94);
    padding:10px 18px;border-radius:999px;font-size:20px;font-weight:600;white-space:nowrap}
  #banner:empty{display:none}
  #big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:min(34vh,240px);font-weight:800;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.5);pointer-events:none}
  #flash{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 20px;border-radius:12px;
    background:var(--warn);color:#fff;font-size:24px;font-weight:700;opacity:0;transition:opacity .2s}
  #flash.on{opacity:1}
  #side{width:320px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;padding:20px;gap:14px}
  h1{font-size:22px;margin:0}
  #who{font-size:17px;color:var(--sub);min-height:24px}
  .screen{display:none;flex-direction:column;gap:12px}
  .screen.on{display:flex}
  .msg{font-size:18px;line-height:1.55}
  button{font:inherit;font-size:20px;font-weight:600;padding:16px;border-radius:12px;border:2px solid var(--mat);
    background:#fff;color:var(--mat);cursor:pointer}
  button.main{background:var(--mat);color:#fff}
  button:focus-visible{outline:3px solid #f5b400;outline-offset:2px}
  .count{font-size:84px;font-weight:800;line-height:1;color:var(--good)}
  .row{display:flex;justify-content:space-between;font-size:18px;padding:6px 0;border-bottom:1px solid var(--line)}
  .row b{color:var(--warn)}
  #timer{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
  #timerBar{height:100%;width:100%;background:var(--mat)}
  #saveState{font-size:18px;font-weight:600;padding:12px;border-radius:10px;background:var(--paper)}
  #saveState.ok{background:#e3f4ec;color:var(--good)}
  #saveState.fail{background:#fde9df;color:var(--warn)}
  #tools{margin-top:auto;display:flex;gap:8px}
  #tools button{flex:1;font-size:15px;padding:10px;border-width:1px}
  @media (max-width:820px){#app{flex-direction:column}#side{width:auto;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="view"></canvas>
    <div id="banner"></div>
    <div id="big"></div>
    <div id="flash"></div>
  </div>

  <aside id="side">
    <h1>점핑잭</h1>
    <div id="who"></div>

    <section class="screen" id="s-loading"><p class="msg">카메라와 동작 인식 모델을 준비하고 있어요.</p></section>

    <section class="screen" id="s-scan"><p class="msg">이름표 QR을 카메라에 보여 주세요.</p></section>

    <section class="screen" id="s-time">
      <p class="msg">측정 시간을 고르세요.</p>
      <button class="main" data-sec="30">30초</button>
      <button class="main" data-sec="60">1분</button>
      <button id="rescan">다른 학생 스캔</button>
    </section>

    <section class="screen" id="s-ready">
      <p class="msg">카메라 정면에서 머리부터 발끝까지 보이게 서 주세요.<br>팔을 내리고 발을 모으면 3-2-1이 시작돼요.</p>
      <div id="readyState" class="msg"></div>
      <button id="forceStart">바로 시작</button>
    </section>

    <section class="screen" id="s-measure">
      <div id="timer"><div id="timerBar"></div></div>
      <div class="count" id="goodNum">0</div>
      <div class="row"><span>팔 덜 올림</span><b id="aNum">0</b></div>
      <div class="row"><span>다리 덜 벌림</span><b id="lNum">0</b></div>
    </section>

    <section class="screen" id="s-result">
      <div class="count" id="resGood">0</div>
      <div class="row"><span>팔 덜 올림</span><b id="resA">0</b></div>
      <div class="row"><span>다리 덜 벌림</span><b id="resL">0</b></div>
      <div class="row"><span>정확도</span><span id="resAcc">0%</span></div>
      <div id="saveState"></div>
      <button id="retrySave" hidden>다시 저장</button>
      <button class="main" id="next">다음 학생</button>
    </section>

    <div id="tools">
      <button id="flip">카메라 전환</button>
      <button id="cancel">처음으로</button>
    </div>
  </aside>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ===== 설정: 스쿼트·윗몸말아올리기와 같은 GAS_URL, TOKEN ===== */
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzZIU-UeiWcXuN47lW4XSSwvD9EgP06NdJYrX5NKDf96oqEnfsqaI0B2B3YrvZ6Yw0eVw/exec',
  TOKEN:   '26cp4s_squat',
  TYPE:    'jumpingjack',
  DOMAIN:  '@cpe.es.kr',

  // ---- 판정 기준 ----
  // 팔 각도: 엉덩이-어깨-손목 (0°=팔 내림, 180°=머리 위). 두 팔 중 덜 올린 쪽 기준
  ARM_OPEN: 140,     // 이 이상 → 팔을 머리 위로 올림
  ARM_CLOSE: 45,     // 이 이하 → 팔을 내림
  // 다리 벌림: 두 발목 사이 거리 ÷ 골반 너비
  LEG_OPEN: 1.8,     // 이 이상 → 다리를 벌림
  LEG_CLOSE: 1.3,    // 이 이하 → 다리를 모음
  MIN_REP_MS: 300,   // 이보다 짧은 움직임은 흔들림으로 무시
  VIS_MIN: 0.5,
  SMOOTH: 0.6,       // 점핑잭은 빠르므로 부드럽게 하는 정도를 약하게
  STABLE_MS: 1000,
  SAVE_TIMEOUT_MS: 30000
};

/* ===== 화면 요소 ===== */
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('view'), ctx = canvas.getContext('2d');
const qrCanvas = document.createElement('canvas'), qrCtx = qrCanvas.getContext('2d', { willReadFrequently: true });

/* ===== 상태 ===== */
let mode = 'loading';
let pose, stream, facing = localStorage.getItem('jjFacing') || 'user';
let email = '', duration = 30, endAt = 0;
let counts = { good: 0, badArms: 0, badLegs: 0 };
let phase = 'closed', rep = null, sArm = null, sLeg = null, readySince = null;
let lastQr = 0, lastVideoTime = -1, clientId = '';
let audio;

function show(m) {
  mode = m;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + m));
  $('big').textContent = '';
  $('banner').textContent = '';
}

/* ===== 소리 ===== */
function beep(freq = 880, ms = 120) {
  try {
    audio ??= new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.25, audio.currentTime);
    o.start(); o.stop(audio.currentTime + ms / 1000);
  } catch (e) {}
}
let flashTimer;
function flash(text) {
  $('flash').textContent = text; $('flash').classList.add('on');
  clearTimeout(flashTimer); flashTimer = setTimeout(() => $('flash').classList.remove('on'), 800);
}

/* ===== 카메라 ===== */
async function startCamera() {
  stream?.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
}

/* ===== 자세 분석 ===== */
function angle(a, b, c) {
  const v1x = a.x - b.x, v1y = a.y - b.y, v2x = c.x - b.x, v2y = c.y - b.y;
  const cos = (v1x * v2x + v1y * v2y) / (Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y) || 1);
  return Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
}
const IDX = { ls: 11, rs: 12, le: 13, re: 14, lw: 15, rw: 16, lh: 23, rh: 24, lk: 25, rk: 26, la: 27, ra: 28 };
function analyze(lm) {
  const W = canvas.width, H = canvas.height, P = {};
  for (const k in IDX) { const q = lm[IDX[k]]; P[k] = { x: q.x * W, y: q.y * H, v: q.visibility ?? 0 }; }
  const need = ['ls', 'rs', 'lw', 'rw', 'lh', 'rh', 'la', 'ra'];
  const ok = need.every(k => P[k].v > CONFIG.VIS_MIN);
  const arm = Math.min(angle(P.lh, P.ls, P.lw), angle(P.rh, P.rs, P.rw));
  const hipW = Math.hypot(P.lh.x - P.rh.x, P.lh.y - P.rh.y) || 1;
  const leg = Math.abs(P.la.x - P.ra.x) / hipW;
  return { ok, arm, leg, P };
}

/* ===== 그리기 ===== */
const mirror = () => facing === 'user';
function drawVideo() {
  ctx.save();
  if (mirror()) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();
}
const BONES = [['ls','rs'],['ls','le'],['le','lw'],['rs','re'],['re','rw'],['ls','lh'],['rs','rh'],['lh','rh'],
               ['lh','lk'],['lk','la'],['rh','rk'],['rk','ra']];
function drawPose(r) {
  const X = x => mirror() ? canvas.width - x : x;
  ctx.lineWidth = 7; ctx.strokeStyle = r.ok ? '#5fd3a6' : '#f0a070';
  ctx.beginPath();
  BONES.forEach(([a, b]) => { ctx.moveTo(X(r.P[a].x), r.P[a].y); ctx.lineTo(X(r.P[b].x), r.P[b].y); });
  ctx.stroke();
  // 교사용 확인 수치(기준값 조정할 때 참고)
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(12, 12, 250, 84);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Pretendard, sans-serif';
  ctx.fillText('팔 ' + Math.round(sArm) + '°', 24, 48);
  ctx.fillText('다리 ' + sLeg.toFixed(2) + '배', 24, 84);
}

/* ===== 메인 루프 ===== */
function loop() {
  requestAnimationFrame(loop);
  if (!video.videoWidth) return;
  drawVideo();
  const now = performance.now();

  if (mode === 'scan' && now - lastQr > 250) { lastQr = now; scanQr(); return; }
  if (!['ready', 'countdown', 'measure'].includes(mode) || !pose) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const res = pose.detectForVideo(video, now);
  const lm = res.landmarks?.[0];
  if (!lm) { $('banner').textContent = '머리부터 발끝까지 화면에 들어오게 해 주세요'; return; }
  const r = analyze(lm);
  sArm = sArm == null ? r.arm : sArm + CONFIG.SMOOTH * (r.arm - sArm);
  sLeg = sLeg == null ? r.leg : sLeg + CONFIG.SMOOTH * (r.leg - sLeg);
  drawPose(r);
  $('banner').textContent = r.ok ? '' : '손목과 발목까지 잘 보이게 해 주세요';
  if (!r.ok) return;

  const closed = sArm <= CONFIG.ARM_CLOSE && sLeg <= CONFIG.LEG_CLOSE;
  if (mode === 'ready') {
    $('readyState').textContent = closed ? '준비 자세 확인됨' : '팔을 내리고 발을 모아 주세요';
    if (closed) { readySince ??= now; if (now - readySince > CONFIG.STABLE_MS) startCountdown(); }
    else readySince = null;
  } else if (mode === 'measure') {
    measure(closed, now);
  }
}

/* ===== QR 인식 ===== */
function scanQr() {
  const w = 640, h = Math.round(640 * video.videoHeight / video.videoWidth);
  qrCanvas.width = w; qrCanvas.height = h;
  qrCtx.drawImage(video, 0, 0, w, h);
  const code = jsQR(qrCtx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
  if (!code) return;
  const id = code.data.trim();
  if (!/^[\w.\-]+(@[\w.\-]+)?$/.test(id)) { flash('이름표 QR이 아니에요'); return; }
  email = (id.includes('@') ? id : id + CONFIG.DOMAIN).toLowerCase();
  $('who').textContent = email;
  beep(1200, 80);
  show('time');
}

/* ===== 측정 흐름 ===== */
function toReady(sec) {
  duration = sec;
  counts = { good: 0, badArms: 0, badLegs: 0 };
  sArm = sLeg = null; readySince = null;
  beep(660, 60);
  show('ready');
}
function startCountdown() {
  show('countdown');
  let n = 3;
  const tick = () => {
    if (mode !== 'countdown') return;
    if (n > 0) { $('big').textContent = n; beep(660, 150); n--; setTimeout(tick, 1000); }
    else startMeasure();
  };
  tick();
}
function startMeasure() {
  phase = 'closed'; rep = null;
  endAt = performance.now() + duration * 1000;
  clientId = (crypto.randomUUID?.() || String(Date.now()) + Math.random());
  updateCounts();
  show('measure');
  $('big').textContent = '시작'; setTimeout(() => mode === 'measure' && ($('big').textContent = ''), 600);
  beep(1000, 300);
}
function measure(closed, now) {
  const left = Math.max(0, endAt - now);
  $('timerBar').style.width = (left / (duration * 1000) * 100) + '%';
  if (left <= 0) { finish(); return; }

  if (phase === 'closed') {
    // 팔이나 다리가 확실히 벌어지기 시작하면 한 바퀴 시작
    if (sArm > CONFIG.ARM_CLOSE + 15 || sLeg > CONFIG.LEG_CLOSE + 0.2) {
      phase = 'open'; rep = { start: now, maxArm: sArm, maxLeg: sLeg };
    }
  } else {
    rep.maxArm = Math.max(rep.maxArm, sArm);
    rep.maxLeg = Math.max(rep.maxLeg, sLeg);
    if (closed) { judge(now); phase = 'closed'; rep = null; }   // 다시 모아야 1회 완성
  }
}
function judge(now) {
  if (now - rep.start < CONFIG.MIN_REP_MS) return;
  const armOk = rep.maxArm >= CONFIG.ARM_OPEN;
  const legOk = rep.maxLeg >= CONFIG.LEG_OPEN;
  if (armOk && legOk) { counts.good++; beep(1320, 70); }
  else if (armOk) { counts.badLegs++; flash('다리를 더 넓게'); beep(220, 150); }
  else if (legOk) { counts.badArms++; flash('팔을 머리 위로'); beep(220, 150); }
  else {
    // 둘 다 부족하면 더 많이 모자란 쪽을 오류로
    const armShort = 1 - rep.maxArm / CONFIG.ARM_OPEN, legShort = 1 - rep.maxLeg / CONFIG.LEG_OPEN;
    if (armShort >= legShort) { counts.badArms++; flash('팔을 머리 위로'); }
    else { counts.badLegs++; flash('다리를 더 넓게'); }
    beep(220, 150);
  }
  updateCounts();
}
function updateCounts() {
  $('goodNum').textContent = counts.good;
  $('aNum').textContent = counts.badArms;
  $('lNum').textContent = counts.badLegs;
}
function accuracy() {
  const t = counts.good + counts.badArms + counts.badLegs;
  return t ? Math.round(counts.good / t * 100) : 0;
}
function finish() {
  beep(500, 500);
  show('result');
  $('resGood').textContent = counts.good;
  $('resA').textContent = counts.badArms;
  $('resL').textContent = counts.badLegs;
  $('resAcc').textContent = accuracy() + '%';
  save();
}

/* ===== 저장 ===== */
function setSave(text, cls) {
  const el = $('saveState'); el.textContent = text; el.className = cls || '';
  $('retrySave').hidden = cls !== 'fail';
}
async function save() {
  setSave('저장 중…');
  const body = {
    type: CONFIG.TYPE, token: CONFIG.TOKEN, email, duration,
    good: counts.good, badArms: counts.badArms, badLegs: counts.badLegs, clientId
  };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.SAVE_TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow',
      credentials: 'omit',
      signal: ctrl.signal
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error('<!DOCTYPE 응답: ' + text.slice(0, 40)); }
    if (data.ok !== true) throw Object.assign(new Error(data.error || '서버에서 저장을 거부했어요'), { server: true });
    setSave((data.name ? data.name + ' 학생 ' : '') + '저장 완료', 'ok');
  } catch (e) {
    console.error(e);
    // 전송은 됐지만 결과만 못 읽은 경우(리다이렉트 단계 실패)
    const unreadable = !e.server && (e.name === 'TypeError' || String(e.message).includes('<!DOCTYPE'));
    if (unreadable && navigator.onLine) {
      setSave('전송 완료 (결과 확인 불가 · 시트에서 확인)', 'ok');
      $('retrySave').hidden = false;   // 같은 clientId라 다시 보내도 중복 저장 안 됨
      return;
    }
    const msg = e.name === 'AbortError' ? '응답이 늦어요. 시트를 확인한 뒤 필요하면 다시 저장하세요.' : e.message;
    setSave('저장 실패: ' + msg, 'fail');
  } finally { clearTimeout(timer); }
}

/* ===== 버튼 ===== */
document.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => toReady(+b.dataset.sec));
$('rescan').onclick = $('next').onclick = $('cancel').onclick = () => { email = ''; $('who').textContent = ''; show('scan'); };
$('forceStart').onclick = startCountdown;
$('retrySave').onclick = save;
$('flip').onclick = async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  localStorage.setItem('jjFacing', facing);
  await startCamera();
};

/* ===== 시작 ===== */
(async () => {
  show('loading');
  try {
    await startCamera();
    requestAnimationFrame(loop);
    const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    pose = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO', numPoses: 1
    });
    try { await navigator.wakeLock?.request('screen'); } catch (e) {}
    show('scan');
  } catch (e) {
    $('s-loading').innerHTML = '<p class="msg">카메라 또는 모델을 불러오지 못했어요.<br>' + e.message + '</p>';
  }
})();
</script>
</body>
</html>
