<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포인트 관리</title>
<meta name="theme-color" content="#1f4e8c">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 선생님용: 반 고르기 → 학생 목록(남은 포인트) → 학생을 누르면 자세히 + 선물 주기 */
  :root{
    --blue:#1f4e8c; --blue-d:#173d6e; --blue-dd:#12305a; --yellow:#f5c518; --green:#9ff0b0; --red:#ff9d8a;
    --soft:rgba(255,255,255,.75); --dim:rgba(255,255,255,.4); --line:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Pretendard,system-ui,sans-serif;background:var(--blue);color:#fff;-webkit-tap-highlight-color:transparent}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:4px solid var(--yellow);position:sticky;top:0;background:var(--blue);z-index:3}
  header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.5px;margin-right:auto}
  select,input,button{font:inherit}
  .sel{font-size:15px;font-weight:800;padding:8px 10px;border-radius:10px;border:0;background:var(--blue-dd);color:#fff}
  .search{font-size:15px;font-weight:700;padding:8px 12px;border-radius:10px;border:0;background:var(--blue-dd);color:#fff;width:130px}
  .search::placeholder{color:var(--dim)}
  main{max-width:1200px;margin:0 auto;padding:14px 16px}
  .sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
  .sum div{background:var(--blue-d);border-radius:14px;padding:10px 12px}
  .sum b{display:block;font-size:24px;font-weight:900;color:var(--yellow)}
  .sum span{font-size:13px;font-weight:700;color:var(--soft)}
  .groups{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .gchip{font-size:14px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--blue-d);color:var(--soft)}
  .gchip b{color:var(--yellow)}
  table{width:100%;border-collapse:collapse;background:var(--blue-d);border-radius:16px;overflow:hidden}
  th,td{padding:10px 8px;text-align:right;font-size:15px;white-space:nowrap}
  th{font-size:13px;font-weight:800;color:var(--soft);background:var(--blue-dd);cursor:pointer;user-select:none}
  th.on{color:var(--yellow)}
  th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
  tbody tr{border-top:1px solid var(--line);cursor:pointer}
  tbody tr:hover{background:rgba(255,255,255,.06)}
  td.bal{font-size:18px;font-weight:900;color:var(--yellow)}
  td.zero{color:var(--dim)}
  td .gbtn{font-size:13px;font-weight:900;padding:5px 10px;border-radius:999px;border:0;background:var(--yellow);color:var(--blue-dd);cursor:pointer}
  @media (max-width:700px){ .hide-s{display:none} th,td{padding:9px 5px;font-size:14px} }
  #status{font-size:13px;color:var(--dim);text-align:right;max-width:1200px;margin:0 auto;padding:0 16px 14px}
  .empty{padding:60px 20px;text-align:center;font-size:19px;font-weight:800;line-height:1.7}
  .keybox{display:flex;gap:8px;justify-content:center;margin-top:16px}
  .keybox input{font-size:17px;padding:10px 14px;border-radius:12px;border:0;width:220px}
  .btn{font-size:16px;font-weight:900;padding:10px 18px;border-radius:12px;border:0;background:var(--yellow);color:var(--blue-dd);cursor:pointer}
  .btn.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5)}
  .btn:disabled{opacity:.5;cursor:default}

  /* 학생 자세히 (오른쪽에서 나오는 판) */
  #shade{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:5}
  #panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--blue-d);z-index:6;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:18px}
  body.open #shade{display:block}
  body.open #panel{transform:none}
  .ph{display:flex;align-items:center;gap:10px}
  .ph h2{margin:0;font-size:22px;font-weight:900;flex:1}
  .x{font-size:22px;font-weight:900;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
  .psum{display:flex;gap:8px;margin-top:12px}
  .psum div{flex:1;background:var(--blue-dd);border-radius:12px;padding:9px;text-align:center}
  .psum b{display:block;font-size:24px;font-weight:900}
  .psum .big b{font-size:32px;color:var(--yellow)}
  .psum span{font-size:12px;font-weight:700;color:var(--soft)}
  .give{margin-top:14px;background:var(--blue-dd);border-radius:14px;padding:12px}
  .give h3,.sec{margin:0 0 8px;font-size:16px;font-weight:900}
  .gl{display:flex;flex-wrap:wrap;gap:6px}
  .g{font-size:14px;font-weight:800;padding:8px 12px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
  .g small{color:var(--soft);font-weight:700;margin-left:4px}
  .g.no{opacity:.45}
  .g.pick{border-color:var(--yellow);background:rgba(245,197,24,.2)}
  .confirm{margin-top:10px;display:none;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;font-weight:800}
  .confirm.show{display:flex}
  .msg{margin-top:8px;font-size:14px;font-weight:800}
  .msg.ok{color:var(--green)} .msg.err{color:var(--red)}
  .sec{margin-top:16px}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
  .bd{border-radius:12px;padding:8px 4px;text-align:center;background:rgba(255,255,255,.06);font-size:12px;font-weight:800;line-height:1.25}
  .bd i{display:block;font-style:normal;font-size:24px}
  .bd small{display:block;color:var(--soft);font-weight:700}
  .bd.got{background:rgba(245,197,24,.2);box-shadow:inset 0 0 0 2px rgba(245,197,24,.6)}
  .bd:not(.got){color:var(--dim)} .bd:not(.got) i{filter:grayscale(1);opacity:.35}
  .hist div{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
  .hist .dd{flex:none;width:44px;color:var(--soft);font-weight:800}
  .hist .pp{flex:none;width:44px;text-align:right;font-weight:900;color:var(--green)}
  .hist .pp.minus{color:var(--red)}
  .hist .tt{flex:1;color:var(--soft)}
  .note{margin-top:14px;font-size:12px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>💎 포인트 관리</h1>
  <select class="sel" id="cls" aria-label="반"></select>
  <input class="search" id="q" placeholder="이름 찾기" aria-label="이름 찾기">
</header>
<main id="app"></main>
<div id="status"></div>
<div id="shade"></div>
<aside id="panel" aria-label="학생 자세히"></aside>

<script>
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzZIU-UeiWcXuN47lW4XSSwvD9EgP06NdJYrX5NKDf96oqEnfsqaI0B2B3YrvZ6Yw0eVw/exec',
  TOKEN: '26cp4s_squat',
  REFRESH_SEC: 120
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('ko-KR');
const md = d => { const [, m, dd] = String(d).split('-'); return m ? `${+m}/${+dd}` : ''; };
const store = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
};

/* 선생님 열쇠: 현황판과 같은 것(스크립트 속성 DASH_KEY). ?key= 로 한 번 열면 이 기기에 기억 */
const P = new URLSearchParams(location.search);
if (P.has('key')) { store.set('dashKey', P.get('key')); history.replaceState(null, '', location.pathname); }
let KEY = store.get('dashKey');
let data = null, sortBy = store.get('ptSort') || 'no', cur = null, pick = null;

function jsonp(params, timeout = 40000) {
  return new Promise((resolve, reject) => {
    const cb = 'ptcb_' + Date.now() + '_' + Math.floor(Math.random() * 1e4);
    const s = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('서버 응답이 늦어요')); }, timeout);
    function done() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('서버에 연결하지 못했어요')); };
    s.src = CONFIG.GAS_URL + '?' + new URLSearchParams({ ...params, key: KEY, token: CONFIG.TOKEN, callback: cb });
    document.head.appendChild(s);
  });
}

function askKey(msg) {
  $('app').innerHTML = `<div class="empty">${esc(msg || '선생님 열쇠를 넣어 주세요')}<br><small style="color:var(--soft);font-size:15px">현황판 이름 명단에 쓰는 열쇠와 같아요 (스크립트 속성 DASH_KEY)</small>
    <div class="keybox"><input id="key" type="password" placeholder="열쇠" autocomplete="off"><button class="btn" id="keyGo">열기</button></div></div>`;
  const go = () => { KEY = $('key').value.trim(); store.set('dashKey', KEY); load(); };
  $('keyGo').onclick = go; $('key').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('key').focus();
}

const clsKey = s => s.grade + '|' + s.cls;
function render() {
  if (!data) return;
  const q = $('q').value.trim();
  const ck = $('cls').value;
  let list = data.students.filter(s => (ck === 'all' || clsKey(s) === ck) && (!q || s.name.includes(q)));
  const num = v => Number(v) || 0;
  const by = {
    no: (a, b) => num(a.grade) - num(b.grade) || String(a.cls).localeCompare(String(b.cls)) || num(a.no) - num(b.no),
    group: (a, b) => (num(a.group) || 99) - (num(b.group) || 99) || num(a.no) - num(b.no),
    bal: (a, b) => b.bal - a.bal, earned: (a, b) => b.earned - a.earned, month: (a, b) => b.month - a.month,
    badges: (a, b) => b.badges - a.badges, stamp: (a, b) => b.stamp - a.stamp, streak: (a, b) => b.streak - a.streak
  }[sortBy] || (() => 0);
  list = list.slice().sort((a, b) => by(a, b) || num(a.no) - num(b.no));

  const tot = list.reduce((t, s) => (t.e += s.earned, t.b += s.bal, t.s += s.spent, t.m += s.month, t), { e: 0, b: 0, s: 0, m: 0 });
  const groups = {};
  if (ck !== 'all') list.forEach(s => { if (s.group) groups[s.group] = (groups[s.group] || 0) + s.earned; });
  const gHtml = Object.keys(groups).sort((a, b) => num(a) - num(b)).map(g => `<span class="gchip">${esc(g)}모둠 <b>${fmt(groups[g])}P</b></span>`).join('');
  const th = (k, t, cls = '') => `<th class="${cls}${sortBy === k ? ' on' : ''}" data-k="${k}">${t}</th>`;
  const rows = list.map(s => `<tr data-id="${esc(s.id)}">
      <td>${ck === 'all' ? `${esc(s.grade)}-${esc(s.cls)} ` : ''}${esc(s.no)}</td><td><b>${esc(s.name)}</b></td><td class="hide-s">${s.group ? esc(s.group) + '모둠' : ''}</td>
      <td class="bal${s.bal ? '' : ' zero'}">${fmt(s.bal)}</td><td>${fmt(s.earned)}</td><td class="hide-s">${fmt(s.month)}</td>
      <td>${s.badges}</td><td class="hide-s">${s.stamp}${s.perfect ? ` <small style="color:var(--yellow)">★${s.perfect}</small>` : ''}</td><td class="hide-s">${s.streak}</td>
      <td><button class="gbtn" data-give="${esc(s.id)}">선물</button></td></tr>`).join('');
  $('app').innerHTML = `
    <div class="sum">
      <div><b>${list.length}</b><span>학생</span></div>
      <div><b>${fmt(tot.b)}</b><span>남은 포인트 합</span></div>
      <div><b>${fmt(tot.e)}</b><span>모은 포인트 합</span></div>
      <div><b>${fmt(tot.m)}</b><span>이달 포인트 합</span></div>
      <div><b>${fmt(tot.s)}</b><span>선물로 쓴 포인트</span></div>
    </div>
    ${gHtml ? `<div class="groups">${gHtml}</div>` : ''}
    ${list.length ? `<table><thead><tr>${th('no', '번호')}${th('no', '이름')}${th('group', '모둠', 'hide-s')}${th('bal', '남은 P')}${th('earned', '모은 P')}${th('month', '이달', 'hide-s')}${th('badges', '뱃지')}${th('stamp', '도장', 'hide-s')}${th('streak', '최고 연속', 'hide-s')}<th></th></tr></thead>
      <tbody>${rows}</tbody></table>` : '<div class="empty">학생이 없어요</div>'}`;
  document.querySelectorAll('th[data-k]').forEach(t => t.onclick = () => { sortBy = t.dataset.k; store.set('ptSort', sortBy); render(); });
  document.querySelectorAll('tbody tr').forEach(r => r.onclick = e => openStudent(r.dataset.id, !!e.target.dataset.give));
}

function fillClasses() {
  const seen = {}, opts = [];
  data.students.forEach(s => { const k = clsKey(s); if (!seen[k]) { seen[k] = 1; opts.push({ k, g: s.grade, c: s.cls }); } });
  opts.sort((a, b) => (Number(a.g) || 0) - (Number(b.g) || 0) || String(a.c).localeCompare(String(b.c)));
  const was = $('cls').value || store.get('ptCls');
  $('cls').innerHTML = '<option value="all">전교생</option>' + opts.map(o => `<option value="${esc(o.k)}">${esc(o.g)}학년 ${esc(o.c)}반</option>`).join('');
  $('cls').value = opts.some(o => o.k === was) ? was : (opts[0] ? opts[0].k : 'all');
}

/* ===== 학생 자세히 + 선물 주기 ===== */
async function openStudent(id, toGift) {
  const s = data.students.find(x => x.id === id); if (!s) return;
  cur = { id, s, d: null }; pick = null;
  document.body.classList.add('open');
  drawPanel(toGift);
  try {
    const d = await jsonp({ action: 'points', id });
    if (!cur || cur.id !== id) return;
    if (d && d.ok) { cur.d = d; drawPanel(toGift); }
  } catch (e) {}
}
function closePanel() { document.body.classList.remove('open'); cur = null; }

function drawPanel(toGift, msg) {
  if (!cur) return;
  const s = cur.s, d = cur.d || s;
  const gifts = (data.gifts || []).slice().sort((a, b) => a.cost - b.cost);
  const gl = gifts.map((g, i) => `<button class="g${g.cost > d.bal ? ' no' : ''}${pick === i ? ' pick' : ''}" data-i="${i}">${esc(g.name)}<small>${fmt(g.cost)}P</small></button>`).join('');
  const g = pick != null ? gifts[pick] : null;
  const badges = cur.d ? cur.d.badges.map(b => `<div class="bd${b.got ? ' got' : ''}"><i>${b.icon}</i>${esc(b.name)}<small>${b.got ? md(b.got) : fmt(b.have) + '/' + fmt(b.n)}</small></div>`).join('') : '<div style="color:var(--dim)">불러오는 중…</div>';
  const hist = cur.d ? [...cur.d.trades.map(t => ({ d: t.d, p: -t.p, t: '🎁 ' + t.gift })), ...cur.d.recent]
    .sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : 0)
    .map(h => `<div><span class="dd">${md(h.d)}</span><span class="pp${h.p < 0 ? ' minus' : ''}">${h.p > 0 ? '+' : ''}${fmt(h.p)}</span><span class="tt">${esc(h.t)}</span></div>`).join('') || '<div><span class="tt">아직 내역이 없어요</span></div>' : '';
  $('panel').innerHTML = `
    <div class="ph"><h2>${esc(s.grade)}학년 ${esc(s.cls)}반 ${esc(s.no)}번 ${esc(s.name)}</h2><button class="x" id="close" aria-label="닫기">×</button></div>
    <div class="psum">
      <div class="big"><b>${fmt(d.bal)}</b><span>남은 포인트</span></div>
      <div><b>${fmt(d.earned)}</b><span>모은</span></div>
      <div><b>${fmt(d.spent)}</b><span>쓴</span></div>
      <div><b>${fmt(d.month)}</b><span>이달</span></div>
    </div>
    <div class="give" id="give">
      <h3>🎁 선물 주기</h3>
      ${gifts.length ? `<div class="gl">${gl}</div>` : '<div style="color:var(--soft);font-size:14px">시트의 선물목록 탭에 선물을 먼저 적어 주세요</div>'}
      <div class="confirm${g ? ' show' : ''}">${g ? `${esc(g.name)} (${fmt(g.cost)}P)을 줄까요? → 남은 포인트 ${fmt(d.bal - g.cost)}P` : ''}
        <button class="btn" id="giveGo"${g && g.cost > d.bal ? ' style="background:var(--red)"' : ''}>${g && g.cost > d.bal ? '모자라도 주기' : '주기'}</button><button class="btn ghost" id="giveNo">취소</button></div>
      ${msg ? `<div class="msg ${msg.ok ? 'ok' : 'err'}">${esc(msg.t)}</div>` : ''}
    </div>
    <div class="sec">뱃지 ${cur.d ? cur.d.badges.filter(b => b.got).length + '/' + cur.d.badges.length : ''}</div>
    <div class="badges">${badges}</div>
    <div class="sec">최근 내역</div>
    <div class="hist">${hist}</div>
    <div class="note">· 포인트는 매일 밤 1시에 확정돼요 (오늘 운동한 것은 내일 보여요)<br>· 잘못 준 선물은 시트의 선물교환 탭에서 그 줄을 지우면 돌아가요</div>`;
  $('close').onclick = closePanel;
  document.querySelectorAll('.g').forEach(b => b.onclick = () => { pick = Number(b.dataset.i); drawPanel(); });
  if ($('giveNo')) $('giveNo').onclick = () => { pick = null; drawPanel(); };
  if ($('giveGo')) $('giveGo').onclick = () => give(g, g.cost > d.bal);
  if (toGift) $('give').scrollIntoView({ block: 'nearest' });
}

async function give(g, short) {
  const btn = $('giveGo'); btn.disabled = true; btn.textContent = '주는 중…';
  const id = cur.id;
  try {
    const q = { action: 'gift', id, gift: g.name }; if (short) q.force = 1;
    const r = await jsonp(q);
    if (!cur || cur.id !== id) return;
    if (r && r.ok) {
      cur.s.bal = r.bal; cur.s.spent += r.cost;
      if (cur.d) { cur.d.bal = r.bal; cur.d.spent += r.cost; cur.d.trades.unshift({ d: new Date().toISOString().slice(0, 10), gift: r.gift, p: r.cost }); }
      pick = null; drawPanel(false, { ok: true, t: `${r.gift}을(를) 줬어요. 남은 포인트 ${fmt(r.bal)}P` }); render();
    } else drawPanel(false, { ok: false, t: (r && r.error) || '주지 못했어요' });
  } catch (e) { drawPanel(false, { ok: false, t: e.message }); }
}

async function load() {
  if (!KEY) { askKey(); return; }
  $('status').textContent = '불러오는 중…';
  try {
    const d = await jsonp({ action: 'points' });
    if (d && d.needKey) { store.set('dashKey', ''); KEY = ''; askKey('열쇠가 맞지 않아요. 다시 넣어 주세요'); $('status').textContent = ''; return; }
    if (d && d.error === '방 이름이 잘못됐어요') throw new Error('GAS에 새 Hub.gs·Points.gs가 아직 배포되지 않았어요 (배포 관리 → 수정 → 새 버전)');
    if (!d || !d.ok) throw new Error((d && d.error) || '불러오지 못했어요');
    data = d; fillClasses(); render();
    if (cur) { const s = data.students.find(x => x.id === cur.id); if (s) cur.s = s; }
    $('status').textContent = d.updated + ' 기준 · 포인트는 밤 1시에 확정 · 2분마다 새로 고침';
  } catch (e) {
    if (!data) $('app').innerHTML = `<div class="empty">${esc(e.message)}<br>잠시 뒤 다시 불러와요</div>`;
    $('status').textContent = e.message;
  }
}

$('cls').onchange = () => { store.set('ptCls', $('cls').value); render(); };
$('q').oninput = render;
$('shade').onclick = closePanel;
addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
load();
