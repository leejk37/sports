<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 도장</title>
<meta name="theme-color" content="#1f4e8c">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 태블릿 세로·가로 모두. 가로가 넓으면 왼쪽 '오늘', 오른쪽 '이번 달' 두 칸 */
  :root{
    --blue:#1f4e8c; --blue-d:#173d6e; --blue-dd:#12305a; --yellow:#f5c518; --green:#2b8a3e;
    --soft:rgba(255,255,255,.75); --dim:rgba(255,255,255,.4); --line:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Pretendard,system-ui,sans-serif;background:var(--blue);color:#fff;-webkit-tap-highlight-color:transparent}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:4px solid var(--yellow);position:sticky;top:0;background:var(--blue);z-index:2}
  header h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.5px}
  #who{flex:1;font-size:17px;font-weight:700;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbtn{font:inherit;font-size:15px;font-weight:800;padding:8px 14px;border-radius:999px;border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;text-decoration:none;cursor:pointer;white-space:nowrap}
  main{display:grid;grid-template-columns:1fr;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
  @media (min-width:900px){ main{grid-template-columns:1.05fr 1fr;align-items:start} }
  .card{background:var(--blue-d);border-radius:20px;padding:18px}
  .label{font-size:15px;font-weight:800;color:var(--soft)}
  #status{font-size:13px;color:var(--dim);text-align:right;padding:0 18px 12px;max-width:1200px;margin:0 auto}

  /* 오늘 도장 */
  .todayTop{display:flex;align-items:center;gap:18px}
  .seal{flex:none;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1.05;
        border:5px dashed rgba(255,255,255,.35);color:var(--soft);font-weight:900;transform:rotate(-8deg)}
  .seal b{display:block;font-size:40px}
  .seal small{display:block;font-size:14px;font-weight:800}
  .seal.s90{border:6px double var(--yellow);color:var(--yellow)}
  .seal.s100{border:6px double #fff;background:var(--yellow);color:var(--blue-dd);box-shadow:0 0 0 6px rgba(245,197,24,.25)}
  .seal.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{transform:rotate(-8deg) scale(2.2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
  .todayTxt{flex:1;min-width:0}
  .todayTxt h2{margin:2px 0 6px;font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1.25}
  .todayTxt p{margin:0;font-size:16px;color:var(--soft);line-height:1.5}
  .prog{height:14px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:12px}
  .prog i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#f5c518,#ffd84d);transition:width .8s ease}
  .note{margin-top:10px;font-size:14px;font-weight:700;color:var(--blue-dd);background:#ffe38a;border-radius:10px;padding:7px 11px;display:none}

  /* 종목 목록 */
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
  .it{display:flex;flex-direction:column;gap:4px;padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.07);border:2px solid transparent;color:#fff;text-decoration:none;font:inherit;text-align:left;cursor:pointer}
  .it .n{font-size:17px;font-weight:900}
  .it .s{font-size:14px;font-weight:700;color:var(--soft)}
  .it.ok{background:rgba(43,138,62,.35);border-color:#3fb15a}
  .it.ok .n::after{content:' ✓';color:#9ff0b0}
  .it.part{border-color:rgba(245,197,24,.7)}
  .it.part .s{color:var(--yellow)}
  .it .go{font-size:13px;font-weight:800;color:var(--yellow)}
  .it.ok .go{display:none}
  .bike{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07)}
  .bike .n{font-size:17px;font-weight:900;flex:none}
  .bike .w{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .bike .w i{display:block;height:100%;width:0;background:#7fb0f0;border-radius:999px;transition:width .8s ease}
  .bike .s{font-size:14px;font-weight:700;color:var(--soft);white-space:nowrap}
  .bike.ok{background:rgba(245,197,24,.18)}
  .bike.ok .w i{background:var(--yellow)}

  /* 달력 */
  .calHead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .calHead h3{flex:1;margin:0;font-size:21px;font-weight:900;text-align:center}
  .nav{font:inherit;font-size:20px;font-weight:900;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
  .nav:disabled{opacity:.25;cursor:default}
  .sum{display:flex;gap:8px;margin-bottom:12px}
  .sum div{flex:1;background:var(--blue-dd);border-radius:12px;padding:9px 10px;text-align:center}
  .sum b{display:block;font-size:26px;font-weight:900;color:var(--yellow)}
  .sum span{font-size:13px;font-weight:700;color:var(--soft)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal .wd{font-size:13px;font-weight:800;color:var(--dim);text-align:center;padding-bottom:2px}
  .cal .wd.sun{color:#ff9d8a}.cal .wd.sat{color:#9cc4ff}
  .d{aspect-ratio:1/1;border-radius:10px;background:rgba(255,255,255,.05);position:relative;display:grid;place-items:center}
  .d .num{position:absolute;top:4px;left:6px;font-size:12px;font-weight:800;color:var(--dim)}
  .d.today{outline:3px solid var(--yellow);outline-offset:-3px}
  .d.future{background:transparent}
  .d .mk{width:62%;aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;font-size:clamp(9px,1.6vw,14px);font-weight:900;transform:rotate(-8deg)}
  .d .mk.s90{border:3px solid var(--yellow);color:var(--yellow)}
  .d .mk.s100{background:var(--yellow);color:var(--blue-dd)}
  .d .bar{position:absolute;left:18%;right:18%;bottom:12%;height:4px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .d .bar i{display:block;height:100%;background:rgba(255,255,255,.55)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;font-weight:700;color:var(--soft)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:16px;height:16px;border-radius:50%;display:inline-block}
  .rules{margin-top:14px;font-size:13px;line-height:1.6;color:var(--soft);border-top:1px solid var(--line);padding-top:10px}

  /* 날짜 넘기기 */
  .dayNav{display:flex;align-items:center;gap:8px}
  .dayNav .label{flex:1;font-size:17px;color:#fff;font-weight:900;text-align:center}
  .dayNav .label small{font-size:14px;color:var(--soft);font-weight:700;margin-left:6px}
  .dayNav .nav{width:40px;height:40px;font-size:18px}
  .toToday{font:inherit;font-size:13px;font-weight:800;padding:5px 10px;border-radius:999px;border:0;background:var(--yellow);color:var(--blue-dd);cursor:pointer}
  #dayCard{touch-action:pan-y}
  .it.past{cursor:default}
  button.d{font:inherit;color:inherit;border:0;padding:0;cursor:pointer}
  .d.sel{outline:3px solid #fff;outline-offset:-3px}
  .d.today.sel{outline-color:var(--yellow);box-shadow:inset 0 0 0 6px rgba(255,255,255,.25)}
  /* 우리 모둠 */
  .team{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--blue-dd)}
  .team .top{display:flex;align-items:center;gap:10px}
  .team .top b{font-size:17px;font-weight:900;flex:1}
  .team .top a{font-size:13px;font-weight:800;color:var(--yellow);text-decoration:none}
  .gseal{flex:none;font-size:13px;font-weight:900;padding:4px 10px;border-radius:999px;border:2px solid var(--dim);color:var(--soft)}
  .gseal.s90{border-color:var(--yellow);color:var(--yellow)}
  .gseal.s100{background:var(--yellow);border-color:var(--yellow);color:var(--blue-dd)}
  .mates{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .mate{font-size:14px;font-weight:800;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--soft)}
  .mate.me{outline:2px solid rgba(255,255,255,.5)}
  .mate.s90{background:rgba(245,197,24,.2);color:var(--yellow)}
  .mate.s100{background:var(--yellow);color:var(--blue-dd)}
  .team .gsum{margin-top:8px;font-size:13px;font-weight:700;color:var(--soft)}
  /* 내 포인트 */
  .pcard{grid-column:1/-1}
  .phead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .phead h3{margin:0;font-size:21px;font-weight:900;flex:1}
  .chip{font-size:14px;font-weight:900;padding:5px 12px;border-radius:999px;background:#9ff0b0;color:#0d3b1a}
  .pgrid{display:grid;grid-template-columns:1fr;gap:16px}
  @media (min-width:900px){ .pgrid{grid-template-columns:1fr 1.25fr} }
  .psum{display:flex;gap:8px}
  .psum div{flex:1;background:var(--blue-dd);border-radius:12px;padding:10px;text-align:center}
  .psum b{display:block;font-size:26px;font-weight:900}
  .psum .big b{font-size:38px;color:var(--yellow)}
  .psum span{font-size:13px;font-weight:700;color:var(--soft)}
  .next{margin-top:12px;font-size:15px;font-weight:800}
  .next .prog{margin-top:6px;height:10px}
  .gifts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .gift{font-size:13px;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--soft)}
  .gift.can{background:rgba(245,197,24,.22);color:var(--yellow)}
  .hist{margin-top:12px;font-size:14px;line-height:1.5}
  .hist div{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
  .hist .dd{flex:none;width:44px;color:var(--soft);font-weight:800}
  .hist .pp{flex:none;width:44px;font-weight:900;color:#9ff0b0;text-align:right}
  .hist .pp.minus{color:#ff9d8a}
  .hist .tt{flex:1;color:var(--soft);min-width:0}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .bd{border-radius:14px;padding:10px 6px 8px;text-align:center;background:rgba(255,255,255,.06)}
  .bd i{display:block;font-style:normal;font-size:30px;line-height:1.1}
  .bd b{display:block;font-size:13px;font-weight:900;margin-top:4px;line-height:1.25}
  .bd small{display:block;font-size:11px;font-weight:700;color:var(--soft);margin-top:2px}
  .bd.got{background:rgba(245,197,24,.2);box-shadow:inset 0 0 0 2px rgba(245,197,24,.6)}
  .bd:not(.got) i{filter:grayscale(1);opacity:.35}
  .bd:not(.got) b{color:var(--dim)}
  .bd .bb{height:4px;border-radius:999px;background:rgba(255,255,255,.12);margin:5px 8px 0;overflow:hidden}
  .bd .bb u{display:block;height:100%;background:rgba(255,255,255,.55)}
  .empty{padding:60px 20px;text-align:center;font-size:20px;font-weight:800;line-height:1.6}
  .empty a{color:var(--yellow)}
</style>
<script src="../config.js"></script>
</head>
<body>
<header>
  <h1>내 도장</h1>
  <div id="who"></div>
  <a class="hbtn" id="back" href="../">허브로</a>
</header>
<div id="app"></div>
<div id="status"></div>

<script>
/* ===== 설정 ===== */
const CONFIG = {
  GAS_URL: SITE.GAS_URL,
  TOKEN: SITE.TOKEN,
  REFRESH_SEC: 60
};
/* 종목 → 운동 앱 폴더 ('하러 가기'). key는 Stamp.gs STAMP_EX / 허브 EXERCISES id 와 같음 */
const APP = {
  squat: 'squat/', lunge: 'lunge/', jumpingjack: 'jumpingjack/', curlup: 'curlup/', highknee: 'highknee/',
  pushup: 'pushup/', plank: 'plank/', jumprope: 'jumprope/', hanging: 'hang/', treadmill: 'treadmill/', rowing: 'rowing/'
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const P = new URLSearchParams(location.search);
const EMAIL = (P.get('email') || '').trim().toLowerCase();
const NAME = P.get('name') || '';
const FROM_HUB = P.get('from') === 'hub';
let month = '', data = null, lastStamp = null, seq = 0;

function jsonp(params, timeout = 40000) {
  return new Promise((resolve, reject) => {
    const cb = 'stampcb_' + Date.now() + '_' + Math.floor(Math.random() * 1e4);
    const s = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('시간 초과')); }, timeout);
    function done() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('연결 실패')); };
    s.src = CONFIG.GAS_URL + '?' + new URLSearchParams({ ...params, token: CONFIG.TOKEN, callback: cb });
    document.head.appendChild(s);
  });
}

const fmtSec = v => (Math.round(v * 10) / 10).toString().replace(/\.0$/, '');
const goUrl = key => '../' + APP[key] + '?' + new URLSearchParams({ email: EMAIL, name: NAME || (data && data.student.name) || '', from: 'hub' });

const WD = ['일', '월', '화', '수', '목', '금', '토'];

/* 우리 모둠: 그날 모둠원 각자의 도장과 모둠 도장 (규칙: 모둠원 모두 도장 → 모둠 도장) */
function teamHtml(d, day, isToday) {
  const g = d.group; if (!g) return '';
  const x = g.days[day]; if (!x) return '';
  const got = x.m.filter(s => s).length, all = x.m.length;
  const seal = x.stamp === 100 ? '<span class="gseal s100">완벽 모둠 도장</span>' : x.stamp === 90 ? '<span class="gseal s90">모둠 도장</span>'
    : `<span class="gseal">${got}/${all}명</span>`;
  const mates = g.members.map((m, i) => {
    const s = x.m[i];
    return `<span class="mate${s === 100 ? ' s100' : s === 90 ? ' s90' : ''}${m.me ? ' me' : ''}">${esc(m.name)}${s === 100 ? ' ★' : s === 90 ? ' ✓' : ''}</span>`;
  }).join('');
  const msg = x.stamp ? '' : all - got === 1 && !x.m[g.members.findIndex(m => m.me)] ? (isToday ? ' · 나만 하면 모둠 도장!' : '') : (isToday ? ` · ${all - got}명 더 하면 모둠 도장` : '');
  const teamUrl = '../team/?' + new URLSearchParams({ email: EMAIL, from: 'hub' });
  return `<div class="team"><div class="top"><b>🤝 우리 ${esc(g.no)}모둠</b>${seal}<a href="${esc(teamUrl)}">반 모둠 보기 ›</a></div>
    <div class="mates">${mates}</div>
    <div class="gsum">이달 모둠 도장 ${g.monthCount}개 · 완벽 ${g.monthPerfect}개 · 연속 ${g.streak}일${d.points && d.points.group ? ` · 모둠 포인트 ${fmtP(d.points.group.earned)}P` : ''}${esc(msg)}</div></div>`;
}
const fmtP = n => Number(n || 0).toLocaleString('ko-KR');
const md = d => { const [, m, dd] = String(d).split('-'); return m ? `${+m}/${+dd}` : ''; };

/* 내 포인트: 남은 포인트 · 다음 선물 · 뱃지 · 최근 내역 (Points.gs) */
function pointsHtml(d) {
  const p = d.points; if (!p) return '';
  const my = g => g.share || g.cost;                    // 모둠 선물은 내 몫(나눠 낸 값)
  const nextGift = p.gifts.find(g => my(g) > p.bal);
  const can = p.gifts.filter(g => my(g) <= p.bal);
  const prev = can.length ? my(can[can.length - 1]) : 0;
  const nextHtml = nextGift ? `<div class="next">🎁 ${esc(nextGift.name)}${nextGift.share ? '(모둠)' : ''}까지 <span style="color:var(--yellow)">${fmtP(my(nextGift) - p.bal)}P</span> 남았어요
      <div class="prog"><i style="width:${Math.max(0, Math.min(100, (p.bal - prev) / (my(nextGift) - prev) * 100))}%"></i></div></div>`
    : p.gifts.length ? '<div class="next">🎁 모든 선물로 바꿀 수 있어요! 선생님께 말해요</div>' : '';
  const gifts = p.gifts.map(g => `<span class="gift${my(g) <= p.bal ? ' can' : ''}">${g.share ? `🤝 ${esc(g.name)} ${fmtP(g.cost)}P · 내 몫 ${fmtP(g.share)}P` : `${esc(g.name)} ${fmtP(g.cost)}P`}</span>`).join('');
  const got = p.badges.filter(b => b.got).length;
  const badges = p.badges.map(b => `<div class="bd${b.got ? ' got' : ''}" title="${esc(b.name)}"><i>${b.icon}</i><b>${esc(b.name)}</b>${b.got
      ? `<small>${md(b.got)} 받음</small>` : `<small>${fmtP(b.have)}/${fmtP(b.n)}</small><div class="bb"><u style="width:${b.have / b.n * 100}%"></u></div>`}</div>`).join('');
  const hist = [
    ...(p.today ? [{ d: d.today, p: p.today, t: '오늘 지금까지 (밤 1시에 확정)' }] : []),
    ...p.trades.map(t => ({ d: t.d, p: -t.p, t: '🎁 ' + t.gift })),
    ...p.recent
  ].sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : 0).slice(0, 8)
    .map(h => `<div><span class="dd">${md(h.d)}</span><span class="pp${h.p < 0 ? ' minus' : ''}">${h.p > 0 ? '+' : ''}${fmtP(h.p)}</span><span class="tt">${esc(h.t)}</span></div>`).join('');
  return `<section class="card pcard">
    <div class="phead"><h3>💎 내 포인트</h3>${p.today ? `<span class="chip">오늘 +${fmtP(p.today)}P 예정</span>` : ''}</div>
    <div class="pgrid">
      <div>
        <div class="psum">
          <div class="big"><b>${fmtP(p.bal)}</b><span>남은 포인트</span></div>
          <div><b>${fmtP(p.earned)}</b><span>모은 포인트</span></div>
          <div><b>${fmtP(p.month)}</b><span>이달</span></div>
        </div>
        ${nextHtml}
        ${gifts ? `<div class="gifts">${gifts}</div>` : ''}
        ${hist ? `<div class="hist">${hist}</div>` : '<div class="hist" style="color:var(--soft)">아직 포인트가 없어요. 오늘 운동하면 밤에 포인트가 들어와요!</div>'}
      </div>
      <div>
        <div class="label" style="margin-bottom:8px">뱃지 ${got}/${p.badges.length}</div>
        <div class="badges">${badges}</div>
      </div>
    </div>
    <div class="rules">
      · 종목 통과 ${p.rules['종목 통과']}P · 하루 도장 ${p.rules['하루 도장']}P (완벽 +${p.rules['완벽 도장']}) · 모둠 도장 ${p.rules['모둠 도장']}P (완벽 +${p.rules['완벽 모둠 도장']})
      · 연속 3일 ${p.rules['연속 3일']}P · 7일마다 ${p.rules['연속 7일마다']}P · 기록 경신 ${p.rules['기록 경신']}P · 바른 자세 ${p.rules['바른 자세']}P<br>
      · 오늘 운동한 포인트는 <b>밤 1시</b>에 확정돼요. 내일 아침에 보면 들어와 있어요<br>
      · '오늘 +○P 예정'은 지금까지 통과한 종목과 도장 포인트예요. 내 최고 기록을 넘었거나 바른 자세로 했다면 밤에 포인트가 더 들어와요<br>
      · 선물은 선생님께 말하면 바꿔 줘요. 바꾸면 <b>남은 포인트</b>만 줄고, 모은 포인트와 뱃지는 그대로예요<br>
      · 🤝 모둠 선물은 모둠원 모두가 똑같이 나눠 내요. 모두 '내 몫'만큼 남은 포인트가 있어야 바꿀 수 있어요
    </div>
  </section>`;
}
let sel = '';                                         // 왼쪽에 자세히 보여 줄 날짜 (기본 오늘)
const addDay = (d, n) => { const t = new Date(d + 'T12:00:00'); t.setDate(t.getDate() + n); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
const dayName = d => { const t = new Date(d + 'T12:00:00'); return `${t.getMonth() + 1}월 ${t.getDate()}일 (${WD[t.getDay()]})`; };

/* 날짜 옮기기: 다른 달로 넘어가면 그 달을 불러옴. 오늘 뒤로는 못 감, 기록은 2026년 9월부터 */
function goDay(target) {
  if (!data || !target || target > data.today || target < '2026-09-01') return;
  sel = target;
  if (target.slice(0, 7) !== data.month) { month = target.slice(0, 7); load(); }
  else render();
}

function render() {
  const d = data, st = d.student;
  if (!sel || sel.slice(0, 7) !== d.month) sel = d.month === d.today.slice(0, 7) ? d.today : d.month + '-' + String(Object.keys(d.days).length).padStart(2, '0');
  const isToday = sel === d.today;
  const t = d.days[sel] || d.todayStatus;
  $('who').textContent = `${st.grade ? st.grade + '학년 ' + st.cls + '반 ' : ''}${st.name}`;

  const left = t.need - t.done;
  const sealCls = t.stamp === 100 ? 's100' : t.stamp === 90 ? 's90' : '';
  const sealHtml = t.stamp === 100 ? '<small>완벽</small><b>100</b><small>도장</small>'
    : t.stamp === 90 ? `<b>90</b><small>${isToday ? '오늘 ' : ''}도장</small>`
    : `<b>${t.done}/${t.need}</b><small>${isToday ? '오늘 도장' : '종목'}</small>`;
  let title, sub = '';
  if (isToday) {
    title = t.stamp === 100 ? '완벽 도장을 받았어요! 🎉'
      : t.stamp === 90 ? (t.bikeOpen ? `실내자전거 ${d.rule.bikeKm}km면 완벽 도장!` : '오늘 도장을 받았어요!')
      : left === t.need ? '오늘 도장에 도전해 볼까요?' : `${left}종목만 더 하면 도장!`;
    if (t.weekend && !t.stamp && left !== t.need) title = `${left}종목만 더 하면 완벽 도장!`;
    sub = t.stamp === 90 && !t.bikeOpen ? `실내자전거 기록은 ${d.rule.bikeFromHour}시부터 반영돼요. ${d.rule.bikeKm}km 이상이면 완벽 도장!`
      : t.stamp ? '' : '모든 종목을 기준 시간 이상 하면 도장을 받아요.';
  } else {
    title = t.stamp === 100 ? '완벽 도장을 받은 날 🎉' : t.stamp === 90 ? '도장을 받은 날!'
      : t.done ? `${t.need}종목 중 ${t.done}종목을 했어요` : '운동 기록이 없는 날';
    sub = t.stamp === 90 ? `실내자전거 ${d.rule.bikeKm}km를 더 탔으면 완벽 도장이었어요.` : '';
  }
  const notes = [];
  if (t.weekend) notes.push(`${t.holiday ? t.holiday + ' · ' : ''}휴일에는 트레드밀·로잉머신·행잉을 빼고, 모두 하면 바로 완벽 도장이에요`);

  const items = t.items.map(i => {
    const cls = (i.ok ? 'ok' : i.tried ? 'part' : '') + (isToday ? '' : ' past');
    const s = i.ok ? `${fmtSec(i.sec)}초 통과` : i.tried ? `${fmtSec(i.sec)}초 · ${fmtSec(i.min - i.sec)}초 모자람` : isToday ? `${i.min}초 이상` : '기록 없음';
    const inner = `<span class="n">${esc(i.name)}</span><span class="s">${esc(s)}</span>`;
    return isToday ? `<a class="it ${cls}" href="${esc(goUrl(i.key))}">${inner}<span class="go">하러 가기 ›</span></a>`
      : `<div class="it ${cls}">${inner}</div>`;
  }).join('');
  const bikeW = Math.min(100, t.km / d.rule.bikeKm * 100);
  const bikeS = t.weekend && !t.bikeOk ? (t.km ? `${t.km}km · 휴일엔 없어도 완벽` : '휴일엔 없어도 완벽 도장') : !t.bikeOpen ? `${d.rule.bikeFromHour}시부터 반영` : t.bikeOk ? `${t.km}km 통과` : t.km ? `${t.km}km / ${d.rule.bikeKm}km` : (isToday ? `0km / ${d.rule.bikeKm}km` : '기록 없음');

  const prev = data._prevMonth, next = data._nextMonth;
  const [Y, M] = d.month.split('-').map(Number);
  const firstDow = new Date(Y, M - 1, 1).getDay();       // 0=일
  const last = new Date(Y, M, 0).getDate();
  let cells = WD.map((w, i) => `<div class="wd${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${w}</div>`).join('');
  for (let i = 0; i < firstDow; i++) cells += '<div></div>';
  for (let i = 1; i <= last; i++) {
    const key = d.month + '-' + String(i).padStart(2, '0'), x = d.days[key];
    if (!x) { cells += `<div class="d future"><span class="num">${i}</span></div>`; continue; }
    const mk = x.stamp === 100 ? '<span class="mk s100">완벽</span>' : x.stamp === 90 ? '<span class="mk s90">90</span>'
      : x.done ? `<span class="bar"><i style="width:${Math.round(x.done / x.need * 100)}%"></i></span>` : '';
    cells += `<button class="d${key === d.today ? ' today' : ''}${key === sel ? ' sel' : ''}" data-day="${key}" title="${key} · ${x.done}/${x.need}종목"><span class="num">${i}</span>${mk}</button>`;
  }
  const rel = isToday ? '오늘' : sel === addDay(d.today, -1) ? '어제' : sel === addDay(d.today, -2) ? '그제' : '';

  $('app').innerHTML = `<main>
    <section class="card" id="dayCard">
      <div class="dayNav">
        <button class="nav" id="dPrev" ${sel <= '2026-09-01' ? 'disabled' : ''} aria-label="전날">‹</button>
        <div class="label">${esc(dayName(sel))}${rel ? `<small>${rel}</small>` : ''}</div>
        ${isToday ? '' : '<button class="toToday" id="toToday">오늘로</button>'}
        <button class="nav" id="dNext" ${isToday ? 'disabled' : ''} aria-label="다음 날">›</button>
      </div>
      <div class="todayTop" style="margin-top:12px">
        <div class="seal ${sealCls}${isToday && lastStamp !== null && t.stamp > lastStamp ? ' pop' : ''}">${sealHtml}</div>
        <div class="todayTxt"><h2>${esc(title)}</h2><p>${esc(sub)}</p>
          <div class="prog"><i id="progBar"></i></div></div>
      </div>
      <div class="note" id="note">${esc(notes.join(' · '))}</div>
      <div class="items">${items}</div>
      <div class="bike${t.bikeOk ? ' ok' : ''}"><span class="n">🚴 실내자전거</span><span class="w"><i id="bikeBar"></i></span><span class="s">${esc(bikeS)}</span></div>
      ${teamHtml(d, sel, isToday)}
    </section>
    <section class="card">
      <div class="calHead">
        <button class="nav" id="prev" ${prev ? '' : 'disabled'} aria-label="이전 달">‹</button>
        <h3>${Y}년 ${M}월</h3>
        <button class="nav" id="next" ${next ? '' : 'disabled'} aria-label="다음 달">›</button>
      </div>
      <div class="sum">
        <div><b>${d.monthCount}</b><span>이달 도장</span></div>
        <div><b>${d.monthPerfect}</b><span>완벽 도장</span></div>
        <div><b>${d.streak}</b><span>연속 일수</span></div>
      </div>
      <div class="cal">${cells}</div>
      <div class="legend">
        <span><i style="border:3px solid var(--yellow)"></i>90 도장</span>
        <span><i style="background:var(--yellow)"></i>완벽 도장</span>
        <span><i style="background:rgba(255,255,255,.55);height:5px;border-radius:999px;width:18px"></i>한 만큼</span>
      </div>
      <div class="rules">
        · 날짜를 누르거나 왼쪽 카드를 옆으로 밀면 그날 기록을 볼 수 있어요<br>
        · <b>90 도장</b>: 그날 정해진 종목을 모두 기준 시간 이상 해요 (휴일엔 스포츠실 종목 빼고)<br>
        · <b>완벽 도장</b>: 90 도장 + 실내자전거 ${d.rule.bikeKm}km 이상${d.rule.bikeKm >= 5 ? ` (${d.rule.bikeKm}km = 10분)` : ''}<br>
        · <b>휴일</b>(주말·공휴일)에는 정해진 종목을 모두 하면 자전거 없이도 완벽 도장<br>
        · 연속 일수는 주말·휴일에도 도장을 받아야 이어져요 (오늘은 아직 끊기지 않아요)<br>
        · <b>모둠 도장</b>: 모둠원 모두가 도장을 받은 날 (모두 완벽 도장이면 완벽 모둠 도장)
      </div>
    </section>
    ${pointsHtml(d)}
  </main>`;
  $('note').style.display = notes.length ? 'block' : 'none';
  requestAnimationFrame(() => {
    $('progBar').style.width = (t.need ? t.done / t.need * 100 : 0) + '%';
    $('bikeBar').style.width = (t.bikeOpen ? bikeW : 0) + '%';
  });
  $('dPrev').onclick = () => goDay(addDay(sel, -1));
  $('dNext').onclick = () => goDay(addDay(sel, 1));
  if ($('toToday')) $('toToday').onclick = () => goDay(d.today);
  $('prev').onclick = () => { if (prev) { month = prev; sel = ''; load(); } };
  $('next').onclick = () => { if (next) { month = next; sel = ''; load(); } };
  document.querySelectorAll('button.d').forEach(b => b.onclick = () => goDay(b.dataset.day));
  // 왼쪽 카드를 옆으로 밀기: 오른쪽으로 밀면 전날, 왼쪽으로 밀면 다음 날
  const card = $('dayCard'); let sx = null, sy = 0;
  card.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  card.addEventListener('touchend', e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) goDay(addDay(sel, dx > 0 ? -1 : 1));
  }, { passive: true });
  if (isToday) lastStamp = t.stamp;
}

const shift = (m, n) => { const [y, mo] = m.split('-').map(Number); const t = new Date(y, mo - 1 + n, 1); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0'); };

async function load() {
  const my = ++seq;
  $('status').textContent = '불러오는 중…';
  try {
    const q = { action: 'stamp', email: EMAIL }; if (month) q.month = month;
    let d;
    try { d = await jsonp(q); }
    catch (e1) {                                   // 한 번 실패하면 3초 뒤 한 번 더
      if (my !== seq) return;
      $('status').textContent = '응답이 늦어 다시 불러오는 중…';
      await new Promise(r => setTimeout(r, 3000));
      if (my !== seq) return;
      d = await jsonp(q);
    }
    if (my !== seq) return;
    if (!d || !d.ok) { const er = new Error(d && d.error || '불러오지 못했어요'); er.server = true; throw er; }
    d._prevMonth = d.month > '2026-09' ? shift(d.month, -1) : '';      // 기록은 2026년 9월부터
    d._nextMonth = d.month < d.today.slice(0, 7) ? shift(d.month, 1) : '';
    data = d; month = d.month;
    render();
    $('status').textContent = (d.updated || '') + ' 기준 · 1분마다 새로 고침';
  } catch (e) {
    if (my !== seq) return;
    if (!data) $('app').innerHTML = `<div class="empty">${esc(e.server ? e.message : '서버 응답이 늦어요. 1분 뒤 자동으로 다시 불러와요.')}<br><a href="../">허브로 돌아가기</a></div>`;
    // 원인을 나눠 보여 줌: 인터넷 / 서버 응답 늦음 / 서버가 알려 준 오류
    const why = !navigator.onLine ? '인터넷 연결이 끊겼어요'
      : e.server ? '서버 오류: ' + e.message
      : e.message === '시간 초과' ? '서버 응답이 늦어요' : '서버에 연결하지 못했어요';
    $('status').textContent = why + (data ? ' · 이전 화면을 보여 주는 중, 1분 뒤 다시 시도' : ' · 1분 뒤 다시 시도');
  }
}

if (!/^[\w.\-]+@[\w.\-]+$/.test(EMAIL)) {
  $('app').innerHTML = '<div class="empty">허브에서 <b>내 도장</b>을 누르고<br>이름을 골라 들어와 주세요.<br><br><a href="../">허브로 가기</a></div>';
} else {
  $('who').textContent = NAME;
  load();
  setInterval(() => { if (!document.hidden && (!data || month === data.today.slice(0, 7))) load(); }, CONFIG.REFRESH_SEC * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  addEventListener('keydown', e => { if (!data) return; if (e.key === 'ArrowLeft') goDay(addDay(sel, -1)); else if (e.key === 'ArrowRight') goDay(addDay(sel, 1)); });
}
</script>
</body>
</html>
