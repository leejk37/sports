<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행잉 측정</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e8c">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="행잉">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --blue:#1f4e8c; --blue-d:#173d6e; --yellow:#f5c518; --ink:#ffffff;
    --soft:rgba(255,255,255,.82); --good:#7ee8b5; --warn:#ffb199; --stage:#000;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Pretendard,system-ui,sans-serif;background:var(--blue);color:var(--ink)}
  #app{display:flex;flex-direction:column;height:100%}

  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--blue);border-bottom:4px solid var(--yellow)}
  header h1{margin:0;font-size:24px;font-weight:800;flex:1;letter-spacing:-.5px}
  .hbtn{font:inherit;font-size:15px;font-weight:700;padding:8px 12px;border-radius:8px;
    border:1.5px solid rgba(255,255,255,.75);background:transparent;color:#fff;cursor:pointer}

  #main{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;background:var(--stage);overflow:hidden;border-right:4px solid var(--yellow)}
  #view{width:100%;height:100%;object-fit:contain;display:block}
  #video{display:none}
  #hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(20,30,50,.85);
    padding:10px 20px;border-radius:999px;font-size:18px;font-weight:700;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
  #hint:empty{display:none}
  #big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:min(30vh,220px);font-weight:900;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6);pointer-events:none}
  #flash{position:absolute;left:50%;top:24px;transform:translateX(-50%);padding:10px 22px;border-radius:12px;
    background:#d9480f;color:#fff;font-size:24px;font-weight:800;opacity:0;transition:opacity .2s;white-space:nowrap}
  #flash.on{opacity:1}
  #flash.good{background:#2b8a3e}

  #side{width:min(36vw,420px);background:var(--blue);display:flex;flex-direction:column;padding:26px 22px;gap:14px;overflow:auto}
  #who{font-size:16px;color:var(--soft);min-height:22px}
  .screen{display:none;flex-direction:column;gap:14px}
  .screen.on{display:flex}
  .screen h2{margin:0;font-size:28px;font-weight:800;line-height:1.3;letter-spacing:-.5px}
  .screen p{margin:0;font-size:17px;font-weight:600;color:var(--soft);line-height:1.55}
  button.btn{font:inherit;font-size:21px;font-weight:800;padding:16px;border-radius:12px;cursor:pointer;
    border:2px solid #fff;background:#fff;color:var(--blue);text-align:left}
  button.btn small{display:block;font-size:15px;font-weight:600;opacity:.75;margin-top:4px}
  button.btn.line{background:transparent;color:#fff;text-align:center}
  button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  #waitState{font-size:20px;font-weight:800;color:var(--yellow)}
  .count{font-size:110px;font-weight:900;line-height:1;color:#fff}
  .count small{font-size:28px;font-weight:700;margin-left:6px;color:var(--soft)}
  .rows{border-top:1px solid rgba(255,255,255,.25)}
  .row{display:flex;justify-content:space-between;font-size:19px;font-weight:700;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.25)}
  .row b{color:var(--warn)}
  #saveState{font-size:17px;font-weight:700;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.12)}
  #saveState:empty{display:none}
  #saveState.ok{color:var(--good)}
  #saveState.fail{color:var(--warn)}
  @media (max-width:820px), (orientation:portrait){#main{flex-direction:column}#stage{border-right:0;border-bottom:4px solid var(--yellow)}#side{width:auto;max-height:42%}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>행잉 측정</h1>
    <button class="hbtn" id="flip">카메라 전환</button>
    <button class="hbtn" id="cancel">처음으로</button>
  </header>

  <div id="main">
    <div id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="view"></canvas>
      <div id="big"></div>
      <div id="flash"></div>
      <div id="hint"></div>
    </div>

    <aside id="side">
      <div id="who"></div>

      <section class="screen" id="s-loading">
        <h2>준비하고 있어요</h2>
        <p>카메라와 동작 인식 모델을 불러오는 중이에요.</p>
      </section>

      <section class="screen" id="s-scan">
        <h2>QR 이름표를<br>카메라에 보여 주세요</h2>
        <p>이름표가 확인되면 바로 철봉 잡기 화면으로 넘어가요.</p>
      </section>

      <section class="screen" id="s-countdown">
        <h2>곧 시작해요</h2>
        <p>‘시작’ 소리가 나면 발을 떼고 매달려요.</p>
      </section>

      <section class="screen" id="s-wait">
        <h2 id="waitTitle">철봉을<br>두 손으로 잡아요</h2>
        <p id="waitText">두 손이 머리 위 철봉을 잡으면 3-2-1이 시작돼요.</p>
        <div id="waitState"></div>
        <button class="btn line" id="forceStart">바로 시작</button>
      </section>

      <section class="screen" id="s-measure">
        <div class="count"><span id="mainNum">0</span><small id="mainUnit">초</small></div>
        <button class="btn line" id="stopBtn">측정 끝내기</button>
      </section>

      <section class="screen" id="s-result">
        <h2>측정 끝!</h2>
        <div class="count"><span id="resMain">0</span><small id="resUnit">초</small></div>
        <div class="rows" id="resRows"></div>
        <div id="saveState"></div>
        <button class="btn line" id="retrySave" hidden>다시 저장</button>
        <button class="btn" id="again">한 번 더</button>
        <button class="btn line" id="next">다음 학생</button>
      </section>
    </aside>
  </div>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ===== 설정: 다른 운동 앱과 같은 GAS_URL, TOKEN ===== */
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzZIU-UeiWcXuN47lW4XSSwvD9EgP06NdJYrX5NKDf96oqEnfsqaI0B2B3YrvZ6Yw0eVw/exec',
  TOKEN:   '26cp4s_squat',
  TYPE:    'hang',
  DOMAIN:  '@cpe.es.kr',

  // ---- 판정 기준 (길이는 어깨너비 S에 대한 비율) ----
  // 화면에는 철봉부터 허리까지만 보이면 돼요 (발은 안 보여도 됨)
  BENT_ELBOW: 130,       // 매달리기: 팔꿈치가 이보다 굽으면 '팔 펴기' 안내
  START_STABLE_MS: 800,  // 두 손으로 철봉을 이만큼 잡고 있으면 3-2-1 시작
  COUNTDOWN_SEC: 3,      // 카운트다운 (시작 소리에 발을 뗌)
  END_GRACE_MS: 500,     // 조건이 이만큼 깨져 있어야 끝 (순간 인식 흔들림 무시)
  LOST_MS: 1500,         // 사람을 이만큼 못 찾으면 끝
  MAX_SEC: 180,          // 최대 측정 시간
  VIS_MIN: 0.5,          // 어깨·코 인식 신뢰도
  VIS_WRIST: 0.3,        // 손목 인식 신뢰도 (철봉 근처는 낮게 잡힘)
  SAVE_TIMEOUT_MS: 30000
};

/* ===== 화면 요소 ===== */
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('view'), ctx = canvas.getContext('2d');
const qrCanvas = document.createElement('canvas'), qrCtx = qrCanvas.getContext('2d', { willReadFrequently: true });

/* ===== 상태 ===== */
let mode = 'loading', method = 'hang';
let pose, stream, facing = localStorage.getItem('hangFacing') || 'user';
let email = '', clientId = '';
let S0 = null, lastS = null, cdTimer = null, cdLostSince = null;
let hangSince = null, startAt = 0, lastGoodAt = 0, badSince = null, lastSeenAt = 0;
let result = null;
let lastQr = 0, lastVideoTime = -1;
let audio, wakeLock;

function show(m) {
  mode = m;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + m));
  $('big').textContent = '';
  setHint();
}
const HINTS = {
  scan: 'QR 이름표를 화면 가운데에 비춰 주세요',
  wait: '철봉부터 허리까지 화면에 들어오게 해요',
  countdown: '철봉을 잡은 채 기다려요',
};
function setHint(text) { $('hint').textContent = text ?? HINTS[mode] ?? ''; }

/* ===== 소리·알림 ===== */
function beep(freq = 880, ms = 120) {
  try {
    audio ??= new AudioContext();
    if (audio.state === 'suspended') audio.resume();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.25, audio.currentTime);
    o.start(); o.stop(audio.currentTime + ms / 1000);
  } catch (e) {}
}
let flashTimer;
function flash(text, good = false) {
  const f = $('flash');
  f.textContent = text; f.classList.toggle('good', good); f.classList.add('on');
  clearTimeout(flashTimer); flashTimer = setTimeout(() => f.classList.remove('on'), 900);
}

/* ===== 카메라 ===== */
async function startCamera() {
  stream?.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
}

/* ===== 자세 분석 ===== */
function angle(a, b, c) {
  const v1x = a.x - b.x, v1y = a.y - b.y, v2x = c.x - b.x, v2y = c.y - b.y;
  const cos = (v1x * v2x + v1y * v2y) / (Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y) || 1);
  return Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
}

function analyze(lm) {
  const W = canvas.width, H = canvas.height;
  const p = i => ({ x: lm[i].x * W, y: lm[i].y * H, v: lm[i].visibility ?? 0 });
  const nose = p(0), ls = p(11), rs = p(12), le = p(13), re = p(14), lw = p(15), rw = p(16),
        lh = p(23), rh = p(24), la = p(27), ra = p(28);
  const bodyOk = [nose, ls, rs].every(q => q.v > CONFIG.VIS_MIN);
  const S = Math.max(20, Math.hypot(ls.x - rs.x, ls.y - rs.y));   // 어깨너비
  const wA = lw.v > CONFIG.VIS_WRIST ? lw : null, wB = rw.v > CONFIG.VIS_WRIST ? rw : null;
  return {
    bodyOk, S, nose, wA, wB,
    elbow: Math.min(angle(ls, le, lw), angle(rs, re, rw)),
    segs: [[ls, rs], [ls, le], [le, lw], [rs, re], [re, rw], [ls, lh], [rs, rh], [lh, rh], [lh, p(25)], [p(25), la], [rh, p(26)], [p(26), ra]]
  };
}
const handUp = (w, r) => !!w && w.y < r.nose.y;          // 손목이 코보다 위

/* ===== 그리기 ===== */
const mirror = () => facing === 'user';
function drawVideo() {
  ctx.save();
  if (mirror()) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();
}
function drawPose(r, live) {
  const X = x => mirror() ? canvas.width - x : x;
  ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.strokeStyle = live ? '#5fd3a6' : '#f0a070';
  r.segs.forEach(([a, b]) => {
    if (a.v < CONFIG.VIS_WRIST || b.v < CONFIG.VIS_WRIST) return;
    ctx.beginPath(); ctx.moveTo(X(a.x), a.y); ctx.lineTo(X(b.x), b.y); ctx.stroke();
  });
  ctx.fillStyle = '#fff';
  [r.wA, r.wB].forEach(w => { if (w) { ctx.beginPath(); ctx.arc(X(w.x), w.y, 12, 0, 7); ctx.fill(); } });
  const line = (y, color, dash) => {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); ctx.restore();
  };
}

/* ===== 메인 루프 ===== */
function loop() {
  requestAnimationFrame(loop);
  if (!video.videoWidth) return;
  drawVideo();
  const now = performance.now();

  if (mode === 'scan' && now - lastQr > 250) { lastQr = now; scanQr(); return; }
  if (!['wait', 'countdown', 'measure'].includes(mode) || !pose) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const lm = pose.detectForVideo(video, now).landmarks?.[0];
  if (!lm || !analyzeOk(lm)) {
    setHint('철봉부터 허리까지 화면에 들어오게 해 주세요');
    if (mode === 'countdown') countdownCheck(false, now);
    if (mode === 'measure' && now - lastSeenAt > CONFIG.LOST_MS) finish(lastGoodAt);
    return;
  }
  lastSeenAt = now;
  const r = analyze(lm);
  if (r.bodyOk) lastS = r.S;
  if (mode === 'wait') return wait(r, now);
  if (mode === 'countdown') { const up = bothUp(r); drawPose(r, up); return countdownCheck(up, now); }
  measure(r, now);
}
function analyzeOk(lm) { return lm && lm.length > 28; }

/* ===== QR 인식 ===== */
function scanQr() {
  const w = 640, h = Math.round(640 * video.videoHeight / video.videoWidth);
  qrCanvas.width = w; qrCanvas.height = h;
  qrCtx.drawImage(video, 0, 0, w, h);
  const code = jsQR(qrCtx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
  if (!code) return;
  const id = code.data.trim();
  if (!/^[\w.\-]+(@[\w.\-]+)?$/.test(id)) { flash('이름표 QR이 아니에요'); return; }
  email = (id.includes('@') ? id : id + CONFIG.DOMAIN).toLowerCase();
  $('who').textContent = email;
  beep(1200, 80);
  toWait();
}

/* ===== 1단계: 철봉 잡기 대기 ===== */
const bothUp = r => r.bodyOk && handUp(r.wA, r) && handUp(r.wB, r);
function toWait(m = method) {
  method = 'hang'; hangSince = null;
  clearTimeout(cdTimer);
  beep(660, 60);   // 첫 터치로 소리 켜기
  $('waitText').textContent = '두 손으로 잡으면 3-2-1이 시작돼요. ‘시작’ 소리에 발을 떼고 팔을 편 채 버텨요. (소리가 안 나면 화면을 한 번 눌러 주세요)';
  show('wait');
}

/* ===== 2단계: 두 손 잡음 확인 → 3-2-1 → 시작 ===== */
function wait(r, now) {
  const up = bothUp(r);
  drawPose(r, up);
  $('waitState').textContent = up ? '✓ 두 손 확인!' : '두 손으로 철봉을 잡아요…';
  if (!up) { hangSince = null; return; }
  hangSince ??= now;
  if (now - hangSince > CONFIG.START_STABLE_MS) startCountdown();
}
function startCountdown() {
  show('countdown'); cdLostSince = null;
  let n = CONFIG.COUNTDOWN_SEC;
  const tick = () => {
    if (mode !== 'countdown') return;
    if (n > 0) { $('big').textContent = n; beep(660, 150); n--; cdTimer = setTimeout(tick, 1000); }
    else startMeasure();
  };
  tick();
}
function countdownCheck(up, now) {   // 카운트다운 중 손을 놓으면 다시 대기
  if (up) { cdLostSince = null; return; }
  cdLostSince ??= now;
  if (now - cdLostSince > CONFIG.END_GRACE_MS) { clearTimeout(cdTimer); flash('철봉을 계속 잡고 있어요'); toWait(); }
}
function startMeasure(now = performance.now()) {
  S0 = lastS;
  startAt = now; lastGoodAt = now; lastSeenAt = now; badSince = null;
  clientId = crypto.randomUUID?.() || String(Date.now()) + Math.random();
  $('mainUnit').textContent = '초';
  $('mainNum').textContent = '0.0';
  show('measure');
  $('big').textContent = '발 떼!'; setTimeout(() => mode === 'measure' && ($('big').textContent = ''), 800);
  beep(1000, 400);
}

/* ===== 3단계: 측정 ===== */
function measure(r, now) {
  const sec = (now - startAt) / 1000;
  if (sec >= CONFIG.MAX_SEC) return finish(now);
  const ok = bothUp(r);
  setHint(ok && r.elbow < CONFIG.BENT_ELBOW ? '팔을 쭉 펴요' : '');
  if (ok) $('mainNum').textContent = sec.toFixed(1);
  drawPose(r, ok);

  if (ok) { lastGoodAt = now; badSince = null; return; }
  badSince ??= now;
  if (now - badSince > CONFIG.END_GRACE_MS) finish(lastGoodAt);
}

/* ===== 결과 ===== */
function finish(endTime = performance.now()) {
  if (mode !== 'measure') return;
  const seconds = Math.max(0, Math.round((endTime - startAt) / 100) / 10);
  result = { seconds };
  beep(500, 500);
  show('result');
  setHint('');
  $('resMain').textContent = seconds.toFixed(1); $('resUnit').textContent = '초';
  $('resRows').innerHTML = '<div class="row"><span>방법</span><span>매달리기</span></div>';
  save();
}

/* ===== 저장 ===== */
function setSave(text, cls) {
  const el = $('saveState'); el.textContent = text; el.className = cls || '';
  $('retrySave').hidden = cls !== 'fail';
}
async function save() {
  setSave('저장 중…');
  const body = {
    type: CONFIG.TYPE, token: CONFIG.TOKEN, email, method,
    seconds: result.seconds, clientId
  };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.SAVE_TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow', credentials: 'omit', signal: ctrl.signal
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error('서버 응답을 읽지 못했어요: ' + text.slice(0, 60)); }
    if (data.ok !== true) throw new Error(data.error || '서버에서 저장을 거부했어요');
    setSave((data.name ? data.name + ' 학생 ' : '') + '저장 완료', 'ok');
  } catch (e) {
    console.error(e);
    const serverRefused = /인증 실패|명단에 없는|학교 계정|거부/.test(e.message);
    const unreadable = !serverRefused && (e.name === 'TypeError' || String(e.message).includes('<!DOCTYPE'));
    if (unreadable && navigator.onLine) {
      setSave('전송 완료 (결과 확인 불가 · 시트에서 확인)', 'ok');
      $('retrySave').hidden = false;   // 같은 clientId라 다시 보내도 중복 저장 안 됨
      return;
    }
    const msg = e.name === 'AbortError' ? '응답이 늦어요. 시트를 확인한 뒤 필요하면 다시 저장하세요.' : e.message;
    setSave('저장 실패: ' + msg, 'fail');
  } finally { clearTimeout(timer); }
}

/* ===== 허브 연결: 주소에 학생 정보가 있으면 QR 단계를 건너뜀 ===== */
const PARAMS = new URLSearchParams(location.search);
const FROM_HUB = PARAMS.get('from') === 'hub';
function startFromParams() {
  const em = (PARAMS.get('email') || '').trim().toLowerCase();
  if (!/^[\w.\-]+@[\w.\-]+$/.test(em)) return false;
  email = em;
  $('who').textContent = (PARAMS.get('name') || em.split('@')[0]) + ' 학생';
  toWait();
  return true;
}
function backOrScan() {
  if (FROM_HUB) { location.href = '../'; return; }
  email = ''; $('who').textContent = ''; show('scan');
}
if (FROM_HUB) {
  $('next').textContent = '허브로 돌아가기';
  $('cancel').textContent = '허브로';
}

/* ===== 버튼 ===== */
// 메뉴 없이 바로 시작하므로, 화면을 처음 누를 때 소리를 켬 (브라우저 소리 제한 대비)
document.addEventListener('pointerdown', () => {
  try { audio ??= new AudioContext(); if (audio.state === 'suspended') audio.resume(); } catch (e) {}
}, { passive: true });
$('next').onclick = $('cancel').onclick = backOrScan;
$('forceStart').onclick = () => startCountdown();
$('stopBtn').onclick = () => finish(lastGoodAt);
$('again').onclick = () => toWait(method);
$('retrySave').onclick = save;
$('flip').onclick = async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  localStorage.setItem('hangFacing', facing);
  await startCamera();
};

/* ===== 시작 ===== */
(async () => {
  show('loading');
  try {
    await startCamera();
    requestAnimationFrame(loop);
    const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    pose = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO', numPoses: 1
    });
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
    if (!startFromParams()) show('scan');
  } catch (e) {
    $('s-loading').innerHTML = '<p>카메라 또는 모델을 불러오지 못했어요.<br>' + e.message + '</p>';
  }
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
  }
</script>
</body>
</html>
