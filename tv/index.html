<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스마트스포츠실 TV</title>
<meta name="theme-color" content="#1f4e8c">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<style>
  /* 현황판 여러 장을 슬라이드처럼 번갈아 보여 주는 화면 (스포츠실 TV용)
   *  ←/→ 키 또는 아래 점을 눌러 넘기기, F 키 또는 ⛶ 버튼으로 전체 화면
   *  주소 뒤 ?sec=20 처럼 넘기는 간격(초)을 바꿀 수 있음 */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1f4e8c;font-family:system-ui,sans-serif}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .8s ease;pointer-events:none}
  iframe.on{opacity:1;pointer-events:auto}
  #nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
    padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.28);z-index:2;opacity:.35;transition:opacity .3s}
  #nav:hover{opacity:1}
  #nav button{width:14px;height:14px;padding:0;border-radius:50%;border:2px solid #fff;background:transparent;cursor:pointer}
  #nav button.on{background:#f5c518;border-color:#f5c518}
  #nav .fs{width:auto;height:auto;border:0;border-radius:6px;color:#fff;font-size:15px;padding:0 4px}
  #bar{position:fixed;left:0;bottom:0;height:4px;width:0;background:#f5c518;z-index:2;opacity:.7}
</style>
</head>
<body>
<iframe src="../board/" title="스마트스포츠실 오늘"></iframe>
<iframe src="../ride/" title="인도어라이딩 기록판"></iframe>
<div id="nav"></div>
<div id="bar"></div>
<script>
const SEC = Math.max(5, Number(new URLSearchParams(location.search).get('sec')) || 30);   // 한 장 보여 주는 시간(초)
const frames = [...document.querySelectorAll('iframe')];
const nav = document.getElementById('nav'), bar = document.getElementById('bar');
let cur = 0, timer = null;

frames.forEach((f, i) => {
  const b = document.createElement('button');
  b.title = f.title; b.onclick = () => show(i);
  nav.appendChild(b);
});
const fs = document.createElement('button');
fs.className = 'fs'; fs.textContent = '⛶'; fs.title = '전체 화면 (F)';
fs.onclick = full; nav.appendChild(fs);

function show(i) {
  cur = (i + frames.length) % frames.length;
  frames.forEach((f, k) => f.classList.toggle('on', k === cur));
  [...nav.children].forEach((b, k) => b.classList.toggle('on', k === cur));
  // 진행 막대
  bar.style.transition = 'none'; bar.style.width = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${SEC}s linear`; bar.style.width = '100%';
  }));
  clearTimeout(timer);
  timer = setTimeout(() => show(cur + 1), SEC * 1000);
}
function full() {
  if (!document.fullscreenElement && document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(() => {});
}
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') show(cur + 1);
  else if (e.key === 'ArrowLeft') show(cur - 1);
  else if (e.key === 'f' || e.key === 'F') full();
});
show(0);
setTimeout(() => location.reload(), 6 * 3600 * 1000);   // 오래 켜 두는 화면이라 가끔 새로 고침
</script>
</body>
</html>
