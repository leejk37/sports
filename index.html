<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR입장_스마트스포츠앱</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e8c">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스마트스포츠">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --blue:#1f4e8c; --blue-d:#173d6e; --blue-l:#2a62ab; --yellow:#f5c518;
    --soft:rgba(255,255,255,.8); --line:rgba(255,255,255,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Pretendard,system-ui,sans-serif;background:var(--blue);color:#fff}
  /* 100dvh: 휴대폰 주소창을 뺀 실제 보이는 높이 (지원 안 하는 기기는 100%) */
  #app{display:flex;flex-direction:column;height:100%;height:100dvh}

  header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:4px solid var(--yellow)}
  header h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px;flex:1}
  /* 로그인 없이 누구나 여는 화면 (현황판·순위·인도어사이클) */
  #views{display:flex;gap:6px;flex-wrap:wrap}
  .vlink{font-size:14px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--yellow);color:var(--blue-d);text-decoration:none;white-space:nowrap}
  .vlink:active{transform:translateY(1px)}
  .vlink:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .room{font-size:14px;font-weight:800;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.16)}
  .room.off{background:#d9480f}
  #clock{font-size:18px;font-weight:700;color:var(--soft)}
  .hbtn{font:inherit;font-size:15px;font-weight:700;padding:8px 12px;border-radius:8px;
    border:1.5px solid rgba(255,255,255,.75);background:transparent;color:#fff;cursor:pointer}

  #main{flex:1;display:flex;min-height:0}

  /* 왼쪽: QR 로그인 + 로그인한 학생 */
  #left{width:min(40vw,520px);display:flex;flex-direction:column;gap:14px;padding:18px;border-right:4px solid var(--yellow);background:var(--blue-d)}
  #cam{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3}
  #view{width:100%;height:100%;object-fit:cover;display:block}
  #video{display:none}
  #frame{position:absolute;inset:18% 26%;border:4px solid var(--yellow);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
  #camHint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(20,30,50,.85);
    padding:8px 16px;border-radius:999px;font-size:16px;font-weight:700;white-space:nowrap}
  #toast{position:absolute;left:12px;right:12px;top:12px;padding:12px;border-radius:12px;background:#2f9e44;
    font-size:20px;font-weight:800;text-align:center;opacity:0;transform:translateY(-8px);transition:.25s}
  #toast.on{opacity:1;transform:none}
  #toast.warn{background:#d9480f}

  .secTitle{display:flex;align-items:baseline;gap:8px;margin:4px 0 0}
  .secTitle h2{margin:0;font-size:22px;font-weight:800}
  .secTitle span{color:var(--soft);font-weight:700}
  .secTitle button{margin-left:auto}
  #students{display:flex;flex-wrap:wrap;gap:8px;overflow:auto;align-content:flex-start;flex:1}
  .chip{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-radius:999px;
    background:#fff;color:var(--blue);font-size:18px;font-weight:800;border:0;cursor:pointer;font-family:inherit}
  .chip small{font-size:13px;color:#6b7a8c;font-weight:700}
  .chip .x{width:24px;height:24px;border-radius:50%;background:#e8edf3;display:grid;place-items:center;font-size:14px}
  #empty{color:var(--soft);font-size:17px;line-height:1.6}

  /* 오른쪽: 운동 메뉴 */
  #right{flex:1;padding:22px;overflow:auto}
  #right > h2{margin:0 0 4px;font-size:30px;font-weight:800;letter-spacing:-.5px}
  #right > p{margin:0 0 18px;color:var(--soft);font-size:17px;font-weight:600}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:20px;border-radius:18px;
    background:#fff;color:var(--blue);border:0;cursor:pointer;text-align:left;font-family:inherit;min-height:190px;
    box-shadow:0 6px 0 var(--blue-d);transition:transform .1s, box-shadow .1s}
  .card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue-d)}
  .card svg{width:72px;height:72px}
  .card b{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .card span{font-size:15px;font-weight:600;color:#5b6b80}
  .card .tag{position:absolute;top:14px;right:14px;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:#e7f0fb;color:var(--blue)}
  .card.soon{opacity:.55;cursor:default}
  .card.soon .tag{background:#eee;color:#777}
  button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  /* 학생 선택 창 */
  #picker{position:fixed;inset:0;background:rgba(5,15,30,.6);display:none;align-items:flex-end;justify-content:center}
  #picker.on{display:flex}
  #sheet{width:min(900px,100%);max-height:80vh;overflow:auto;background:var(--blue);border-top:6px solid var(--yellow);
    border-radius:22px 22px 0 0;padding:24px}
  #sheet h3{margin:0;font-size:28px;font-weight:800}
  #sheet p{margin:6px 0 18px;color:var(--soft);font-size:17px;font-weight:600}
  #names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  #names button{font:inherit;font-size:24px;font-weight:800;padding:22px 10px;border-radius:14px;border:0;background:#fff;color:var(--blue);cursor:pointer}
  #names button small{display:block;font-size:13px;color:#6b7a8c;margin-top:4px}
  #closePicker{margin-top:18px;width:100%;font:inherit;font-size:19px;font-weight:800;padding:14px;border-radius:12px;
    border:2px solid #fff;background:transparent;color:#fff;cursor:pointer}

  /* ===== 휴대폰 화면 맞춤 ===== */
  /* 세로 폰·세로 태블릿: 카메라 위, 운동 카드 아래 (한 화면 스크롤) */
  @media (max-width:860px) and (orientation:portrait){
    header{flex-wrap:wrap}
    #views{order:5;width:100%}
    #clock{display:none}
    #main{flex-direction:column;overflow:auto}
    #left{width:auto;border-right:0;border-bottom:4px solid var(--yellow);padding:12px;gap:10px}
    #students{flex:none}
    #right{overflow:visible;padding:16px 12px 24px}
  }
  /* 세로 폰(좁은 폭): 머리글 한 줄, 카드 2열로 작게 */
  @media (max-width:560px) and (orientation:portrait){
    header{gap:8px;padding:8px 12px}
    header h1{font-size:19px}
    #clock{display:none}
    .room{font-size:12px;padding:4px 9px}
    .hbtn{font-size:13px;padding:6px 9px}
    #camHint{font-size:14px;padding:6px 12px}
    .secTitle h2{font-size:18px}
    .chip{font-size:16px;padding:8px 10px 8px 14px}
    #right > h2{font-size:21px}
    #right > p{font-size:14px;margin-bottom:12px}
    #grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .card{min-height:0;padding:14px;gap:6px;border-radius:14px}
    .card svg{width:44px;height:44px}
    .card b{font-size:18px}
    .card span{font-size:12px}
    .card .tag{position:static;order:-1;font-size:11px;padding:3px 8px}
  }
  /* 가로 폰(높이가 낮음): 태블릿처럼 좌우 배치, 각자 스크롤 */
  @media (orientation:landscape) and (max-height:520px){
    header{gap:8px;padding:5px 12px;border-bottom-width:3px}
    header h1{font-size:18px}
    #clock{font-size:14px}
    .room{font-size:12px;padding:3px 9px}
    .hbtn{font-size:13px;padding:5px 9px}
    #left{width:44vw;padding:8px;gap:6px;border-right-width:3px}
    #cam{flex:none;max-height:58%;width:auto;margin:0 auto;border-radius:12px}
    #frame{inset:14% 22%;border-width:3px}
    #camHint{font-size:12px;padding:4px 10px;bottom:6px}
    #toast{font-size:15px;padding:8px;top:6px}
    .secTitle h2{font-size:16px}
    .secTitle span{font-size:13px}
    #students{gap:6px}
    .chip{font-size:14px;padding:6px 8px 6px 12px}
    .chip .x{width:20px;height:20px;font-size:12px}
    #empty{font-size:13px}
    #right{padding:10px 12px}
    #right > h2{font-size:18px}
    #right > p{font-size:13px;margin-bottom:8px}
    #grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
    .card{min-height:0;padding:10px 12px;gap:4px;border-radius:12px;box-shadow:0 4px 0 var(--blue-d)}
    .card svg{width:36px;height:36px}
    .card b{font-size:16px}
    .card span{font-size:11px}
    .card .tag{position:static;order:-1;font-size:10px;padding:2px 7px}
    #sheet{max-height:92dvh;padding:14px}
    #sheet h3{font-size:20px}
    #sheet p{font-size:14px;margin-bottom:10px}
  }
  /* 휴대폰 공통: 이름 고르기 창 버튼 작게 */
  @media (max-width:560px), (max-height:520px){
    #names{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
    #names button{font-size:19px;padding:14px 8px}
    #closePicker{font-size:16px;padding:10px;margin-top:12px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>청평 스마트스포츠</h1>
    <nav id="views" aria-label="함께 보기">
      <a class="vlink" href="board/">현황판</a>
      <a class="vlink" href="rank/?ex=auto">종목 순위</a>
      <a class="vlink" href="ride/">인도어사이클</a>
    </nav>
    <span id="room" class="room"></span>
    <div id="clock"></div>
    <button class="hbtn" id="flip">카메라 전환</button>
  </header>

  <div id="main">
    <section id="left">
      <div id="cam">
        <video id="video" playsinline muted></video>
        <canvas id="view"></canvas>
        <div id="frame"></div>
        <div id="toast"></div>
        <div id="camHint">QR 이름표를 노란 칸에 비춰 로그인</div>
      </div>
      <div class="secTitle">
        <h2>로그인한 학생</h2><span id="cnt">0명</span>
        <button class="hbtn" id="logoutAll">모두 로그아웃</button>
      </div>
      <div id="students"></div>
    </section>

    <section id="right">
      <h2>오늘은 어떤 운동을 할까요?</h2>
      <p>운동을 고른 다음, 자기 이름을 누르면 바로 시작돼요.</p>
      <div id="grid"></div>
    </section>
  </div>
</div>

<div id="picker" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
  <div id="sheet">
    <h3 id="pickTitle"></h3>
    <p>내 이름을 눌러 주세요.</p>
    <div id="names"></div>
    <button id="closePicker">닫기</button>
  </div>
</div>

<script>
/* ===== 설정 ===== */
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzZIU-UeiWcXuN47lW4XSSwvD9EgP06NdJYrX5NKDf96oqEnfsqaI0B2B3YrvZ6Yw0eVw/exec',
  TOKEN: '26cp4s_squat',
  DOMAIN: '@cpe.es.kr',
  LOGIN_HOURS: 3,           // 로그인 유지 시간(시간). 지나면 자동 로그아웃
  REFRESH_SEC: 10,          // 공용 모드에서 목록을 다시 불러오는 간격(초)
  STORE_KEY: 'hubStudents', // 이 기기 모드의 로그인 목록 저장 이름
  ROOM_KEY: 'hubRoom'       // 공용 모드 방 이름 저장 이름
};

/* 운동 메뉴: 새 운동은 여기에 한 줄 추가 */
const ICON = {
  team: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="22" r="8" fill="currentColor"/><circle cx="48" cy="22" r="8" fill="currentColor"/><path d="M10 54c2-12 26-12 28 0M34 54c2-12 26-12 28 0"/><path d="M8 64h56" stroke="#f5c518"/></svg>',
  stamp: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="34" r="22" stroke="#f5c518"/><path d="M25 34l8 8 15-16"/><path d="M14 64h44"/></svg>',
  squat: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="12" r="6" fill="currentColor"/><path d="M30 20l-4 18 16 4 -4 18M26 38l-12 2M30 26l20-2"/><path d="M8 66h56" stroke="#f5c518"/></svg>',
  curlup: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="28" r="6" fill="currentColor"/><path d="M22 36l14 18 14-16 10 16M24 38l14-4"/><path d="M6 62h60" stroke="#f5c518"/></svg>',
  jumpingjack: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="14" r="6" fill="currentColor"/><path d="M36 22v20M36 28l-16-14M36 28l16-14M36 42l-12 18M36 42l12 18"/><path d="M12 66h48" stroke="#f5c518"/></svg>',
  lunge: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="34" cy="12" r="6" fill="currentColor"/><path d="M34 20v18M34 38h12v16M34 38l-8 12-10 4M34 24l-9 9M34 24l9 8"/><path d="M8 60h56" stroke="#f5c518"/></svg>',
  treadmill: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="38" cy="10" r="6" fill="currentColor"/><path d="M36 18l-6 18 10 8-4 12M30 36l-12 6M34 22l14 8"/><path d="M8 62h44l12-14" stroke="#f5c518"/></svg>',
  rowing: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="20" r="6" fill="currentColor"/><path d="M24 50l-4-20M21 34l10 4 12-2M24 50l14-10 8 14"/><path d="M43 36l12 9" stroke-width="3"/><circle cx="58" cy="48" r="6"/><path d="M6 62h60" stroke="#f5c518"/></svg>',
  pushup: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="58" cy="30" r="6" fill="currentColor"/><path d="M52 36L12 54M48 38v20"/><path d="M6 62h60" stroke="#f5c518"/></svg>',
  plank: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="58" cy="40" r="6" fill="currentColor"/><path d="M52 46L10 56M50 48v8h8"/><circle cx="30" cy="20" r="9" stroke-width="4"/><path d="M30 14v6l4 3" stroke-width="4"/><path d="M6 62h60" stroke="#f5c518"/></svg>',
  jumprope: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="12" r="6" fill="currentColor"/><path d="M36 20v22M36 26l-12 10M36 26l12 10M36 42l-6 14M36 42l6 14"/><path d="M24 36C14 52 20 66 36 66s22-14 12-30" stroke="#f5c518" stroke-width="3"/></svg>',
  highknee: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="34" cy="10" r="6" fill="currentColor"/><path d="M34 18v22M34 40l-2 22M34 40h14v14M34 25l-10 9M34 25l11-6"/><path d="M10 64h52" stroke="#f5c518"/></svg>',
  hanging: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h56" stroke="#f5c518"/><path d="M26 8l6 16M46 8l-6 16"/><circle cx="36" cy="30" r="6" fill="currentColor"/><path d="M36 38v16M36 54l-6 12M36 54l6 12"/></svg>'
};
const EXERCISES = [
  { id: 'stamp',       name: '내 도장',        desc: '오늘 남은 종목 · 이번 달 도장', url: 'stamp/',  ready: true,  tag: '내 기록' },
  { id: 'team',        name: '우리 모둠',      desc: '반 모둠 도장 · 모둠원 도장', url: 'team/',   ready: true,  tag: '모둠 기록' },
  { id: 'squat',       name: '스쿼트',         desc: '자세 인식 · 횟수 측정', url: 'squat/',       ready: true,  tag: '카메라 · 옆에서' },
  { id: 'curlup',      name: '윗몸말아올리기', desc: '자세 인식 · 횟수 측정', url: 'curlup/',      ready: true,  tag: '카메라 · 옆에서' },
  { id: 'jumpingjack', name: '점핑잭',         desc: '자세 인식 · 횟수 측정', url: 'jumpingjack/', ready: true,  tag: '카메라 · 앞에서' },
  { id: 'highknee',    name: '하이니',         desc: '무릎 높이 들기 · 횟수 측정', url: 'highknee/', ready: true,  tag: '카메라 · 앞에서' },
  { id: 'jumprope',    name: '줄넘기',         desc: '뛴 횟수 · 1분 빠르기',   url: 'jumprope/',    ready: true,  tag: '카메라 · 앞에서' },
  { id: 'lunge',       name: '런지',           desc: '자세 인식 · 횟수 측정', url: 'lunge/',       ready: true,  tag: '카메라 · 옆에서' },
  { id: 'pushup',      name: '팔굽혀펴기',     desc: '무릎 대고 · 횟수 측정', url: 'pushup/', ready: true, tag: '카메라 · 옆에서' },
  { id: 'plank',       name: '플랭크',         desc: '바른 자세로 버틴 시간',   url: 'plank/',  ready: true, tag: '카메라 · 옆에서' },
  { id: 'treadmill',   name: '트레드밀',       desc: '운동 시간 · 거리 기록', url: 'treadmill/', ready: true, tag: '타이머' },
  { id: 'hanging',     name: '행잉',           desc: '버틴 시간 기록',        url: 'hang/',      ready: true, tag: '타이머' },
  { id: 'rowing',      name: '로잉머신',       desc: '시간 · 거리 · SPM 기록', url: 'rowing/',    ready: true, tag: '입력' }
];

const $ = id => document.getElementById(id);

/* ===== 모드 정하기 =====
 * 공용 모드: 스포츠실 태블릿들이 같은 로그인 목록(GAS 시트)을 함께 봄
 *   → 각 태블릿에서 한 번만  .../sports/?room=gym  으로 열면 기억됨
 * 이 기기 모드: 방 이름이 없으면 이 기기에만 저장(집에서 쓸 때)
 *   → 해제하려면  .../sports/?room=  으로 열기 */
(function initRoom() {
  const p = new URLSearchParams(location.search);
  if (!p.has('room')) return;
  const r = (p.get('room') || '').trim();
  try {
    if (/^[\w-]{1,20}$/.test(r)) localStorage.setItem(CONFIG.ROOM_KEY, r);
    else localStorage.removeItem(CONFIG.ROOM_KEY);
  } catch (e) {}
  history.replaceState(null, '', location.pathname);
})();
const ROOM = (() => { try { return localStorage.getItem(CONFIG.ROOM_KEY) || ''; } catch (e) { return ''; } })();
const SHARED = !!ROOM;
function applyModeText() {
  if (!SHARED) return;
  document.querySelector('.secTitle h2').textContent = '입실한 학생';
  $('camHint').textContent = 'QR 이름표를 노란 칸에 비추면 입실';
  $('logoutAll').textContent = '모두 퇴실';
}
function setOnline(ok) {
  const el = $('room');
  el.textContent = SHARED ? (ok ? '공용 · ' + ROOM : '연결 끊김 · ' + ROOM) : '이 기기';
  el.classList.toggle('off', SHARED && !ok);
}
setOnline(true);

/* ===== GAS 통신 (JSONP: CORS 제한 없이 응답 받기) ===== */
function jsonp(params, timeout = 12000) {
  return new Promise((resolve, reject) => {
    const cb = 'hubcb_' + Date.now() + '_' + Math.floor(Math.random() * 1e4);
    const s = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('시간 초과')); }, timeout);
    function done() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error('연결 실패')); };
    s.crossOrigin = 'anonymous';   // 로그인 정보 없이 요청 (여러 계정 로그인 문제 방지)
    s.src = CONFIG.GAS_URL + '?' + new URLSearchParams({ ...params, token: CONFIG.TOKEN, callback: cb });
    document.head.appendChild(s);
  });
}
const shared = (action, extra = {}) => jsonp({ action, room: ROOM, hours: CONFIG.LOGIN_HOURS, ...extra });

/* ===== 로그인 목록 ===== */
function loadLocal() {
  try {
    const list = JSON.parse(localStorage.getItem(CONFIG.STORE_KEY) || '[]');
    const limit = Date.now() - CONFIG.LOGIN_HOURS * 3600e3;
    return list.filter(s => s.at > limit);
  } catch (e) { return []; }
}
function saveLocal(list) { try { localStorage.setItem(CONFIG.STORE_KEY, JSON.stringify(list)); } catch (e) {} }

let students = SHARED ? [] : loadLocal();

async function refresh() {
  if (!SHARED) { students = loadLocal(); renderStudents(); return; }
  try {
    const r = await shared('list');
    if (r.ok) { students = r.list; renderStudents(); setOnline(true); }
    else { setOnline(false); toast(r.error || '목록을 불러오지 못했어요', true); }
  } catch (e) { setOnline(false); }
}

function renderStudents() {
  const box = $('students');
  $('cnt').textContent = students.length + '명';
  $('logoutAll').hidden = students.length === 0;
  if (!students.length) {
    box.innerHTML = '<div id="empty">아직 ' + (SHARED ? '입실' : '로그인') + '한 학생이 없어요.<br>QR 이름표를 카메라에 비춰 주세요.</div>';
    return;
  }
  box.innerHTML = '';
  students.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.title = SHARED ? '눌러서 퇴실' : '눌러서 로그아웃';
    b.innerHTML = `${esc(s.name)} <small>${esc(s.no ? s.no + '번' : s.email.split('@')[0])}</small><span class="x">✕</span>`;
    b.onclick = () => logoutOne(s);
    box.appendChild(b);
  });
}
function esc(t) { return String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function logoutOne(s) {
  if (!confirm(s.name + (SHARED ? ' 학생을 퇴실(로그아웃)할까요?' : ' 학생을 로그아웃할까요?'))) return;
  if (SHARED) {
    try { const r = await shared('logout', { email: s.email }); if (r.ok) { students = r.list; renderStudents(); toast(s.name + ' 퇴실'); } else toast(r.error, true); }
    catch (e) { toast('연결이 안 돼요. 잠시 후 다시 해 주세요', true); }
    return;
  }
  students = students.filter(t => t.email !== s.email); saveLocal(students); renderStudents();
}
$('logoutAll').onclick = async () => {
  if (!confirm(SHARED ? '모든 학생을 퇴실(로그아웃) 처리할까요?' : '로그인한 학생을 모두 로그아웃할까요?')) return;
  if (SHARED) {
    try { const r = await shared('logoutAll'); if (r.ok) { students = r.list; renderStudents(); } else toast(r.error, true); }
    catch (e) { toast('연결이 안 돼요. 잠시 후 다시 해 주세요', true); }
    return;
  }
  students = []; saveLocal(students); renderStudents();
};

/* ===== QR 로그인 ===== */
let busy = false;
async function login(raw) {
  if (busy) return;
  const id = raw.trim();
  if (!/^[\w.\-]+(@[\w.\-]+)?$/.test(id)) { toast('이름표 QR이 아니에요', true); return; }
  const email = (id.includes('@') ? id : id + CONFIG.DOMAIN).toLowerCase();
  busy = true; toast('확인 중…');

  if (SHARED) {
    try {
      const r = await shared('login', { email });
      if (!r.ok) toast(r.error || '로그인하지 못했어요', true);
      else {
        students = r.list; renderStudents(); setOnline(true); beep(1200, 90);
        toast(r.already ? r.name + ' 학생은 이미 입실했어요' : r.name + ' 입실!');
      }
    } catch (e) { setOnline(false); toast('연결이 안 돼요. 다시 찍어 주세요', true); }
    setTimeout(() => busy = false, 1200);   // 같은 QR 연속 인식 방지
    return;
  }

  // 이 기기 모드
  const already = students.find(s => s.email === email);
  if (already) {
    already.at = Date.now(); saveLocal(students);
    toast(already.name + ' 학생은 이미 로그인했어요'); setTimeout(() => busy = false, 1200); return;
  }
  let info = { name: email.split('@')[0], no: '' };
  try {
    const r = await jsonp({ action: 'student', email });
    if (r.ok) info = { name: r.name, no: r.no };
    else { toast(r.error || '명단에서 찾지 못했어요', true); setTimeout(() => busy = false, 1200); return; }
  } catch (e) { /* 인터넷이 안 되면 아이디로라도 로그인 (기록 저장 때 다시 확인됨) */ }
  students.push({ email, name: info.name, no: info.no, at: Date.now() });
  students.sort((a, b) => (+a.no || 99) - (+b.no || 99));
  saveLocal(students); renderStudents();
  beep(1200, 90); toast(info.name + ' 로그인!');
  setTimeout(() => busy = false, 1200);
}

let toastTimer;
function toast(text, warn) {
  const t = $('toast'); t.textContent = text; t.className = 'on' + (warn ? ' warn' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 1800);
}
let audio;
function beep(f, ms) {
  try {
    audio ??= new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    g.gain.value = .25; o.start(); o.stop(audio.currentTime + ms / 1000);
  } catch (e) {}
}

/* ===== 카메라 ===== */
const video = $('video'), canvas = $('view'), ctx = canvas.getContext('2d');
const qc = document.createElement('canvas'), qctx = qc.getContext('2d', { willReadFrequently: true });
let stream, facing = localStorage.getItem('hubFacing') || 'user', lastScan = 0, paused = false;

let camStarting = false, camFails = 0;
async function startCamera() {
  if (camStarting) return;
  camStarting = true;
  stream?.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    video.srcObject = stream; await video.play();
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    camFails = 0; lastFrameTime = -1; frozenFor = 0;
  } catch (e) {
    camFails++;
    $('camHint').textContent = '카메라를 켤 수 없어요 · 권한을 확인해 주세요';
  } finally {
    camStarting = false;
  }
}
function stopCamera() { stream?.getTracks().forEach(t => t.stop()); stream = null; }

/* 카메라 멈춤 감시: 3초마다 확인해서 멈췄으면 다시 켭니다.
 * - 스트림이 끊김(ended) / 영상 시간이 15초 넘게 그대로 → 카메라 다시 켜기
 * - 다시 켜기가 3번 연속 실패 → 화면 새로고침 */
let lastFrameTime = -1, frozenFor = 0;
setInterval(() => {
  if (document.hidden || camStarting) return;
  const track = stream?.getVideoTracks()[0];
  const ended = !track || track.readyState === 'ended';
  if (!ended && video.currentTime !== lastFrameTime) { lastFrameTime = video.currentTime; frozenFor = 0; return; }
  frozenFor += 3;
  if (ended || frozenFor >= 15) {
    if (camFails >= 3) { location.reload(); return; }
    console.log('카메라 멈춤 감지 → 다시 켜기', { ended, frozenFor });
    frozenFor = 0;
    startCamera();
  }
}, 3000);

/* 화면 꺼짐 방지(Wake Lock): 화면이 다시 보일 때마다 새로 요청합니다. */
let wakeLock = null;
async function keepAwake() {
  if (document.hidden || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock?.request('screen');
    wakeLock?.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  keepAwake();
  const track = stream?.getVideoTracks()[0];
  if (!track || track.readyState === 'ended') startCamera();   // 돌아왔는데 카메라가 꺼져 있으면 다시 켜기
});
addEventListener('pointerdown', keepAwake);   // 처음 요청이 거절된 기기 대비: 화면을 한 번 만지면 다시 요청
// 운동 앱으로 넘어갈 때 카메라를 놓아 주고, 뒤로 가기로 돌아오면 다시 켭니다.
addEventListener('pagehide', stopCamera);
addEventListener('pageshow', e => { if (e.persisted) startCamera(); keepAwake(); });
function loop(now) {
  requestAnimationFrame(loop);
  if (!video.videoWidth || paused) return;
  ctx.save();
  if (facing === 'user') { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();
  if (now - lastScan < 250 || busy) return;
  lastScan = now;
  const w = 640, h = Math.round(640 * video.videoHeight / video.videoWidth);
  qc.width = w; qc.height = h; qctx.drawImage(video, 0, 0, w, h);
  const code = jsQR(qctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
  if (code?.data) login(code.data);
}
$('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; localStorage.setItem('hubFacing', facing); startCamera(); };

/* ===== 운동 메뉴 ===== */
function renderMenu() {
  const grid = $('grid');
  EXERCISES.forEach(ex => {
    const b = document.createElement('button');
    b.className = 'card' + (ex.ready ? '' : ' soon');
    b.innerHTML = `<span class="tag">${ex.tag}</span>${ICON[ex.id] || ''}<b>${ex.name}</b><span>${ex.desc}</span>`;
    b.onclick = () => ex.ready ? openPicker(ex) : toast(ex.name + '은 준비 중이에요');
    grid.appendChild(b);
  });
}
async function openPicker(ex) {
  await refresh();   // 다른 태블릿에서 로그인한 학생까지 최신으로
  if (!students.length) { toast('먼저 QR 이름표로 로그인해 주세요', true); return; }
  $('pickTitle').textContent = ex.name;
  const box = $('names'); box.innerHTML = '';
  students.forEach(s => {
    const b = document.createElement('button');
    b.innerHTML = `${esc(s.name)}<small>${esc(s.no ? s.no + '번' : s.email.split('@')[0])}</small>`;
    b.onclick = () => go(ex, s);
    box.appendChild(b);
  });
  paused = true;
  $('picker').classList.add('on');
  box.querySelector('button')?.focus();
}
function closePicker() { $('picker').classList.remove('on'); paused = false; }
$('closePicker').onclick = closePicker;
$('picker').onclick = e => { if (e.target.id === 'picker') closePicker(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });

function go(ex, s) {
  const sep = ex.url.includes('?') ? '&' : '?';
  location.href = ex.url + sep + new URLSearchParams({ email: s.email, name: s.name, from: 'hub' });
}

/* ===== 시계 ===== */
function tick() {
  const d = new Date();
  $('clock').textContent = d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }) + ' ' +
    d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

/* ===== 시작 ===== */
applyModeText(); renderStudents(); renderMenu(); tick(); setInterval(tick, 10000);
refresh();
startCamera(); requestAnimationFrame(loop); keepAwake();
// 하루 종일 켜 두는 태블릿: 4시간마다 새로고침해 메모리·발열 누적을 줄임(이름 고르는 중이면 미룸)
const bootAt = Date.now();
setInterval(() => {
  if (Date.now() - bootAt > 4 * 3600 * 1000 && !busy && !$('picker').classList.contains('on')) location.reload();
}, 60 * 1000);
// 공용 모드: 다른 태블릿의 로그인·로그아웃을 주기적으로 반영
setInterval(() => {
  if (SHARED && !document.hidden && !$('picker').classList.contains('on')) refresh();
}, CONFIG.REFRESH_SEC * 1000);
addEventListener('storage', e => { if (!SHARED && e.key === CONFIG.STORE_KEY) refresh(); });
addEventListener('pageshow', () => { closePicker(); refresh(); });
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
</script>
<script src="nav.js" defer></script>
