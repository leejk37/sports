<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레그레이즈 측정</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e8c">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="레그레이즈">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --blue:#1f4e8c; --blue-d:#173d6e; --yellow:#f5c518; --ink:#ffffff;
    --soft:rgba(255,255,255,.82); --good:#7ee8b5; --warn:#ffb199; --stage:#000;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Pretendard,system-ui,sans-serif;background:var(--blue);color:var(--ink)}
  #app{display:flex;flex-direction:column;height:100%}

  /* 상단 바 */
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--blue);border-bottom:4px solid var(--yellow)}
  header h1{margin:0;font-size:24px;font-weight:800;flex:1;letter-spacing:-.5px}
  .hbtn{font:inherit;font-size:15px;font-weight:700;padding:8px 12px;border-radius:8px;
    border:1.5px solid rgba(255,255,255,.75);background:transparent;color:#fff;cursor:pointer}

  #main{flex:1;display:flex;min-height:0}

  /* 카메라 영역 */
  #stage{flex:1;position:relative;background:var(--stage);overflow:hidden;border-right:4px solid var(--yellow)}
  #view{width:100%;height:100%;object-fit:contain;display:block}
  #video{display:none}
  #hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(20,30,50,.85);
    padding:10px 20px;border-radius:999px;font-size:18px;font-weight:700;white-space:nowrap}
  #hint:empty{display:none}
  #big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:min(34vh,240px);font-weight:900;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6);pointer-events:none}
  #flash{position:absolute;left:50%;top:24px;transform:translateX(-50%);padding:10px 22px;border-radius:12px;
    background:#d9480f;color:#fff;font-size:24px;font-weight:800;opacity:0;transition:opacity .2s}
  #flash.on{opacity:1}

  /* 오른쪽 세로 게이지: 다리를 얼마나 들었는지 */
  #gauge{position:absolute;right:14px;top:6%;bottom:6%;width:22px;border:3px solid #fff;border-radius:14px;
    background:rgba(255,255,255,.08);overflow:hidden}
  #gaugeFill{position:absolute;left:0;right:0;bottom:0;height:0;background:#4dabf7;transition:height .08s}
  #gaugeFill.reached{background:#40c057}
  #gaugeTarget{position:absolute;left:0;right:0;height:3px;background:#40c057}

  /* 오른쪽 패널 */
  #side{width:min(36vw,420px);background:var(--blue);display:flex;flex-direction:column;padding:26px 22px;gap:14px;overflow:auto}
  #who{font-size:16px;color:var(--soft);min-height:22px}
  .screen{display:none;flex-direction:column;gap:14px}
  .screen.on{display:flex}
  .screen h2{margin:0;font-size:28px;font-weight:800;line-height:1.3;letter-spacing:-.5px}
  .screen p{margin:0;font-size:17px;font-weight:600;color:var(--soft);line-height:1.55}
  button.btn{font:inherit;font-size:21px;font-weight:800;padding:16px;border-radius:12px;cursor:pointer;
    border:2px solid #fff;background:#fff;color:var(--blue)}
  button.btn.line{background:transparent;color:#fff}
  button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  #readyState{font-size:20px;font-weight:800;color:var(--yellow)}
  .count{font-size:110px;font-weight:900;line-height:1;color:#fff}
  .count small{font-size:28px;font-weight:700;margin-left:6px;color:var(--soft)}
  .rows{border-top:1px solid rgba(255,255,255,.25)}
  .row{display:flex;justify-content:space-between;font-size:19px;font-weight:700;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.25)}
  .row b{color:var(--warn)}
  #timer{height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
  #timerBar{height:100%;width:100%;background:var(--yellow)}
  .pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .screen p.pickLabel{font-size:16px;margin:4px 0 -6px}
  #saveState{font-size:17px;font-weight:700;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.12)}
  #saveState:empty{display:none}
  #saveState.ok{color:var(--good)}
  #saveState.fail{color:var(--warn)}
  @media (max-width:820px){#main{flex-direction:column}#stage{border-right:0;border-bottom:4px solid var(--yellow)}#side{width:auto}}
</style>
<script src="../config.js"></script>
</head>
<body>
<div id="app">
  <header>
    <h1>레그레이즈 측정</h1>
    <button class="hbtn" id="flip">카메라 전환</button>
    <button class="hbtn" id="cancel">처음으로</button>
  </header>

  <div id="main">
    <div id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="view"></canvas>
      <div id="gauge"><div id="gaugeFill"></div><div id="gaugeTarget"></div></div>
      <div id="big"></div>
      <div id="flash"></div>
      <div id="hint"></div>
    </div>

    <aside id="side">
      <div id="who"></div>

      <section class="screen" id="s-loading">
        <h2>준비하고 있어요</h2>
        <p>카메라와 동작 인식 모델을 불러오는 중이에요.</p>
      </section>

      <section class="screen" id="s-scan">
        <h2>QR 이름표를<br>카메라에 보여 주세요</h2>
        <p>이름표가 확인되면 측정 방법 선택 화면으로 넘어가요.</p>
      </section>

      <section class="screen" id="s-time">
        <h2>어떻게 할까요?</h2>
        <p class="pickLabel">시간 동안 몇 번?</p>
        <div class="pick">
          <button class="btn" data-sec="30">30초</button>
          <button class="btn" data-sec="60">1분</button>
        </div>
        <p class="pickLabel">몇 번을 얼마나 빨리?</p>
        <div class="pick">
          <button class="btn" data-reps="10">10회</button>
          <button class="btn" data-reps="20">20회</button>
        </div>
        <button class="btn line" id="rescan">다른 학생 스캔</button>
      </section>

      <section class="screen" id="s-ready">
        <h2>카메라 옆쪽으로<br>누워 주세요</h2>
        <p id="readyText"></p>
        <div id="readyState"></div>
        <button class="btn line" id="forceStart">바로 시작</button>
      </section>

      <section class="screen" id="s-countdown">
        <h2>곧 시작해요</h2>
        <p>다리를 바닥 가까이 내린 채 기다려 주세요.</p>
      </section>

      <section class="screen" id="s-measure">
        <div id="timer"><div id="timerBar"></div></div>
        <div class="count"><span id="goodNum">0</span><small id="goalLabel">회</small></div>
        <div class="rows">
          <div class="row"><span>덜 올림</span><b id="dNum">0</b></div>
          <div class="row"><span>무릎 굽힘</span><b id="bNum">0</b></div>
        </div>
      </section>

      <section class="screen" id="s-result">
        <h2>측정 끝!</h2>
        <div class="count"><span id="resGood">0</span><small>회</small></div>
        <div class="rows">
          <div class="row"><span>덜 올림</span><b id="resD">0</b></div>
          <div class="row"><span>무릎 굽힘</span><b id="resB">0</b></div>
          <div class="row" id="resTimeRow" style="display:none"><span>걸린 시간</span><span id="resTime"></span></div>
          <div class="row"><span>정확도</span><span id="resAcc">0%</span></div>
        </div>
        <div id="saveState"></div>
        <button class="btn line" id="retrySave" hidden>다시 저장</button>
        <button class="btn" id="again">한 번 더 측정</button>
        <button class="btn line" id="next">다음 학생</button>
      </section>
    </aside>
  </div>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ===== 설정: 다른 운동 앱과 같은 GAS_URL, TOKEN (config.js) ===== */
const CONFIG = {
  GAS_URL: SITE.GAS_URL,
  TOKEN:   SITE.TOKEN,
  TYPE:    'legraise',
  DOMAIN:  SITE.DOMAIN,

  // ---- 판정 기준 (처음 측정할 때 화면 왼쪽 위 숫자를 보며 조정) ----
  // 다리 각도 = 어깨–엉덩이–발목 (누워서 다리를 펴면 약 175°, 다리를 세우면 약 90°)
  // 무릎 각도 = 엉덩이–무릎–발목
  LOW: 150,          // 다리가 이 이상(바닥 가까이)으로 내려오면 → 1회 완성
  START: 140,        // 이 아래로 들리면 → 한 번 시작
  TOP: 100,          // 이 아래까지 들어야 → 충분히 올림 (직각 90°에 여유 10°). 아니면 '덜 올림'
  KNEE_MIN: 140,     // 무릎 각도가 이보다 작으면 → 무릎 굽힘
  BENT_RATIO: 0.35,  // 한 번 하는 동안 무릎이 굽은 시간이 이 비율을 넘어야 '무릎 굽힘' (순간 흔들림 무시)
  LYING_MAX: 35,     // 어깨–엉덩이 선이 바닥과 이루는 각이 이보다 작아야 '누운 자세' (서서 하는 동작은 세지 않음)
  MIN_REP_MS: 600,   // 이보다 짧은 움직임은 흔들림으로 무시
  VIS_MIN: 0.35,     // 관절 인식 신뢰도 (누운 몸은 신뢰도가 낮게 나옴)
  SMOOTH: 0.5,
  MODEL: 'full',     // 인식 모델: 'full'(정확, 기본) / 'lite'(가벼움). 느린 태블릿은 주소 끝에 ?model=lite
  SIDE_SWITCH: 1.0,  // 반대쪽이 이만큼(신뢰도 합) 더 잘 보여야 보는 쪽을 바꿈 (좌우 튐 방지)
  HOLD_MS: 400,      // 관절이 안 보이는 프레임은 이 시간까지 직전 값을 유지
  STABLE_MS: 1000,   // 다리를 내리고 누운 자세로 이만큼 가만히 있으면 준비 완료
  SAVE_TIMEOUT_MS: 30000,
  MAX_SEC: 180       // 횟수 모드에서 이 시간이 지나면 자동 종료
};

/* ===== 화면 요소 ===== */
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('view'), ctx = canvas.getContext('2d');
const qrCanvas = document.createElement('canvas'), qrCtx = qrCanvas.getContext('2d', { willReadFrequently: true });

/* ===== 상태 ===== */
let side = null, lastOkAt = 0, lying = false;   // 보는 쪽 고정, 마지막으로 관절이 잘 보인 시각, 누운 자세인지
let mode = 'loading';
let pose, stream, facing = localStorage.getItem('legraiseFacing') || 'user';
let email = '', duration = 30, endAt = 0, target = 0, runStart = 0, runEnd = 0;
let counts = { good: 0, badDepth: 0, badBody: 0 };
let phase = 'low', rep = null, sLeg = null, sKnee = null, readySince = null;
let lastQr = 0, lastVideoTime = -1, clientId = '';
let audio;

function show(m) {
  mode = m;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + m));
  $('big').textContent = '';
  setHint();
}
const HINTS = {
  scan: 'QR 이름표를 화면 가운데에 비춰 주세요',
  ready: '몸 옆면이 보이게 누워 다리를 펴고 가만히 있어요',
  countdown: '움직이지 말고 기다려요',
  measure: '',
};
function setHint(text) { $('hint').textContent = text || HINTS[mode] || ''; }

/* 게이지: 다리를 얼마나 들었는지 (목표선 = TOP) */
const GAUGE_MAX = 1.25;
$('gaugeTarget').style.bottom = (100 / GAUGE_MAX) + '%';
function setGauge() {
  const fill = $('gaugeFill');
  if (mode !== 'measure' || sLeg == null) { fill.style.height = '0'; fill.classList.remove('reached'); return; }
  const r = Math.max(0, Math.min(GAUGE_MAX, (175 - sLeg) / (175 - CONFIG.TOP)));
  fill.style.height = (r / GAUGE_MAX * 100) + '%';
  fill.classList.toggle('reached', r >= 1);
}

/* ===== 소리 ===== */
function beep(freq = 880, ms = 120) {
  try {
    audio ??= new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.25, audio.currentTime);
    o.start(); o.stop(audio.currentTime + ms / 1000);
  } catch (e) {}
}
let flashTimer;
function flash(text) {
  $('flash').textContent = text; $('flash').classList.add('on');
  clearTimeout(flashTimer); flashTimer = setTimeout(() => $('flash').classList.remove('on'), 800);
}

/* ===== 카메라 ===== */
async function startCamera() {
  stream?.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
}

/* ===== 자세 분석 ===== */
function angle(a, b, c) {
  const v1x = a.x - b.x, v1y = a.y - b.y, v2x = c.x - b.x, v2y = c.y - b.y;
  const cos = (v1x * v2x + v1y * v2y) / (Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y) || 1);
  return Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
}
const IDX = { ls: 11, rs: 12, lh: 23, rh: 24, lk: 25, rk: 26, la: 27, ra: 28 };
function analyze(lm) {
  const W = canvas.width, H = canvas.height, P = {};
  for (const k in IDX) { const q = lm[IDX[k]]; P[k] = { x: q.x * W, y: q.y * H, v: q.visibility ?? 0 }; }
  // 옆에서 찍으면 먼 쪽 다리가 가려짐 → 카메라에 가까운(더 잘 보이는) 쪽 한 줄만 씀
  const parts = s => [s + 's', s + 'h', s + 'k', s + 'a'];
  const score = s => parts(s).reduce((t, k) => t + P[k].v, 0);
  // 보는 쪽(왼/오른)을 고정: 반대쪽이 확실히 더 잘 보일 때만 바꿈 (매 프레임 바뀌면 각도가 튐)
  const other = side === 'l' ? 'r' : 'l';
  if (side == null || score(other) - score(side) > CONFIG.SIDE_SWITCH) side = score('l') >= score('r') ? 'l' : 'r';
  const s = side;
  const ok = parts(s).every(k => P[k].v > CONFIG.VIS_MIN);
  const leg = angle(P[s + 's'], P[s + 'h'], P[s + 'a']);
  const knee = angle(P[s + 'h'], P[s + 'k'], P[s + 'a']);
  // 누웠는지: 어깨–엉덩이 선이 바닥(가로)과 이루는 각
  const dx = Math.abs(P[s + 's'].x - P[s + 'h'].x), dy = Math.abs(P[s + 's'].y - P[s + 'h'].y);
  const lying = Math.atan2(dy, dx) * 180 / Math.PI < CONFIG.LYING_MAX;
  return { ok, leg, knee, lying, side: s, P };
}

/* ===== 그리기 ===== */
const mirror = () => facing === 'user';
function drawVideo() {
  ctx.save();
  if (mirror()) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();
}
function drawPose(r) {
  const X = x => mirror() ? canvas.width - x : x;
  const s = r.side, P = r.P;
  const line = (a, b, color) => {
    ctx.strokeStyle = color; ctx.beginPath();
    ctx.moveTo(X(P[a].x), P[a].y); ctx.lineTo(X(P[b].x), P[b].y); ctx.stroke();
  };
  ctx.lineWidth = 8;
  line(s + 's', s + 'h', r.ok ? '#f5c518' : '#f0a070');
  const legColor = sKnee != null && sKnee < CONFIG.KNEE_MIN ? '#ff6b6b' : '#5fd3a6';
  line(s + 'h', s + 'k', legColor); line(s + 'k', s + 'a', legColor);
  const h = P[s + 'h'];
  ctx.fillStyle = '#f5c518'; ctx.beginPath(); ctx.arc(X(h.x), h.y, 14, 0, Math.PI * 2); ctx.fill();
  // 교사용 확인 수치(기준값 조정할 때 참고)
  ctx.fillStyle = 'rgba(20,30,50,.75)'; ctx.fillRect(12, 12, 300, 84);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Pretendard, sans-serif';
  ctx.fillText('다리 ' + Math.round(sLeg) + '°', 24, 48);
  ctx.fillText('무릎 ' + Math.round(sKnee) + '°', 24, 84);
}

/* ===== 메인 루프 ===== */
function loop() {
  requestAnimationFrame(loop);
  if (!video.videoWidth) return;
  drawVideo();
  const now = performance.now();

  if (mode === 'scan' && now - lastQr > 250) { lastQr = now; scanQr(); return; }
  if (!['ready', 'countdown', 'measure'].includes(mode) || !pose) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const res = pose.detectForVideo(video, now);
  const lm = res.landmarks?.[0];
  if (!lm && now - lastOkAt < CONFIG.HOLD_MS) return;   // 잠깐 놓친 프레임은 건너뜀
  if (!lm) { setHint('머리부터 발끝까지 화면에 들어오게 해 주세요'); setGauge(); return; }
  const r = analyze(lm);
  const ease = (s, v) => s == null ? v : s + CONFIG.SMOOTH * (v - s);
  // 관절이 잘 보이는 프레임만 각도에 반영 (잘못 읽은 프레임이 횟수를 흔들지 않게)
  if (r.ok) { sLeg = ease(sLeg, r.leg); sKnee = ease(sKnee, r.knee); lastOkAt = now; lying = r.lying; }
  else if (now - lastOkAt > CONFIG.HOLD_MS && mode !== 'measure') { sLeg = null; sKnee = null; }
  if (sLeg == null) { setHint('어깨·엉덩이·무릎·발목이 잘 보이게 해 주세요'); setGauge(); return; }
  drawPose(r);
  setHint(!r.ok ? '어깨·엉덩이·무릎·발목이 잘 보이게 해 주세요' : !lying ? '바닥에 누워서 해요' : '');
  setGauge();

  if (mode === 'ready') {
    // 다리를 내리고 누운 자세로 1초 가만히 있으면 준비 완료
    if (!r.ok || !lying || sLeg < CONFIG.LOW) { readySince = null; $('readyState').textContent = '누워서 다리를 쭉 펴요…'; return; }
    readySince ??= now;
    $('readyState').textContent = now - readySince > 300 ? '✓ 그대로 가만히…' : '다리를 내린 채 가만히 있어요…';
    if (now - readySince > CONFIG.STABLE_MS) startCountdown();
  } else if (mode === 'measure') {
    measure(now);
  }
}

/* ===== QR 인식 ===== */
function scanQr() {
  const w = 640, h = Math.round(640 * video.videoHeight / video.videoWidth);
  qrCanvas.width = w; qrCanvas.height = h;
  qrCtx.drawImage(video, 0, 0, w, h);
  const code = jsQR(qrCtx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
  if (!code) return;
  const id = code.data.trim();
  if (!/^[\w.\-]+(@[\w.\-]+)?$/.test(id)) { flash('이름표 QR이 아니에요'); return; }
  email = (id.includes('@') ? id : id + CONFIG.DOMAIN).toLowerCase();
  $('who').textContent = email;
  beep(1200, 80);
  show('time');
}

/* ===== 측정 흐름 ===== */
function toReady(sec, reps = 0) {
  target = reps;                 // 0이면 시간 모드, 숫자면 횟수 모드
  duration = reps ? CONFIG.MAX_SEC : sec;
  counts = { good: 0, badDepth: 0, badBody: 0 };
  sLeg = sKnee = null; readySince = null; side = null; lastOkAt = 0;   // 학생이 바뀌면 보는 쪽도 새로 고름
  $('readyText').innerHTML = '몸 옆면이 카메라에 보이게 바닥에 누워요.<br>손은 몸 옆 바닥에 두고, 다리를 모아 쭉 펴요.<br>다리를 내리고 가만히 있으면 3-2-1이 시작돼요.';
  beep(660, 60);
  show('ready');
}
function startCountdown() {
  show('countdown');
  let n = 3;
  const tick = () => {
    if (mode !== 'countdown') return;
    if (n > 0) { $('big').textContent = n; beep(660, 150); n--; setTimeout(tick, 1000); }
    else startMeasure();
  };
  tick();
}
function startMeasure() {
  phase = 'low'; rep = null;
  endAt = performance.now() + duration * 1000;
  runStart = performance.now();
  $('goalLabel').textContent = target ? '/ ' + target + '회' : '회';
  clientId = (crypto.randomUUID?.() || String(Date.now()) + Math.random());
  updateCounts();
  show('measure');
  $('big').textContent = '시작'; setTimeout(() => mode === 'measure' && ($('big').textContent = ''), 600);
  beep(1000, 300);
}
function measure(now) {
  if (tickGoal(now)) return;
  if (sLeg == null) return;
  if (phase === 'low') {
    if (lying && sLeg < CONFIG.START) { phase = 'lift'; rep = { start: now, minLeg: sLeg, frames: 0, bent: 0 }; }
  } else {
    rep.minLeg = Math.min(rep.minLeg, sLeg);
    rep.frames++; if (sKnee < CONFIG.KNEE_MIN) rep.bent++;
    if (sLeg > CONFIG.LOW) { judge(now); phase = 'low'; rep = null; }   // 다리를 다시 내려야 1회 완성
  }
}
function judge(now) {
  if (now - rep.start < CONFIG.MIN_REP_MS) return;
  const highOk = rep.minLeg <= CONFIG.TOP;
  const kneeOk = !rep.frames || rep.bent / rep.frames <= CONFIG.BENT_RATIO;   // 굽은 '시간 비율'로 판정
  if (highOk && kneeOk) { counts.good++; beep(1320, 70); }
  else if (!highOk) { counts.badDepth++; flash('다리를 더 높이!'); beep(220, 150); }   // 둘 다 부족하면 높이 우선
  else { counts.badBody++; flash('무릎을 쭉 펴요!'); beep(220, 150); }
  updateCounts();
}
function updateCounts() {
  $('goodNum').textContent = counts.good;
  $('dNum').textContent = counts.badDepth;
  $('bNum').textContent = counts.badBody;
}
function accuracy() {
  const t = counts.good + counts.badDepth + counts.badBody;
  return t ? Math.round(counts.good / t * 100) : 0;
}
/* 시간 모드: 막대가 줄어듦 / 횟수 모드: 막대가 차오르고 목표에 닿으면 끝 */
function tickGoal(now) {
  const left = Math.max(0, endAt - now);
  if (target) {
    $('timerBar').style.width = Math.min(100, counts.good / target * 100) + '%';
    if (counts.good >= target || left <= 0) { finish(); return true; }
    return false;
  }
  $('timerBar').style.width = (left / (duration * 1000) * 100) + '%';
  if (left <= 0) { finish(); return true; }
  return false;
}
const elapsedSec = () => Math.max(1, Math.round((runEnd - runStart) / 1000));
function finish() {
  runEnd = performance.now();
  $('resTimeRow').style.display = target ? 'flex' : 'none';
  $('resTime').textContent = target ? elapsedSec() + '초' : '';
  beep(500, 500);
  show('result');
  $('resGood').textContent = counts.good;
  $('resD').textContent = counts.badDepth;
  $('resB').textContent = counts.badBody;
  $('resAcc').textContent = accuracy() + '%';
  save();
}
/* ===== 저장 ===== */
function setSave(text, cls) {
  const el = $('saveState'); el.textContent = text; el.className = cls || '';
  $('retrySave').hidden = cls !== 'fail';
}
async function save() {
  setSave('저장 중…');
  const body = {
    type: CONFIG.TYPE, token: CONFIG.TOKEN, email,
    duration: target ? elapsedSec() : duration, target,
    good: counts.good, badLow: counts.badDepth, badKnee: counts.badBody, clientId
  };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.SAVE_TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow',
      credentials: 'omit',
      signal: ctrl.signal
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error('<!DOCTYPE 응답: ' + text.slice(0, 40)); }
    if (data.ok !== true) throw Object.assign(new Error(data.error || '서버에서 저장을 거부했어요'), { server: true });
    setSave((data.name ? data.name + ' 학생 ' : '') + '저장 완료', 'ok');
  } catch (e) {
    console.error(e);
    // 전송은 됐지만 결과만 못 읽은 경우(리다이렉트 단계 실패)
    const unreadable = !e.server && (e.name === 'TypeError' || String(e.message).includes('<!DOCTYPE'));
    if (unreadable && navigator.onLine) {
      setSave('전송 완료 (결과 확인 불가 · 시트에서 확인)', 'ok');
      $('retrySave').hidden = false;   // 같은 clientId라 다시 보내도 중복 저장 안 됨
      return;
    }
    const msg = e.name === 'AbortError' ? '응답이 늦어요. 시트를 확인한 뒤 필요하면 다시 저장하세요.' : e.message;
    setSave('저장 실패: ' + msg, 'fail');
  } finally { clearTimeout(timer); }
}

/* ===== 허브 연결: 주소에 학생 정보가 있으면 QR 단계를 건너뜀 ===== */
const PARAMS = new URLSearchParams(location.search);
const FROM_HUB = PARAMS.get('from') === 'hub';
function startFromParams() {
  const em = (PARAMS.get('email') || '').trim().toLowerCase();
  if (!/^[\w.\-]+@[\w.\-]+$/.test(em)) return false;
  email = em;
  $('who').textContent = (PARAMS.get('name') || em.split('@')[0]) + ' 학생';
  show('time');
  return true;
}
function backOrScan() {
  if (FROM_HUB) { location.href = '../'; return; }   // 허브로 돌아가기
  email = ''; $('who').textContent = ''; show('scan');
}
if (FROM_HUB) {
  $('next').textContent = '허브로 돌아가기';
  $('rescan').textContent = '허브로 돌아가기';
  $('cancel').textContent = '허브로';
}

/* ===== 버튼 ===== */
document.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => toReady(+b.dataset.sec));
document.querySelectorAll('[data-reps]').forEach(b => b.onclick = () => toReady(0, +b.dataset.reps));
$('rescan').onclick = $('next').onclick = $('cancel').onclick = backOrScan;
$('forceStart').onclick = startCountdown;
$('again').onclick = () => show('time');   // 같은 학생으로 바로 다시 측정 (새 측정마다 clientId 새로 만듦)
$('retrySave').onclick = save;
$('flip').onclick = async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  localStorage.setItem('legraiseFacing', facing);
  await startCamera();
};

/* ===== 시작 ===== */
const MODEL = (() => {   // ?model=lite 를 한 번 붙여 열면 이 기기에 기억, ?model=full 로 되돌림
  let m = new URLSearchParams(location.search).get('model');
  try { if (m === 'lite' || m === 'full') localStorage.setItem('legraiseModel', m); else m = localStorage.getItem('legraiseModel'); } catch (e) {}
  return m === 'lite' ? 'lite' : CONFIG.MODEL;
})();
(async () => {
  show('loading');
  try {
    await startCamera();
    requestAnimationFrame(loop);
    const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    pose = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_' + MODEL + '/float16/1/pose_landmarker_' + MODEL + '.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO', numPoses: 1,
      // 누운 몸은 사람으로 덜 확신함 → 기본 0.5보다 낮춰 놓치지 않게
      minPoseDetectionConfidence: 0.3, minPosePresenceConfidence: 0.3, minTrackingConfidence: 0.3
    });
    try { await navigator.wakeLock?.request('screen'); } catch (e) {}
    if (!startFromParams()) show('scan');
  } catch (e) {
    $('s-loading').innerHTML = '<p class="msg">카메라 또는 모델을 불러오지 못했어요.<br>' + e.message + '</p>';
  }
})();
</script>
<script>
  // PWA: 서비스 워커 등록 (설치·빠른 실행용)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
  }
</script>
