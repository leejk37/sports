<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>종목 순위_스마트스포츠앱</title>
<meta name="theme-color" content="#1f4e8c">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 큰 TV(가로 16:9)에 맞춘 종목별 대시보드. 현황판(board/)과 같은 색·크기 단위(vw) */
  :root{
    --blue:#1f4e8c; --blue-d:#173d6e; --blue-dd:#102f57; --blue-l:#2a62ab; --yellow:#f5c518;
    --soft:rgba(255,255,255,.75); --dim:rgba(255,255,255,.35); --line:rgba(255,255,255,.14);
    --gold:#f5c518; --silver:#cfd8e3; --bronze:#e0a271;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Pretendard,system-ui,sans-serif;background:var(--blue);color:#fff;overflow:hidden}
  #app{display:grid;grid-template-rows:auto 1fr auto;height:100%}

  /* 머리글 */
  header{display:flex;align-items:center;gap:1vw;white-space:nowrap;padding:.7vw 2vw .6vw;border-bottom:.35vw solid var(--yellow)}
  #exIcon svg{width:3vw;height:3vw;display:block}
  header h1{margin:0;font-size:2.1vw;font-weight:800;letter-spacing:-.05vw}
  #exTag{font-size:1vw;font-weight:800;padding:.25vw .8vw;border-radius:999px;background:rgba(255,255,255,.14);color:var(--soft)}
  .grow{flex:1}
  #period{display:flex;gap:.3vw;background:rgba(255,255,255,.1);padding:.25vw;border-radius:999px}
  #period button{font:inherit;font-size:1vw;font-weight:800;color:var(--soft);background:transparent;border:0;border-radius:999px;padding:.3vw .9vw;cursor:pointer}
  #period button.on{background:var(--yellow);color:var(--blue-d)}
  #demo{display:none;font-size:.95vw;font-weight:800;color:var(--blue-d);background:#ffb3a1;padding:.2vw .7vw;border-radius:999px}
  body.demo #demo{display:inline-block}
  #clock{font-size:2.1vw;font-weight:800;font-variant-numeric:tabular-nums}
  #status{font-size:.9vw;color:var(--soft);text-align:right}
  #status.off{color:#ffb3a1}
  .pageSwitch{font-size:1vw;font-weight:800;color:var(--blue-d);background:var(--yellow);padding:.3vw .9vw;border-radius:999px;text-decoration:none;white-space:nowrap}
  html.inFrame .pageSwitch, html.inFrame #period{display:none}

  #main{display:grid;grid-template-columns:24vw minmax(0,1fr) 22vw;gap:1.1vw;padding:1.1vw 2vw;min-height:0}
  .card{background:var(--blue-d);border-radius:1.1vw;padding:.9vw 1.2vw;min-height:0}
  .label{font-size:1.05vw;font-weight:700;color:var(--soft)}

  /* 왼쪽: 큰 숫자 */
  #left{display:grid;grid-template-rows:auto auto 1fr;gap:1.1vw;min-height:0}
  .big b{display:block;font-size:4.4vw;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
  .big b small{font-size:1.6vw;font-weight:800;margin-left:.3vw}
  .big.sum b{color:var(--yellow)}
  .big .sub{font-size:.95vw;color:var(--soft);margin-top:.2vw}
  #goal{display:flex;flex-direction:column;gap:.5vw}
  #goal .top{display:flex;align-items:baseline;gap:.5vw;flex-wrap:wrap}
  #goal .top em{font-style:normal;font-size:2.2vw;font-weight:900;color:var(--yellow);font-variant-numeric:tabular-nums}
  #goal .top span{font-size:1.1vw;font-weight:800;color:var(--soft)}
  .bar{position:relative;height:1.5vw;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:linear-gradient(90deg,#f5c518,#ffd84d);transition:width 1.2s ease}
  #goal .sub{font-size:.9vw;color:var(--soft);line-height:1.4}
  #goal .spacer{flex:1}
  #goal .note{font-size:.9vw;color:var(--soft);line-height:1.45;border-top:1px solid var(--line);padding-top:.6vw}

  /* 가운데: 순위 */
  #rankCard{display:flex;flex-direction:column;gap:.8vw}
  #tabs{display:flex;align-items:center;gap:.5vw}
  #tabs .t{font-size:1.15vw;font-weight:800;padding:.35vw 1vw;border-radius:999px;background:rgba(255,255,255,.08);color:var(--soft);cursor:pointer;border:0;font-family:inherit}
  #tabs .t{flex:none;white-space:nowrap}
  #tabs .t.on{background:#fff;color:var(--blue-d)}
  #tabs .why{margin-left:auto;min-width:0;font-size:.9vw;line-height:1.3;color:var(--soft);text-align:right;text-wrap:balance;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}   /* 길면 두 줄로 (잘리지 않게) */
  #tabBar{height:.25vw;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
  #tabBar i{display:block;height:100%;width:0;background:var(--yellow)}
  #bands{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9vw;min-height:0}
  .band{display:flex;flex-direction:column;gap:.45vw;background:var(--blue-dd);border-radius:.9vw;padding:.8vw;min-height:0;animation:pop .5s ease both}
  .band h3{margin:0 0 .2vw;font-size:1.2vw;font-weight:800;color:var(--yellow);display:flex;align-items:baseline;gap:.5vw}
  .band h3 .cond{font-size:.85vw;font-weight:700;color:var(--soft)}
  .rk{flex:1;max-height:4.6vw;display:flex;align-items:center;gap:.5vw;padding:.45vw .6vw;border-radius:.6vw;background:rgba(255,255,255,.06)}
  .rk .no{flex:none;width:2.1vw;height:2.1vw;border-radius:50%;display:grid;place-items:center;font-size:1.05vw;font-weight:900;background:rgba(255,255,255,.12)}
  .rk.m1 .no{background:var(--gold);color:var(--blue-d)}
  .rk.m2 .no{background:var(--silver);color:var(--blue-d)}
  .rk.m3 .no{background:var(--bronze);color:var(--blue-d)}
  .v .up{color:#7be495;font-size:.8em;margin-right:.15em}
  .cr .n .acc{display:block;font-size:.7em;font-weight:700;color:#9ff0b0;line-height:1.1}
  .rk .nm{flex:1;min-width:4.4vw;display:flex;flex-direction:column;line-height:1.15;font-size:1.3vw;font-weight:800;white-space:nowrap;overflow:hidden}
  .rk .nm small{font-size:.8vw;font-weight:700;color:var(--soft)}
  .rk .v{flex:none;font-size:1.4vw;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
  .rk .v.long{font-size:1.1vw}   /* '1분 13초'·'+300%+'처럼 긴 값은 조금 작게 → 이름이 가려지지 않게 */
  .rk .v small{font-size:.85vw;font-weight:800;margin-left:.1vw;color:var(--soft)}
  .rk .v .acc{display:block;font-style:normal;font-size:.8vw;font-weight:800;color:var(--soft);line-height:1.1;margin-top:.1vw}
  .rk .v .acc.hi{color:#9ff0b0}
  .rk .v .acc.lo{color:#ffb3a1}
  .band .none{font-size:1vw;color:var(--soft);padding:.6vw .2vw;line-height:1.5}
  @keyframes pop{from{opacity:0;transform:translateY(.5vw)}to{opacity:1;transform:none}}

  /* 오른쪽: 반별 */
  #classes{display:flex;flex-direction:column;gap:.6vw}
  #classes .head{display:flex;align-items:baseline;gap:.5vw}
  #classes .head span{margin-left:auto;font-size:.85vw;color:var(--soft)}
  #cls{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:1.1vw;padding-top:.6vw;min-height:0}
  #cls.many{justify-content:space-evenly;gap:.25vw;padding-top:0}
  .cr{display:grid;grid-template-columns:2.6vw minmax(0,1fr) 6.4vw;align-items:center;gap:.5vw}
  .cr .c{font-size:.95vw;font-weight:800;color:var(--soft);font-variant-numeric:tabular-nums}
  .cr .w{height:1.1vw;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
  .cr .w i{display:block;height:100%;width:0;border-radius:999px;background:#7fb0f0;transition:width 1.2s ease}
  .cr.top .w i{background:var(--yellow)}
  .cr .n{font-size:1vw;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* 아래: 개인 최고 기록 갱신 소식이 흐름 */
  #ticker{display:flex;align-items:stretch;height:3.2vw;background:var(--blue-d);border-top:.3vw solid var(--yellow);overflow:hidden}
  #ticker .tag{flex:none;display:flex;align-items:center;padding:0 1.4vw;background:var(--yellow);color:var(--blue-d);font-size:1.25vw;font-weight:900;white-space:nowrap}
  #tickWrap{flex:1;position:relative;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
  #tickTrack{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;white-space:nowrap}
  #tickTrack.run{animation:flow var(--dur,30s) linear infinite}
  @keyframes flow{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tk{display:inline-flex;align-items:baseline;gap:.45vw;padding:0 1.6vw;font-size:1.35vw;font-weight:800}
  .tk small{font-size:.95vw;font-weight:700;color:var(--soft)}
  .tk em{font-style:normal;color:var(--yellow)}
  .tk::after{content:'·';margin-left:1.6vw;color:var(--yellow)}
  #tickTrack .msg{padding:0 1.6vw;font-size:1.2vw;font-weight:700;color:var(--soft)}
</style>
<script>try { if (window.top !== window) document.documentElement.classList.add('inFrame'); } catch (e) { document.documentElement.classList.add('inFrame'); }</script>
</head>
<body>
<div id="app">
  <header>
    <span id="exIcon"></span>
    <h1 id="exName">종목</h1>
    <span id="exTag"></span>
    <span class="grow"></span>
    <span id="demo" title="GAS에 순위 기능이 아직 없어 견본 숫자를 보여 주는 중">견본 데이터</span>
    <div id="period">
      <button data-p="today">오늘</button>
      <button data-p="week">이번 주</button>
      <button data-p="month">이번 달</button>
    </div>
    <a class="pageSwitch" href="../board/">현황판 ›</a>
    <span id="clock">--:--</span>
    <span id="status">불러오는 중…</span>
  </header>

  <div id="main">
    <section id="left">
      <div class="card big sum"><div class="label" id="sumLabel">이번 주 모두 합치면</div><b id="sum">-</b><div class="sub" id="sumSub"></div></div>
      <div class="card big"><div class="label" id="pplLabel">이번 주 참여한 친구</div><b><span id="ppl">-</span><small>명</small></b><div class="sub" id="pplSub"></div></div>
      <div class="card" id="goal">
        <div class="label" id="goalName">학교 전체 도전</div>
        <div class="top"><em id="goalNow">0</em><span id="goalMax">/ -</span></div>
        <div class="bar"><i id="goalBar"></i></div>
        <div class="sub" id="goalSub"></div>
        <div class="spacer"></div>
        <div class="note" id="note"></div>
      </div>
    </section>

    <section class="card" id="rankCard">
      <div id="tabs">
        <button class="t" data-k="best">🏆 최고 기록</button>
        <button class="t" data-k="growth">📈 성장</button>
        <button class="t" data-k="streak">🔥 꾸준함</button>
        <button class="t" data-k="acc" hidden>🎯 정확도</button>
        <span class="why" id="why"></span>
      </div>
      <div id="tabBar"><i></i></div>
      <div id="bands"></div>
    </section>

    <section class="card" id="classes">
      <div class="head"><div class="label" id="clsLabel">반별 합계</div><span id="clsSub"></span></div>
      <div id="cls"></div>
    </section>
  </div>

  <div id="ticker">
    <div class="tag">🏅 개인 최고 기록</div>
    <div id="tickWrap"><div id="tickTrack"></div></div>
  </div>
</div>

<script>
/* ===== 설정 ===== */
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzZIU-UeiWcXuN47lW4XSSwvD9EgP06NdJYrX5NKDf96oqEnfsqaI0B2B3YrvZ6Yw0eVw/exec',
  TOKEN: '26cp4s_squat',
  REFRESH_SEC: 60,       // 데이터 새로 불러오는 간격(초)
  TAB_SEC: 10,           // 최고 기록 → 성장 → 꾸준함 넘기는 간격(초)
  // 종목이 여러 개(?ex=auto 등)면 최고 기록 → 성장 → 꾸준함을 한 번씩 보여 준 뒤 다음 종목으로 넘어감 (종목당 TAB_SEC × 3초)
  TOP_N: 7,              // 학년 묶음마다 보여 줄 인원
  MASK: true,            // 이름 가운데 글자 가리기 (김응서 → 김*서)
  PERIOD: 'week',        // 처음 보여 줄 기간: today | week | month
  RELOAD_HOURS: 6,
  BANDS: [               // 학년 묶음 (체력 차이가 커서 따로 순위)
    { key: '1-2', name: '1·2학년', grades: [1, 2] },
    { key: '3-4', name: '3·4학년', grades: [3, 4] },
    { key: '5-6', name: '5·6학년', grades: [5, 6] }
  ]
};

/* ===== 종목 목록: 새 종목은 한 줄 추가 =====
 *  kind: count(회) | time(초 → 분·초로 표시) | dist(거리)
 *  goal: 학교 전체 누적 목표(기간과 상관없이 10월부터 합친 값과 비교)
 *  tag: 머리글에 보이는 측정 방식 / form: 자세 지표 이름(있으면 왼쪽 아래에 안내) */
const EX = [
  { id: 'squat',       name: '스쿼트',         kind: 'count', unit: '회', goal: 20000,  tag: '카메라 · 자세 인식' },
  { id: 'lunge',       name: '런지',           kind: 'count', unit: '회', goal: 10000,  tag: '카메라 · 자세 인식' },
  { id: 'jumpingjack', name: '점핑잭',         kind: 'count', unit: '회', goal: 20000,  tag: '카메라 · 자세 인식' },
  { id: 'curlup',      name: '윗몸말아올리기', kind: 'count', unit: '회', goal: 10000,  tag: '카메라 · 자세 인식' },
  { id: 'highknee',    name: '하이니',         kind: 'count', unit: '회', goal: 20000,  tag: '카메라 · 자세 인식' },
  { id: 'pushup',      name: '팔굽혀펴기',     kind: 'count', unit: '회', goal: 5000,   tag: '카메라 · 자세 인식' },
  { id: 'plank',       name: '플랭크',         kind: 'time',  unit: '초', goal: 36000,  tag: '카메라 · 바른 자세로 버틴 시간' },
  { id: 'hanging',     name: '행잉',           kind: 'time',  unit: '초', goal: 18000,  tag: '타이머 · 버틴 시간' },
  { id: 'rope',        name: '줄넘기',         kind: 'count', unit: '회', goal: 100000, tag: '카메라 · 줄 돌림 확인' },
  { id: 'treadmill',   name: '트레드밀',       kind: 'dist',  unit: 'km', goal: 300,    tag: '타이머 · 거리 기록' },
  { id: 'rowing',      name: '로잉머신',       kind: 'dist',  unit: 'km', goal: 200,    tag: '입력 · 거리 기록' },
  { id: 'bike',        name: '실내자전거',     kind: 'dist',  unit: 'km', goal: 100,    tag: '라이딩 기록' }
];

/* 종목 아이콘 (현황판과 같은 그림) */
const S = '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">';
const ICON = {
  squat: S + '<circle cx="30" cy="12" r="6" fill="currentColor"/><path d="M30 20l-4 18 16 4 -4 18M26 38l-12 2M30 26l20-2"/><path d="M8 66h56" stroke="#f5c518"/></svg>',
  curlup: S + '<circle cx="16" cy="28" r="6" fill="currentColor"/><path d="M22 36l14 18 14-16 10 16M24 38l14-4"/><path d="M6 62h60" stroke="#f5c518"/></svg>',
  jumpingjack: S + '<circle cx="36" cy="14" r="6" fill="currentColor"/><path d="M36 22v20M36 28l-16-14M36 28l16-14M36 42l-12 18M36 42l12 18"/><path d="M12 66h48" stroke="#f5c518"/></svg>',
  lunge: S + '<circle cx="34" cy="12" r="6" fill="currentColor"/><path d="M34 20v18M34 38h12v16M34 38l-8 12-10 4M34 24l-9 9M34 24l9 8"/><path d="M8 60h56" stroke="#f5c518"/></svg>',
  treadmill: S + '<circle cx="38" cy="10" r="6" fill="currentColor"/><path d="M36 18l-6 18 10 8-4 12M30 36l-12 6M34 22l14 8"/><path d="M8 62h44l12-14" stroke="#f5c518"/></svg>',
  rowing: S + '<circle cx="18" cy="20" r="6" fill="currentColor"/><path d="M24 50l-4-20M21 34l10 4 12-2M24 50l14-10 8 14"/><path d="M43 36l12 9" stroke-width="3"/><circle cx="58" cy="48" r="6"/><path d="M6 62h60" stroke="#f5c518"/></svg>',
  pushup: S + '<circle cx="58" cy="30" r="6" fill="currentColor"/><path d="M52 36L12 54M48 38v20"/><path d="M6 62h60" stroke="#f5c518"/></svg>',
  plank: S + '<circle cx="58" cy="40" r="6" fill="currentColor"/><path d="M52 46L10 56M50 48v8h8"/><circle cx="30" cy="20" r="9" stroke-width="4"/><path d="M30 14v6l4 3" stroke-width="4"/><path d="M6 62h60" stroke="#f5c518"/></svg>',
  highknee: S + '<circle cx="34" cy="10" r="6" fill="currentColor"/><path d="M34 18v22M34 40l-2 22M34 40h14v14M34 25l-10 9M34 25l11-6"/><path d="M10 64h52" stroke="#f5c518"/></svg>',
  hanging: S + '<path d="M8 8h56" stroke="#f5c518"/><path d="M26 8l6 16M46 8l-6 16"/><circle cx="36" cy="30" r="6" fill="currentColor"/><path d="M36 38v16M36 54l-6 12M36 54l6 12"/></svg>',
  rope: S + '<circle cx="36" cy="12" r="6" fill="currentColor"/><path d="M36 20v22M36 26l-12 10M36 26l12 10M36 42l-6 14M36 42l6 14"/><path d="M24 36C14 52 20 66 36 66s22-14 12-30" stroke="#f5c518" stroke-width="3"/></svg>',
  bike: S + '<circle cx="18" cy="50" r="10"/><circle cx="56" cy="50" r="10" stroke="#f5c518"/><path d="M18 50l12-20h18l8 20M30 30l8 20h-20M44 22h8"/></svg>'
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v, d = 0) => Number(v || 0).toLocaleString('ko-KR', { maximumFractionDigits: d });

/* ===== 주소로 정하는 것 =====
 *  (없음)      모든 종목 차례로 = ?ex=auto (기본)
 *  ?ex=squat   종목 하나 고정
 *  ?ex=auto    모든 종목을 차례로 넘김 (TV용)
 *  ?ex=squat,plank,rope  고른 종목만 차례로
 *  ?period=today|week|month   기간
 *  ?demo=1     견본 데이터로만 보기 */
const Q = new URLSearchParams(location.search);
const exParam = (Q.get('ex') || 'auto').trim();   // 기본: 모든 종목 돌아가기 (2026-10-25)
const ROTATE = exParam === 'auto' ? EX.map(e => e.id) : exParam.split(',').map(s => s.trim()).filter(id => EX.some(e => e.id === id));
if (!ROTATE.length) ROTATE.push('squat');
let exIdx = 0, period = ['today', 'week', 'month'].includes(Q.get('period')) ? Q.get('period') : CONFIG.PERIOD;
const FORCE_DEMO = Q.get('demo') === '1';
/* 현황판(board/)에 저장해 둔 선생님 열쇠가 있으면 함께 보냄 → 맞으면 GAS가 전체 이름을 보냄 */
let DASH_KEY = ''; try { DASH_KEY = localStorage.getItem('dashKey') || ''; } catch (e) {}
const ex = () => EX.find(e => e.id === ROTATE[exIdx]);

/* ===== 값 보여 주기 ===== */
function show(e, v, big) {   // big = 큰 숫자 칸용(단위 작게)
  const sm = t => big ? `<small>${t}</small>` : `<small>${t}</small>`;
  if (e.kind === 'time') {
    v = Math.round(v || 0);
    if (v >= 3600) return `${Math.floor(v / 3600)}${sm('시간')} ${Math.floor(v % 3600 / 60)}${sm('분')}`;
    if (v >= 60) return `${Math.floor(v / 60)}${sm('분')} ${v % 60}${sm('초')}`;
    return `${v}${sm('초')}`;
  }
  if (e.kind === 'dist') return `${num(v, e.unit === 'km' ? 1 : 0)}${sm(e.unit)}`;
  return `${num(v)}${sm(e.unit)}`;
}
const plain = (e, v) => show(e, v).replace(/<[^>]+>/g, '');
const mask = n => {
  n = String(n || '');
  if (!CONFIG.MASK || data?.keyOk || n.length < 2) return n;
  return n.length === 2 ? n[0] + '*' : n[0] + '*'.repeat(n.length - 2) + n.at(-1);
};
const PNAME = { today: '오늘', week: '이번 주', month: '이번 달' };
const PNAME_TOPIC = { today: '오늘은', week: '이번 주는', month: '이번 달은' };   // 받침에 맞춘 '은/는'
/* 측정 조건 값 → 읽기 쉬운 말 (숫자면 초로 봄: 30 → 30초, 60 → 1분) */
const condName = c => /^\d+$/.test(String(c)) ? (+c >= 60 && +c % 60 === 0 ? (+c / 60) + '분 측정' : c + '초 측정') : String(c);

/* ===== 시계 ===== */
function tick() { $('clock').textContent = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }); }
tick(); setInterval(tick, 1000);

/* ===== GAS 통신 (JSONP, 현황판과 같은 방식) ===== */
function jsonp(params, timeout = 20000) {
  return new Promise((resolve, reject) => {
    const cb = 'rankcb_' + Date.now() + '_' + Math.floor(Math.random() * 1e4);
    const s = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('시간 초과')); }, timeout);
    function done() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error('연결 실패')); };
    s.crossOrigin = 'anonymous';
    s.src = CONFIG.GAS_URL + '?' + new URLSearchParams({ ...params, token: CONFIG.TOKEN, callback: cb });
    document.head.appendChild(s);
  });
}

/* ===== GAS가 돌려줄 모양 (action=rank&ex=squat&period=week) =====
 * { ok:true, updated:'18:20',
 *   total: 3420, people: 41, avgPer: 83,            // 기간 합계 · 참여 인원 · 1인 평균
 *   allTime: 12850,                                   // 10월부터 학교 전체 누적 (목표 막대)
 *   best:   [{ name, grade, cls, value }],            // 기간 안 1회 최고 기록 (학생당 1개)
 *   growth: [{ name, grade, cls, value, from, to }],  // 처음(또는 지난 기간) 최고 대비 늘어난 %
 *   streak: [{ name, grade, cls, value }],            // 기간 안에 이 종목을 한 날 수
 *   classes:[{ grade, cls, people, avg, sum }],       // 반별 참여 인원 · 1인 평균 · 합계(화면은 합계로 비교)
 *   pbs:    [{ name, grade, cls, value, prev }] }     // 기간 안에 개인 최고를 새로 세운 기록
 * 순위 자르기(학년 묶음 · 상위 N명)는 이 화면이 함 */

/* GAS에 아직 순위 기능이 없을 때 보여 주는 견본 숫자 (이름은 지어낸 것) */
function demoData(e) {
  let seed = [...(e.id + period)].reduce((a, c) => a * 31 + c.charCodeAt(0) >>> 0, 7);
  const rnd = () => (seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296;
  const fam = '김이박최정강조윤장임한오서신권황안송류홍', given = ['서준', '하윤', '도윤', '지우', '시우', '서아', '하준', '지호', '은우', '수아', '예준', '지안', '유준', '하린', '민준', '아린', '주원', '채원', '건우', '윤서'];
  const base = { count: 40, time: 70, dist: 1.6 }[e.kind];
  const kids = Array.from({ length: 60 }, (_, i) => {
    const grade = 1 + (i % 6), cls = 1 + Math.floor(rnd() * 2);
    const best = base * (0.4 + grade * 0.15) * (0.5 + rnd());
    return { name: fam[Math.floor(rnd() * fam.length)] + given[Math.floor(rnd() * given.length)], grade, cls, best };
  });
  const r = v => e.kind === 'dist' ? Math.round(v * 10) / 10 : Math.round(v);
  const mult = { today: 1, week: 4, month: 14 }[period];
  const total = kids.reduce((t, k) => t + k.best * 1.6, 0) * mult / 4;
  return {
    ok: true, updated: '견본',
    total: r(total), people: Math.round(kids.length * { today: .35, week: .75, month: 1 }[period]), avgPer: r(total / kids.length),
    allTime: r(e.goal * (0.25 + rnd() * 0.5)),
    best: kids.map(k => ({ ...k, value: r(k.best) })),
    growth: kids.map(k => ({ ...k, value: Math.round(rnd() * 60) })),
    streak: kids.map(k => ({ ...k, value: 1 + Math.floor(rnd() * { today: 1, week: 5, month: 16 }[period]) })),
    classes: Array.from({ length: 12 }, (_, i) => ({ grade: 1 + (i >> 1), cls: 1 + (i & 1), people: 5 + Math.floor(rnd() * 15), avg: r(base * (0.6 + (i >> 1) * 0.2) * (0.6 + rnd()) * mult / 2) })),
    pbs: kids.slice(0, 8).map(k => ({ ...k, value: r(k.best * 1.1), prev: r(k.best) }))
  };
}

/* ===== 그리기 ===== */
let data = null, tab = 0, tabTimer = null;
const TABS = [
  { k: 'best',   why: () => ex().id === 'bike' ? `${PNAME[period]} 탄 거리를 모두 더한 기록` : `${PNAME[period]} 한 번에 가장 ${ex().kind === 'time' ? '오래' : ex().kind === 'dist' ? '멀리' : '많이'} 한 기록`,
    label: () => ex().id === 'bike' ? '🏆 거리 합계' : '🏆 최고 기록',
    val: (e, v, r) => show(e, v) + (r && r.acc != null ? `<em class="acc${r.acc >= 90 ? ' hi' : r.acc < 60 ? ' lo' : ''}" title="이 기록의 정확도">🎯${r.acc}%</em>` : '') },   // 그 기록의 정확도
  { k: 'growth', why: () => `처음 기록보다 ${ex().kind === 'time' ? '몇 초 더 버텼는지' : ex().kind === 'dist' ? '얼마나 더 멀리 갔는지' : '몇 ' + ex().unit + ' 더 했는지'} · 누구나 1등 할 수 있어요`,
    val: (e, v) => `<span class="up">▲</span>${show(e, v)}` },
  { k: 'streak', why: () => `${PNAME[period]} 이 종목을 한 날 수`, val: (e, v) => `${num(v)}<small>일</small>` },
  { k: 'acc',    why: () => `바른 자세 비율 · ${PNAME[period]} ${data && data.accMin ? data.accMin + (ex().kind === 'time' ? '초' : ex().unit) : ''} 이상 한 친구`,
    val: (e, v) => `${num(v)}<small>%</small>`, need: () => !!data && data.accuracy != null }   // 자세 판정이 있는 종목만
];
/* 지금 보여 줄 순위 (정확도는 자세 판정이 있는 종목만) */
const tabsNow = () => TABS.filter(t => !t.need || t.need());

function renderHead() {
  const e = ex();
  $('exIcon').innerHTML = ICON[e.id] || '';
  $('exName').textContent = e.name + ' 순위';
  $('exTag').textContent = e.tag;
  document.title = e.name + ' · 스마트스포츠실 종목 순위';
  document.querySelectorAll('#period button').forEach(b => b.classList.toggle('on', b.dataset.p === period));
}

function render() {
  const e = ex(), d = data; if (!d) return;
  const P = PNAME[period];
  $('sumLabel').textContent = `${P} 모두 합치면`;
  $('sum').innerHTML = show(e, d.total, true);
  $('sumSub').textContent = (d.avgPer != null ? `1인 평균 ${plain(e, d.avgPer)}` : '') + (d.accuracy != null ? ` · 🎯 정확도 ${d.accuracy}%` : '');
  $('pplLabel').textContent = `${P} 참여한 친구`;
  $('ppl').textContent = num(d.people);
  $('pplSub').textContent = (d.best || []).length ? `최고 기록 ${plain(e, Math.max(...d.best.map(b => b.value)))}` : '';

  // 학교 전체 누적 목표
  $('goalName').textContent = `학교 전체 ${e.name} 도전`;
  $('goalNow').innerHTML = show(e, d.allTime);
  $('goalMax').textContent = '/ ' + plain(e, e.goal);
  $('goalBar').style.width = Math.min(100, e.goal ? d.allTime / e.goal * 100 : 0) + '%';
  $('goalSub').textContent = d.allTime >= e.goal ? '🎉 목표 달성!' : `목표까지 ${plain(e, Math.max(0, e.goal - d.allTime))} · 10월부터 모두 더한 값`;
  $('note').textContent = '순위는 학년 묶음별로 따로 매겨요. 기록·성장·꾸준함' + (d.accuracy != null ? '·정확도' : '') + ' 순위가 차례로 나와요.';

  // 반별: 반 친구들 기록을 모두 더한 합계로 비교(많이 한 반부터). 여럿이 참여할수록 올라감 (2026-10-23, 평균 → 합계)
  const bySum = true;
  const cv = c => bySum ? (c.sum != null ? c.sum : c.avg * c.people) : c.avg;
  const cls = (d.classes || []).filter(c => c.people).slice().sort((a, b) => bySum ? cv(b) - cv(a) : (a.grade - b.grade || String(a.cls).localeCompare(String(b.cls), 'ko')));
  const max = Math.max(0, ...cls.map(cv));
  $('clsLabel').textContent = bySum ? `${P} 반별 합계` : `${P} 반별 1인 평균`;
  $('clsSub').textContent = bySum ? '반 친구들 기록을 더함' : '참여한 친구 기준';
  $('cls').classList.toggle('many', cls.length >= 8);
  $('cls').innerHTML = cls.length ? cls.map(c => `<div class="cr${cv(c) === max ? ' top' : ''}" title="${c.people}명 참여 · 1인 평균 ${plain(e, c.avg)}">
      <span class="c">${c.grade}-${c.cls}</span><span class="w"><i data-w="${max ? cv(c) / max * 100 : 0}"></i></span><span class="n">${plain(e, cv(c))}${c.acc != null ? `<small class="acc">${c.acc}%</small>` : ''}</span></div>`).join('')
    : '<div class="label">아직 기록이 없어요</div>';
  if (cls.some(c => c.acc != null)) $('clsSub').textContent = '반 친구들 기록을 더함 · 초록은 정확도';
  requestAnimationFrame(() => document.querySelectorAll('.cr .w i').forEach(i => i.style.width = Math.max(2, i.dataset.w) + '%'));

  renderTab(true);   // 데이터만 새로 고침: 순위 넘기는 시간은 이어서 셈
  drawTicker();
}

/* keep=true면 진행 중인 타이머를 그대로 두고 내용만 다시 그림(1분마다 데이터 새로 고침할 때) */
function renderTab(keep = false) {
  const d = data; if (!d) return;
  const T = tabsNow(); if (tab >= T.length) tab = 0;
  const e = ex(), t = T[tab];
  $('tabs').querySelector('[data-k="acc"]').hidden = !T.some(x => x.k === 'acc');
  document.querySelectorAll('#tabs .t').forEach(b => b.classList.toggle('on', b.dataset.k === t.k));
  $('why').textContent = t.why();
  $('tabs').querySelector('[data-k="best"]').textContent = TABS[0].label();   // 자전거는 '거리 합계'
  const list = (d[t.k] || []).filter(r => r.value > 0);
  $('bands').innerHTML = CONFIG.BANDS.map(b => {
    let rows = list.filter(r => b.grades.includes(+r.grade));
    // 최고 기록은 측정 조건(30초·1분 모드 등)이 같은 것끼리만 비교 → 이 학년 묶음에서 가장 많이 한 조건
    let condTxt = '';
    if (t.k === 'best' && rows.some(r => r.cond)) {
      const cnt = {}; rows.forEach(r => cnt[r.cond] = (cnt[r.cond] || 0) + 1);
      const c = Object.keys(cnt).sort((x, y) => cnt[y] - cnt[x])[0];
      rows = rows.filter(r => String(r.cond) === c);
      condTxt = `<small class="cond">${esc(condName(c))}</small>`;
    }
    const top = rows.sort((x, y) => y.value - x.value).slice(0, CONFIG.TOP_N);
    return `<div class="band"><h3>${b.name}${condTxt}</h3>` + (top.length
      ? top.map((r, i) => { r._rank = i && top[i - 1].value === r.value ? top[i - 1]._rank : i + 1; return r; }).map(r => `<div class="rk${r._rank <= 3 ? ' m' + r._rank : ''}"><span class="no">${r._rank}</span><span class="nm">${esc(mask(r.name))}<small>${esc(r.grade)}학년 ${esc(r.cls)}반</small></span>${(() => { const h = t.val(e, r.value, r); const len = h.replace(/<em[\s\S]*?<\/em>/g, '').replace(/<[^>]+>/g, '').length; return `<span class="v${len > 5 ? ' long' : ''}">${h}</span>`; })()}</div>`).join('')
      : `<div class="none">${PNAME_TOPIC[period]} 아직 기록이 없어요.<br>첫 번째 주인공이 되어 보세요!</div>`) + '</div>';
  }).join('');
  if (keep && tabTimer) return;
  if (tab === T.length - 1) prefetchNext();        // 마지막 순위가 나오는 동안 다음 종목 미리 받기
  // 다음 순위로 넘어가기까지 남은 시간 막대
  const bar = $('tabBar').firstElementChild;
  bar.style.transition = 'none'; bar.style.width = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${CONFIG.TAB_SEC}s linear`; bar.style.width = '100%'; }));
  clearTimeout(tabTimer);
  tabTimer = setTimeout(() => {
    tabTimer = null;
    // 순서: 최고 기록 → 성장 → 꾸준함 → (정확도). 마지막까지 보여 준 뒤 종목이 여러 개면 다음 종목의 최고 기록부터
    const n = tabsNow().length;
    if (tab >= n - 1 && ROTATE.length > 1) return setEx(exIdx + 1);
    tab = (tab + 1) % n; renderTab();
  }, CONFIG.TAB_SEC * 1000);
}

/* 아래 띠: 기간 안에 개인 최고 기록을 새로 세운 친구 */
let tickKey = '';
function drawTicker() {
  const e = ex(), track = $('tickTrack');
  const pbs = (data?.pbs || []).filter(p => p.value > 0);
  let html, run = false;
  if (!pbs.length) html = `<span class="msg">${PNAME[period]} 새로운 개인 최고 기록을 기다리고 있어요 · 어제의 나를 이겨 보세요!</span>`;
  else {
    html = pbs.map(p => `<span class="tk">${esc(mask(p.name))}<small>${esc(p.grade)}-${esc(p.cls)}</small> ${plain(e, p.value)}` +
      (p.prev ? ` <em>▲ ${plain(e, Math.max(0, p.value - p.prev))}</em>` : '') + '</span>').join('');
    run = true;
  }
  if (html === tickKey) return;
  tickKey = html;
  track.classList.remove('run'); track.innerHTML = html;
  if (!run) return;
  const wrapW = $('tickWrap').clientWidth;
  let reps = 1;
  while (track.scrollWidth < wrapW && reps < 20) { reps++; track.innerHTML = html.repeat(reps); }
  track.innerHTML += track.innerHTML;
  const dist = track.scrollWidth / 2;
  track.style.setProperty('--dur', Math.max(10, dist / (wrapW * 0.09)).toFixed(1) + 's');
  void track.offsetWidth; track.classList.add('run');
}

/* ===== 불러오기 ===== */
let seq = 0;
/* 종목·기간별로 마지막으로 받은 데이터를 기억 → 종목이 바뀌어도 바로 보여 주고 뒤에서 새로 받음
 * 견본 숫자는 ?demo=1 일 때만 (예전에는 응답이 늦으면 견본으로 채워 '견본 데이터'가 종종 보였음) */
const store = {};
const keyOf = (id = ex().id) => id + '|' + period;
let retryTimer = null;

async function fetchRank(id) {
  const q = { action: 'rank', ex: id, period }; if (DASH_KEY) q.key = DASH_KEY;
  let d;
  try { d = await jsonp(q, 40000); }
  catch (e1) { await new Promise(r => setTimeout(r, 3000)); d = await jsonp(q, 40000); }   // 한 번 더
  if (!d || !d.ok) { const er = new Error(d && d.error || '순위를 불러오지 못했어요'); er.server = true; throw er; }
  store[id + '|' + period] = d;
  return d;
}

/* 데이터가 아직 없을 때 화면: 숫자 칸은 '-', 가운데에 안내 */
function renderLoading(msg) {
  ['sum', 'ppl'].forEach(id => $(id).textContent = '-');
  ['sumSub', 'pplSub', 'why'].forEach(id => $(id).textContent = '');
  $('goalNow').textContent = '-'; $('goalBar').style.width = '0';
  $('bands').innerHTML = `<div class="band" style="grid-column:1/-1;justify-content:center;align-items:center;text-align:center"><div class="none">${esc(msg)}</div></div>`;
  $('cls').innerHTML = '';
}

async function load() {
  const my = ++seq, e = ex(), k = keyOf();
  clearTimeout(retryTimer);
  if (FORCE_DEMO) { data = demoData(e); document.body.classList.add('demo'); $('status').textContent = '견본 숫자'; render(); return; }
  document.body.classList.remove('demo');
  if (store[k] && data !== store[k]) { data = store[k]; render(); }              // 기억해 둔 것 먼저
  else if (!store[k]) renderLoading(`${e.name} 순위를 불러오는 중이에요…`);
  try {
    const d = await fetchRank(e.id);
    if (my !== seq) return;
    data = d;
    $('status').textContent = (d.updated || '') + ' 기준'; $('status').classList.remove('off');
    render();
  } catch (err) {
    if (my !== seq) return;
    const why = !navigator.onLine ? '인터넷 연결 끊김' : err.server ? '서버 오류: ' + err.message : '서버 응답이 늦어요';
    $('status').textContent = why + ' · 다시 시도 중'; $('status').classList.add('off');
    if (!data) renderLoading(`${e.name} 순위를 불러오지 못했어요. 잠시 뒤 다시 시도해요.`);
    retryTimer = setTimeout(() => { if (my === seq) load(); }, 15000);
  }
}

/* 다음 종목을 미리 받아 둠 (종목이 넘어가는 순간 기다리지 않게) */
function prefetchNext() {
  if (ROTATE.length < 2 || FORCE_DEMO) return;
  const id = ROTATE[(exIdx + 1) % ROTATE.length];
  if (!store[id + '|' + period]) fetchRank(id).catch(() => {});
}

/* ===== 종목·기간 바꾸기 ===== */
function setEx(i) { clearTimeout(tabTimer); tabTimer = null; exIdx = (i + ROTATE.length) % ROTATE.length; tab = 0; tickKey = ''; data = store[keyOf()] || null; renderHead(); load(); }
document.querySelectorAll('#period button').forEach(b => b.onclick = () => {
  period = b.dataset.p; tickKey = '';
  const u = new URL(location.href); u.searchParams.set('period', period); history.replaceState(null, '', u);
  clearTimeout(tabTimer); tabTimer = null; tab = 0;
  renderHead(); load();
});
document.querySelectorAll('#tabs .t').forEach(b => b.onclick = () => { const i = tabsNow().findIndex(t => t.k === b.dataset.k); if (i >= 0) { tab = i; renderTab(); } });
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') setEx(exIdx + 1);
  else if (e.key === 'ArrowLeft') setEx(exIdx - 1);
});
addEventListener('resize', () => { tickKey = ''; drawTicker(); });

renderHead(); load();
setInterval(() => { if (!document.hidden) load(); }, CONFIG.REFRESH_SEC * 1000);
setTimeout(() => location.reload(), CONFIG.RELOAD_HOURS * 3600 * 1000);

/* 화면을 누르면 전체 화면 */
document.addEventListener('click', e => {
  if (e.target.closest('button, a')) return;
  if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
});
</script>
<script src="../nav.js" defer></script>
</body>
